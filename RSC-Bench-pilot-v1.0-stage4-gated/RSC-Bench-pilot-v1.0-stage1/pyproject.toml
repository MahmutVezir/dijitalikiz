[project]
name = "rsc-bench"
version = "0.1.0"
description = "Experimental infrastructure for RSC-Bench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "pyarrow>=17,<19",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
    "tenacity>=9,<10",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
