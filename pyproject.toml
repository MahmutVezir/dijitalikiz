[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dijitalikiz"
version = "0.1.0"
description = "RSC-Bench research scaffold for CCDG-based root-cause diagnosis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dijitalikiz = "dijitalikiz.cli:main"

[tool.setuptools]
packages = ["dijitalikiz"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23"]
