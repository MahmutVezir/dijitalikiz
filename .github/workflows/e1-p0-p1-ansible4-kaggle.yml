name: E1 P0 vs P1 Ansible-4 engineering smoke on Kaggle

on:
  push:
    branches:
      - research/e1-p0-p1-ansible4-smoke-2026-10-22
    paths:
      - ".github/workflows/e1-p0-p1-ansible4-kaggle.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-p0-p1-ansible4-smoke-2026-10-22
  cancel-in-progress: false

jobs:
  run-isolated-e1-smoke:
    if: github.ref == 'refs/heads/research/e1-p0-p1-ansible4-smoke-2026-10-22' && contains(github.event.head_commit.message, '[e1-p0-p1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout isolated smoke branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing KAGGLE_API_TOKEN secret"; exit 1; }
          echo "::add-mask::$KAGGLE_API_TOKEN"
          python -m pip install --upgrade kaggle
          kaggle --version
          kaggle kernels list --mine --page-size 5
          mkdir -p "$RUNNER_TEMP/e1-p0-p1-ansible4"
          echo "E1_SMOKE_DIR=$RUNNER_TEMP/e1-p0-p1-ansible4" >> "$GITHUB_ENV"

      - name: Download and verify the pinned Ansible-4 technical evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$E1_SMOKE_DIR/ansible-4.zip"
          DEST="$E1_SMOKE_DIR/evidence"
          mkdir -p "$DEST"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MahmutVezir/dijitalikiz/actions/artifacts/12442047158/zip" \
            --output "$ZIP"
          printf '%s  %s\n' "5beae32ce486b170ad69082cd9e3d40c695e8668f3e240328f64b2992445cc6b" "$ZIP" | sha256sum --check -
          unzip -q "$ZIP" -d "$DEST"
          cd "$DEST"
          sha256sum --check SHA256SUMS
          printf '%s  %s\n' "6da14a39e2da36bf83d08808686d58c26caae944578e52bad4588e1b33987c1e" buggy-test.log | sha256sum --check -
          printf '%s  %s\n' "ffa1bb172249904a54b999ec06ceda90d7469e0f2e9d7b7869075b0c448712e5" bug_patch.txt | sha256sum --check -
          printf '%s  %s\n' "6297c1c55eaebe36e77574ba9186a98d68d864a380738c8dea84afbf169201e5" fixed-test.log | sha256sum --check -
          grep -Fq 'python_version="3.6.9"' bug.info
          grep -Fq '1 passed' fixed-test.log
          echo "E1 evidence artifact, patch, buggy failure, and patched-tree passing test were hash-verified."

      - name: Pin exact frozen PR-75 policy and build the E1 packet
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 394c16dd04771cd6f75f69350792ef17a6deb825
          git show 394c16dd04771cd6f75f69350792ef17a6deb825:research_candidates/evidence_abstention/implementation/uncertainty_policy.py > "$E1_SMOKE_DIR/uncertainty_policy.py"
          test "$(git hash-object "$E1_SMOKE_DIR/uncertainty_policy.py")" = "e27ebef62c38fd42472d37afd508bcaa3bbbd2d8"

          python - "$E1_SMOKE_DIR/evidence" "$E1_SMOKE_DIR" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          evidence_dir = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])
          def read(name):
              return (evidence_dir / name).read_text(encoding="utf-8")
          files = {
              "buggy_test_log_raw": "buggy-test.log",
              "patch_raw": "bug_patch.txt",
              "fixed_test_log_raw": "fixed-test.log"
          }
          evidence_hashes = {
              key: hashlib.sha256(read(filename).encode("utf-8")).hexdigest()
              for key, filename in files.items()
          }
          expected = {
              "buggy_test_log_raw": "6da14a39e2da36bf83d08808686d58c26caae944578e52bad4588e1b33987c1e",
              "patch_raw": "ffa1bb172249904a54b999ec06ceda90d7469e0f2e9d7b7869075b0c448712e5",
              "fixed_test_log_raw": "6297c1c55eaebe36e77574ba9186a98d68d864a380738c8dea84afbf169201e5"
          }
          if evidence_hashes != expected:
              raise SystemExit("Pinned source evidence SHA mismatch: " + json.dumps(evidence_hashes))
          info, project, run_test = read("bug.info"), read("project.info"), read("run_test.sh")
          model_evidence = {
              "case_metadata": (
                  "BugsInPy case: BugsInPy-ansible-4\n"
                  "Source repository: https://github.com/ansible/ansible\n"
                  "Buggy commit from dataset metadata: d91658ec0c8434c82c3ef98bfe9eb4e1027a43a3\n"
                  "Recorded fixed commit reference: 18a66e291dad71128a32d662aa808213acefe0e9\n"
                  "Target test: test/units/playbook/test_collectionsearch.py::test_collection_static_warning\n"
                  "Recorded Python: 3.6.9\nMetadata bug.info:\n" + info +
                  "\nproject.info:\n" + project + "\nrun_test.sh:\n" + run_test
              ),
              "buggy_test_log_raw": read("buggy-test.log"),
              "patch_raw": read("bug_patch.txt"),
              "fixed_test_log_raw": read("fixed-test.log")
          }
          gold = (
              "On templated collection names, CollectionSearch._load_collections fails "
              "to emit the expected non-templatable warning; the collection field also "
              "needs the static and always_post_validate metadata shown in the patch."
          )
          packet = {
              "record_type": "isolated_E1_engineering_smoke_not_confirmatory",
              "case": {
                  "case_id": "BugsInPy-ansible-4",
                  "model_evidence": model_evidence,
                  "evidence_sha256": evidence_hashes,
                  "gold_root_cause_for_scoring_only": gold
              },
              "gold_root_cause_for_scoring_only": gold,
              "evidence_bundle_sha256": "5beae32ce486b170ad69082cd9e3d40c695e8668f3e240328f64b2992445cc6b",
              "frozen_policy_sha256": hashlib.sha256((output_dir / "uncertainty_policy.py").read_bytes()).hexdigest(),
              "official_manifest_modified": False,
              "confirmatory_case": False,
              "gold_root_cause_must_not_be_in_prompt": True
          }
          (output_dir / "e1_evidence_packet.json").write_text(json.dumps(packet, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "case_id": packet["case"]["case_id"],
              "evidence_level": "E1",
              "evidence_hashes_verified": True,
              "buggy_test_failed": "FAILED test/units/playbook/test_collectionsearch.py::test_collection_static_warning" in model_evidence["buggy_test_log_raw"],
              "patched_tree_test_passed": "1 passed" in model_evidence["fixed_test_log_raw"],
              "complete_patch_present": len(model_evidence["patch_raw"]) > 500,
              "gold_root_cause_separate_from_model_evidence": True,
              "official_manifest_modified": False,
              "frozen_policy_sha256": packet["frozen_policy_sha256"]
          }, indent=2))
          PY

      - name: Build corrected P0/P1 kernel with rubric v2 and strict abstention parsing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kaggle-e1-p0-p1
          python - "$E1_SMOKE_DIR" <<'PY'
          import base64, hashlib, json, py_compile, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          evidence_b64 = base64.b64encode((root / "e1_evidence_packet.json").read_bytes()).decode("ascii")
          policy_b64 = base64.b64encode((root / "uncertainty_policy.py").read_bytes()).decode("ascii")
          template = Path("research_candidates/evidence_abstention/engineering_smoke/e1_p0_p1_ansible4_kernel.py.template").read_text(encoding="utf-8")
          kernel = template.replace("__EVIDENCE_B64__", evidence_b64).replace("__POLICY_B64__", policy_b64)
          if "__EVIDENCE_B64__" in kernel or "__POLICY_B64__" in kernel:
              raise SystemExit("Missing embedded-payload substitution")
          output = Path(".kaggle-e1-p0-p1/kernel.py")
          output.write_text(kernel, encoding="utf-8")
          py_compile.compile(str(output), doraise=True)
          print(json.dumps({
              "kernel_bytes": output.stat().st_size,
              "kernel_sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
              "evidence_packet_sha256": hashlib.sha256((root / "e1_evidence_packet.json").read_bytes()).hexdigest(),
              "frozen_policy_sha256": hashlib.sha256((root / "uncertainty_policy.py").read_bytes()).hexdigest(),
              "conditions": ["P0", "P1"],
              "generations_per_condition": 5,
              "gold_root_cause_in_prompt": False
          }, indent=2))
          PY
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          KERNEL_SLUG="qwen-e1-p0-p1-ansible4-$SHORT_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          KERNEL_REF="mahmutvezir/$KERNEL_SLUG"
          echo "E1_KAGGLE_KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"
          cat > .kaggle-e1-p0-p1/kernel-metadata.json <<EOF
          {
            "id": "$KERNEL_REF",
            "title": "$KERNEL_SLUG",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          python -m json.tool .kaggle-e1-p0-p1/kernel-metadata.json >/dev/null
          echo "scoring_rubric=ansible4-root-cause-rubric-v2"
          echo "abstention_parser=explicit_boolean_or_exact_decision_label"
          sha256sum .kaggle-e1-p0-p1/kernel.py .kaggle-e1-p0-p1/kernel-metadata.json

      - name: Submit private Kaggle GPU kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-e1-p0-p1

      - name: Wait for paired P0/P1 generations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$E1_SMOKE_DIR/diagnostics"
          for attempt in $(seq 1 220); do
            status="$(kaggle kernels status "$E1_KAGGLE_KERNEL_REF" 2>&1 || true)"
            echo "$status"
            printf '%s\n' "$status" > "$E1_SMOKE_DIR/diagnostics/kernel-status.txt"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              kaggle kernels logs "$E1_KAGGLE_KERNEL_REF" > "$E1_SMOKE_DIR/diagnostics/kaggle-kernel.log" 2>&1 || true
              exit 0
            fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              kaggle kernels logs "$E1_KAGGLE_KERNEL_REF" > "$E1_SMOKE_DIR/diagnostics/kaggle-kernel.log" 2>&1 || true
              cat "$E1_SMOKE_DIR/diagnostics/kaggle-kernel.log" || true
              exit 1
            fi
            sleep 60
          done
          kaggle kernels logs "$E1_KAGGLE_KERNEL_REF" > "$E1_SMOKE_DIR/diagnostics/kaggle-kernel.log" 2>&1 || true
          cat "$E1_SMOKE_DIR/diagnostics/kaggle-kernel.log" || true
          exit 1

      - name: Download and verify generated outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$E1_SMOKE_DIR/results"
          kaggle kernels output "$E1_KAGGLE_KERNEL_REF" -p "$E1_SMOKE_DIR/results" --force
          for required in raw_model_outputs.jsonl token_logits_top5.jsonl decision_matrix.json E1_P0_P1_REPORT.md scoring_rubric.json SHA256SUMS; do
            test -n "$(find "$E1_SMOKE_DIR/results" -name "$required" -type f -print -quit)" || {
              echo "Missing output: $required"
              find "$E1_SMOKE_DIR/results" -type f -print
              exit 1
            }
          done
          SUMS="$(find "$E1_SMOKE_DIR/results" -name SHA256SUMS -type f -print -quit)"
          (cd "$(dirname "$SUMS")" && sha256sum --check SHA256SUMS)
          mkdir -p e1-p0-p1-output
          cp -a "$E1_SMOKE_DIR/results/." e1-p0-p1-output/
          cp "$E1_SMOKE_DIR/e1_evidence_packet.json" e1-p0-p1-output/ 2>/dev/null || true
          printf 'kaggle_kernel_ref=%s\nsource_commit=%s\nrun_type=E1-engineering-smoke-not-confirmatory\nofficial_manifest_modified=false\n' "$E1_KAGGLE_KERNEL_REF" "$GITHUB_SHA" > e1-p0-p1-output/GITHUB_RUN_INFO.txt
          cp "$E1_SMOKE_DIR/diagnostics/"* e1-p0-p1-output/ 2>/dev/null || true

      - name: Upload E1 smoke results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen-e1-p0-p1-ansible4-${{ github.run_id }}
          path: |
            e1-p0-p1-output/
            ${{ runner.temp }}/e1-p0-p1-ansible4/diagnostics/
          if-no-files-found: warn
          retention-days: 30
