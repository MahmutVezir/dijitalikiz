name: Evidence Abstention V12 Technical Screen (Manual, No Model Inference)

# Rebuild a new V12 metadata intake using the corrected 105-ID exposure union.
# Do not reuse any V11 test-exposed cases. No model inference is performed.
on:
  workflow_dispatch:
    inputs:
      batch_offset:
        description: "V12 metadata cohort offset; use multiples of 8. Offset 0 is the frozen first batch."
        required: true
        type: number
        default: 0
      batch_size:
        description: "Technical screening batch size. Keep at 8."
        required: true
        type: number
        default: 8
      confirm_dataset_license:
        description: "Confirm written BugsInPy dataset permission or approved licensed replacement."
        required: true
        type: boolean
        default: false
      confirm_upstream_licenses:
        description: "Confirm exact buggy/fixed upstream project licenses are reviewed."
        required: true
        type: boolean
        default: false
      confirm_protocol_frozen:
        description: "Confirm the technical screening protocol and case-selection hashes are frozen."
        required: true
        type: boolean
        default: false
      confirm_technical_screen:
        description: "Explicitly authorize this no-inference technical screening run."
        required: true
        type: boolean
        default: false
concurrency:
  group: evidence-abstention-v12-technical-screen-${{ github.ref }}-${{ github.event.inputs.batch_offset || '0' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freeze_batch:
    name: Rebuild V12 intake and freeze selected batch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
    env:
      BUGSINPY_COMMIT: "11c5f1eea954a42132cfd06bf257766a7963e0fd"
      BATCH_OFFSET: ${{ github.event.inputs.batch_offset || '0' }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '8' }}
    steps:
      - name: Checkout research repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up builder Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Require explicit license, protocol and manual authorization
        shell: bash
        env:
          CONFIRM_DATASET_LICENSE: ${{ github.event.inputs.confirm_dataset_license }}
          CONFIRM_UPSTREAM_LICENSES: ${{ github.event.inputs.confirm_upstream_licenses }}
          CONFIRM_PROTOCOL_FROZEN: ${{ github.event.inputs.confirm_protocol_frozen }}
          CONFIRM_TECHNICAL_SCREEN: ${{ github.event.inputs.confirm_technical_screen }}
        run: |
          set -euo pipefail
          test "$BATCH_SIZE" = "8"
          test "$CONFIRM_DATASET_LICENSE" = "true"
          test "$CONFIRM_UPSTREAM_LICENSES" = "true"
          test "$CONFIRM_PROTOCOL_FROZEN" = "true"
          test "$CONFIRM_TECHNICAL_SCREEN" = "true"
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("research_candidates/evidence_abstention/UNCERTAINTY_EXPERIMENT_MANIFEST.json").read_text(encoding="utf-8"))
          assert m.get("dataset_license_status") == "cleared", "dataset-level permission/license is not cleared"
          assert m.get("upstream_project_license_status") == "cleared", "exact upstream project licenses are not cleared"
          assert m.get("technical_screen_protocol_status") == "frozen", "technical screen protocol is not frozen"
          assert m.get("technical_screen_authorized") is True, "technical screen is not authorized in the manifest"
          assert m.get("permanent_exclusion_count") == 105, "manifest must pin 105 permanent exposure exclusions"
          assert m.get("exposure_union_path") == "research_candidates/evidence_abstention/EXPOSURE_UNION_2026-11-11.json"
          assert m.get("exposure_union_sha256") == "9f41451bb06582ea65647f67829e97ac190cb884946b1f4f09c75d8167acb7c1"
          print("PASS: explicit license/protocol/manual gates; no inference")
          PY

      - name: Test metadata and matrix builders
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_inventory_bugsinpy_candidates.py' -v
          python -m unittest discover -s tests -p 'test_build_evidence_abstention_screening_queue.py' -v
          python -m unittest discover -s tests -p 'test_build_evidence_abstention_intake.py' -v
          python -m unittest discover -s tests -p 'test_build_evidence_abstention_cohort_matrix.py' -v
          python -m unittest discover -s tests -p 'test_evidence_abstention_requires_pytest.py' -v

      - name: Fetch exact pinned BugsInPy metadata tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/soarsmu/BugsInPy.git "$RUNNER_TEMP/BugsInPy"
          git -C "$RUNNER_TEMP/BugsInPy" checkout --detach "$BUGSINPY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/BugsInPy" rev-parse HEAD)" = "$BUGSINPY_COMMIT"

      - name: Rebuild inventory and 105-exclusion screening queue
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventory_bugsinpy_candidates.py \
            --root "$RUNNER_TEMP/BugsInPy" \
            --output "$RUNNER_TEMP/bugsinpy-metadata-inventory.csv" \
            --summary "$RUNNER_TEMP/bugsinpy-metadata-inventory-summary.json" \
            --expected-commit "$BUGSINPY_COMMIT" \
            --expected-count 501
          python scripts/build_evidence_abstention_screening_queue.py \
            --input "$RUNNER_TEMP/bugsinpy-metadata-inventory.csv" \
            --output "$RUNNER_TEMP/bugsinpy-screening-queue.csv" \
            --summary "$RUNNER_TEMP/bugsinpy-screening-queue-summary.json" \
            --first-batch-per-project 5 \
            --exposure-addendum research_candidates/evidence_abstention/EXPOSURE_UNION_2026-11-11.json
          python scripts/build_evidence_abstention_intake.py \
            --inventory "$RUNNER_TEMP/bugsinpy-metadata-inventory.csv" \
            --queue "$RUNNER_TEMP/bugsinpy-screening-queue.csv" \
            --output "$RUNNER_TEMP/SCREENING_COHORT_100_V12_2026-11-12.json" \
            --size 100 \
            --minimum-projects 8 \
            --exposure-addendum research_candidates/evidence_abstention/EXPOSURE_UNION_2026-11-11.json \
            --created-on 2026-11-12

      - name: Freeze the V12 matrix after corrected exposure exclusions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_evidence_abstention_cohort_matrix.py \
            --queue "$RUNNER_TEMP/bugsinpy-screening-queue.csv" \
            --cohort "$RUNNER_TEMP/SCREENING_COHORT_100_V12_2026-11-12.json" \
            --matrix-output "$RUNNER_TEMP/cohort-screen-matrix.json" \
            --summary-output "$RUNNER_TEMP/cohort-screen-summary.json" \
            --batch-size "$BATCH_SIZE" \
            --batch-offset "$BATCH_OFFSET"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          inventory = json.loads((root / "bugsinpy-metadata-inventory-summary.json").read_text(encoding="utf-8"))
          queue = json.loads((root / "bugsinpy-screening-queue-summary.json").read_text(encoding="utf-8"))
          cohort = json.loads((root / "SCREENING_COHORT_100_V12_2026-11-12.json").read_text(encoding="utf-8"))
          summary = json.loads((root / "cohort-screen-summary.json").read_text(encoding="utf-8"))
          matrix = json.loads((root / "cohort-screen-matrix.json").read_text(encoding="utf-8"))
          rows = matrix.get("include", [])
          assert inventory["raw_metadata_cases_in_inventory"] == 501, inventory
          assert queue["documented_exposure_exclusion_count"] == 105, queue
          assert queue["total_documented_exposure_exclusion_count"] == 105, queue
          assert cohort["cohort_size"] == 100, cohort
          assert cohort["upstream_project_count"] >= 8, cohort
          assert cohort["accepted_confirmatory_cases"] == 0, cohort
          assert cohort["llm_inference_performed"] is False, cohort
          assert len(rows) == 8, rows
          assert len({row["project"] for row in rows}) == 8, rows
          assert summary["distinct_upstream_projects"] == 8, summary
          assert summary["accepted_confirmatory_cases"] == 0, summary
          assert summary["llm_inference_performed"] is False, summary
          committed_cohort = json.loads(pathlib.Path("research_candidates/evidence_abstention/generated_v12/SCREENING_COHORT_100_V12_2026-11-12.json").read_text(encoding="utf-8"))
          assert cohort["case_ids"] == committed_cohort["case_ids"], "rebuilt V12 cohort differs from committed 100-case index"
          if int(os.environ["BATCH_OFFSET"]) == 0:
              committed_first_batch = json.loads(pathlib.Path("research_candidates/evidence_abstention/generated_v12/V12_FIRST_BATCH_SELECTION_2026-11-12.json").read_text(encoding="utf-8"))
              expected_ids = [row["case_id"] for row in committed_first_batch["cases"]]
              assert summary["case_ids"] == expected_ids, "rebuilt first batch differs from committed V12 selection"
          print(json.dumps({
              "status": "PASS_V12_BATCH_FROZEN",
              "batch_offset": summary["batch_offset"],
              "case_ids": summary["case_ids"],
              "projects": summary["upstream_projects"],
              "accepted_confirmatory_cases": 0,
              "llm_inference_performed": False
          }, ensure_ascii=False, indent=2))
          PY

      - name: Export matrix and full selection provenance
        id: export
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(jq -c '.include' "$RUNNER_TEMP/cohort-screen-matrix.json")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/v12-screen-freeze"
          cp "$RUNNER_TEMP/bugsinpy-metadata-inventory.csv" "$RUNNER_TEMP/v12-screen-freeze/"
          cp "$RUNNER_TEMP/bugsinpy-metadata-inventory-summary.json" "$RUNNER_TEMP/v12-screen-freeze/"
          cp "$RUNNER_TEMP/bugsinpy-screening-queue.csv" "$RUNNER_TEMP/v12-screen-freeze/"
          cp "$RUNNER_TEMP/bugsinpy-screening-queue-summary.json" "$RUNNER_TEMP/v12-screen-freeze/"
          cp "$RUNNER_TEMP/SCREENING_COHORT_100_V12_2026-11-12.json" "$RUNNER_TEMP/v12-screen-freeze/"
          cp "$RUNNER_TEMP/cohort-screen-matrix.json" "$RUNNER_TEMP/v12-screen-freeze/"
          cp "$RUNNER_TEMP/cohort-screen-summary.json" "$RUNNER_TEMP/v12-screen-freeze/"
          cd "$RUNNER_TEMP/v12-screen-freeze"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload V12 batch selection freeze
        uses: actions/upload-artifact@v4
        with:
          name: evidence-abstention-v12-batch-${{ github.event.inputs.batch_offset || '0' }}-freeze
          path: ${{ runner.temp }}/v12-screen-freeze/
          if-no-files-found: error
          retention-days: 90

  technical_case_screen:
    name: ${{ matrix.case_id }} (Python ${{ matrix.python_version }})
    needs: freeze_batch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.freeze_batch.outputs.matrix) }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      BUGSINPY_COMMIT: "11c5f1eea954a42132cfd06bf257766a7963e0fd"
    steps:
      - name: Checkout research branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Initialize fail-closed case record
        shell: bash {0}
        env:
          CASE_ID: ${{ matrix.case_id }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
          EXPECTED_BUGGY: ${{ matrix.buggy_commit }}
          EXPECTED_FIXED: ${{ matrix.fixed_commit }}
          EXPECTED_RUN_TEST_SHA256: ${{ matrix.run_test_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/case-artifact"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"case-artifact"/"summary.json"
          p.write_text(json.dumps({
            "case_id":os.environ["CASE_ID"],
            "dataset_recorded_python":os.environ["EXPECTED_PYTHON"],
            "runtime_python_observed":None,
            "runtime_matches_metadata":False,
            "expected_buggy_commit":os.environ["EXPECTED_BUGGY"],
            "observed_buggy_base_commit":None,
            "expected_fixed_commit_reference":os.environ["EXPECTED_FIXED"],
            "observed_fixed_base_commit":None,
            "expected_run_test_sha256":os.environ["EXPECTED_RUN_TEST_SHA256"],
            "buggy_target_test_exit_code":None,
            "fixed_target_test_exit_code":None,
            "buggy_failure_signature_present":False,
            "fixed_pass_marker_present":False,
            "setup_status":"not_started",
            "confirmatory_eligible":False,
            "accepted_for_confirmatory":False,
            "license_reviewed":False,
            "ground_truth_reviewed_by_two":False,
            "evidence_levels_reviewed_by_two":False,
            "leakage_and_prior_exposure_reviewed":False,
            "llm_inference_performed":False
          },indent=2)+"\n",encoding="utf-8")
          PY
          printf '%s\n' "${{ matrix.case_id }}" > "$RUNNER_TEMP/case-artifact/case-id.txt"

      - name: Set up exact dataset-recorded Python
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: case-screen
          python-version: "${{ matrix.python_version }}"
          channels: conda-forge
          channel-priority: strict
          use-only-tar-bz2: true

      - name: Prepare pinned runner compatibility tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compat-bin"
          cat > "$RUNNER_TEMP/compat-bin/dos2unix" <<'PY'
          #!/usr/bin/env python3
          import pathlib
          import sys

          if sys.argv[1:] == ["--version"]:
              print("dos2unix 0.0.0-study-compat")
              raise SystemExit(0)

          if len(sys.argv) < 2:
              raise SystemExit("usage: dos2unix FILE [FILE ...]")

          for name in sys.argv[1:]:
              path = pathlib.Path(name)
              raw = path.read_bytes()
              if raw.startswith((b"\xff\xfe", b"\xfe\xff")):
                  text = raw.decode("utf-16")
              elif raw.count(b"\x00") > len(raw) // 5:
                  text = raw.decode("utf-16-le")
              else:
                  text = raw.decode("utf-8-sig")
              text = text.replace("\r\n", "\n").replace("\r", "\n")
              path.write_bytes(text.encode("utf-8"))
              print(f"converted {path} to UTF-8 Unix line endings")
          PY
          chmod +x "$RUNNER_TEMP/compat-bin/dos2unix"
          export PATH="$RUNNER_TEMP/compat-bin:$PATH"
          echo "$RUNNER_TEMP/compat-bin" >> "$GITHUB_PATH"

          # Ubuntu 24.04 runner images provide the compiler toolchain needed
          # for legacy Python packages; fail explicitly if a required tool
          # is unexpectedly absent instead of installing packages via apt.
          for tool in gcc g++ make; do
            command -v "$tool" >/dev/null
          done
          gcc --version | sed -n '1p'
          g++ --version | sed -n '1p'
          make --version | sed -n '1p'
          dos2unix --version

          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / "requirements.txt"
              path.write_bytes("alpha==1.0\r\nbeta==2.0\r\n".encode("utf-16"))
              subprocess.run(["dos2unix", str(path)], check=True)
              assert path.read_bytes() == b"alpha==1.0\nbeta==2.0\n"
          print("DOS2UNIX_COMPAT_SELF_TEST=PASS")
          PY

          # Upstream BugsInPy tooling edits and sources ~/.bashrc during compile.
          touch "$HOME/.bashrc"
          python - <<'PY'
          import os, platform, sys
          expected=os.environ["EXPECTED_PYTHON"]
          actual=platform.python_version()
          print("expected_python="+expected)
          print("actual_python="+actual)
          print("executable="+sys.executable)
          if actual != expected:
              raise SystemExit("runtime Python does not exactly match pinned BugsInPy metadata")
          PY
        env:
          EXPECTED_PYTHON: ${{ matrix.python_version }}

      - name: Verify pinned metadata, test command and source hashes
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/soarsmu/BugsInPy.git "$RUNNER_TEMP/BugsInPy"
          git -C "$RUNNER_TEMP/BugsInPy" checkout --detach "$BUGSINPY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/BugsInPy" rev-parse HEAD)" = "$BUGSINPY_COMMIT"
          meta="$RUNNER_TEMP/BugsInPy/projects/${{ matrix.project }}/bugs/${{ matrix.bug_id }}/bug.info"
          project_meta="$RUNNER_TEMP/BugsInPy/projects/${{ matrix.project }}/project.info"
          run_test="$RUNNER_TEMP/BugsInPy/projects/${{ matrix.project }}/bugs/${{ matrix.bug_id }}/run_test.sh"
          test "$(sha256sum "$meta" | cut -d ' ' -f 1)" = "${{ matrix.bug_info_sha256 }}"
          test "$(sha256sum "$project_meta" | cut -d ' ' -f 1)" = "${{ matrix.project_info_sha256 }}"
          test "$(sha256sum "$run_test" | cut -d ' ' -f 1)" = "${{ matrix.run_test_sha256 }}"
          # Metadata uses inconsistent whitespace around assignment operators.
          # Parse all quoted values with a whitespace-tolerant pattern.
          recorded_python="$(sed -n 's/^[[:space:]]*python_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$meta" | sed -n '1p')"
          recorded_buggy="$(sed -n 's/^[[:space:]]*buggy_commit_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$meta" | sed -n '1p')"
          recorded_fixed="$(sed -n 's/^[[:space:]]*fixed_commit_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$meta" | sed -n '1p')"
          test "$recorded_python" = "${{ matrix.python_version }}"
          test "$recorded_buggy" = "${{ matrix.buggy_commit }}"
          test "$recorded_fixed" = "${{ matrix.fixed_commit }}"
          sha256sum "$meta" "$project_meta" "$run_test" > "$RUNNER_TEMP/source-metadata-hashes.txt"
          cp "$RUNNER_TEMP/source-metadata-hashes.txt" "$RUNNER_TEMP/case-artifact/"
          cp "$meta" "$RUNNER_TEMP/case-artifact/bug.info"

      - name: Capture pre-test Python runtime
        run: |
          set -euo pipefail
          {
            python --version
            python -c 'import sys,platform; print("executable="+sys.executable); print("platform="+platform.platform()); print("implementation="+platform.python_implementation())'
            cat /etc/os-release
            gcc --version | sed -n '1p'
            g++ --version | sed -n '1p'
            make --version | sed -n '1p'
            conda list
            python -m pip freeze
          } > "$RUNNER_TEMP/case-artifact/runner-runtime-fingerprint.txt"
          sha256sum "$RUNNER_TEMP/case-artifact/runner-runtime-fingerprint.txt" > "$RUNNER_TEMP/case-artifact/runner-runtime-fingerprint.sha256"

      - name: Run fixed and buggy test commands using pinned BugsInPy checkout
        id: execute
        continue-on-error: true
        run: |
          set -u
          export PATH="$RUNNER_TEMP/BugsInPy/framework/bin:$PATH"
          export PATH="$RUNNER_TEMP/BugsInPy/framework/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/fixed-root" "$RUNNER_TEMP/buggy-root"
          printf '%s\n' "$TARGET_COMMANDS_JSON" > "$RUNNER_TEMP/case-artifact/target-commands.json"

          run_side() {
            side="$1"; version="$2"; work_root="$3"
            work_dir="$work_root/$PROJECT"
            set +e
            bugsinpy-checkout -p "$PROJECT" -i "$BUG_ID" -v "$version" -w "$work_root" > "$RUNNER_TEMP/$side-checkout.log" 2>&1
            checkout_rc=$?
            set -e
            cp "$RUNNER_TEMP/$side-checkout.log" "$RUNNER_TEMP/case-artifact/$side-checkout.log"
            if [ "$checkout_rc" -ne 0 ] || [ ! -d "$work_dir" ]; then
              echo "$side checkout failed or project directory missing (exit=$checkout_rc); no target test result" > "$RUNNER_TEMP/case-artifact/$side-status.txt"
              return 0
            fi
            git -C "$work_dir" rev-parse HEAD > "$RUNNER_TEMP/case-artifact/$side-actual-commit.txt"
            git -C "$work_dir" diff --stat > "$RUNNER_TEMP/case-artifact/$side-worktree-diff-stat.txt"
            git -C "$work_dir" diff --binary > "$RUNNER_TEMP/case-artifact/$side-worktree.diff"
            git -C "$work_dir" diff --binary | sha256sum | cut -d ' ' -f 1 > "$RUNNER_TEMP/case-artifact/$side-worktree-diff-sha256.txt"
            git -C "$work_dir" status --short > "$RUNNER_TEMP/case-artifact/$side-worktree-status.txt"
            {
              echo "bash_flags=$-"
              echo "SHELLOPTS=${SHELLOPTS-}"
              echo "BASH_ENV=${BASH_ENV-}"
              set -o
              if [ -f "$work_dir/env/bin/activate" ]; then
                echo "--- env/bin/activate lines 24-38 (already present) ---"
                nl -ba "$work_dir/env/bin/activate" | sed -n '24,38p' || true
              else
                echo "env/bin/activate is not created yet; diagnostics taken before the compile step"
              fi
            } > "$RUNNER_TEMP/case-artifact/$side-activation-diagnostics.txt"

            # BugsInPy's compile script sources legacy env/bin/activate,
            # which references $1. Disable nounset around the upstream script,
            # otherwise the shell aborts before any target test executes.
            # Run the legacy upstream compile script in a fresh, non-strict
            # Bash process. Some runner environments export SHELLOPTS=nounset;
            # its virtualenv activate script reads $1 and aborts before tests.
            set +e
            compile_cflags="${CFLAGS:-}"
            if [ "$PROJECT" = "pandas" ]; then
              # This 2020 source tree treats GCC 13's array-bounds warning as
              # fatal (-Werror). Demote only that warning for both paired builds;
              # all other compiler warnings remain errors and this override is
              # written into each raw case artifact.
              compile_cflags="${compile_cflags} -Wno-error=array-bounds"
              printf '%s\n' "$compile_cflags" > "$RUNNER_TEMP/case-artifact/$side-compiler-flags.txt"
            fi
            ( cd "$work_dir" && env -u SHELLOPTS -u BASH_ENV CFLAGS="$compile_cflags" bash --noprofile --norc "$RUNNER_TEMP/BugsInPy/framework/bin/bugsinpy-compile" ) > "$RUNNER_TEMP/$side-compile.log" 2>&1
            compile_rc=$?
            set -e
            cp "$RUNNER_TEMP/$side-compile.log" "$RUNNER_TEMP/case-artifact/$side-compile.log"
            if [ "$compile_rc" -ne 0 ] || [ ! -f "$work_dir/bugsinpy_compile_flag" ] || [ ! -f "$work_dir/env/bin/activate" ]; then
              echo "$side environment setup did not finish (compile exit=$compile_rc); no target test result" > "$RUNNER_TEMP/case-artifact/$side-status.txt"
              return 0
            fi

            if [ "$INSTALL_WORKTREE_PACKAGE" = "true" ]; then
              set +e
              ( cd "$work_dir" && source env/bin/activate nondestructive && python -m pip install -e . ) > "$RUNNER_TEMP/$side-install.log" 2>&1
              install_rc=$?
              set -e
              cp "$RUNNER_TEMP/$side-install.log" "$RUNNER_TEMP/case-artifact/$side-install.log"
              if [ "$install_rc" -ne 0 ]; then
                echo "$side package install failed (exit=$install_rc); no target test result" > "$RUNNER_TEMP/case-artifact/$side-status.txt"
                return 0
              fi
            fi

            # Some BugsInPy compile configurations omit pytest even though
            # the recorded target command requires it. Install the same pinned
            # runner in both buggy/fixed virtualenvs; never count a missing
            # test executable as an application failure. The post-install
            # runtime fingerprint records the resolved dependencies.
            if python "$GITHUB_WORKSPACE/scripts/evidence_abstention_requires_pytest.py" "$TARGET_COMMANDS_JSON"; then
              set +e
              (
                cd "$work_dir"
                set +u
                source env/bin/activate nondestructive
                set -u
                # Pandas defines --strict-data-files in pandas.conftest.py.
                # Load that plugin before pytest parses setup.cfg addopts.
                if [ "$PROJECT" = "pandas" ]; then
                  export PYTHONPATH="$work_dir${PYTHONPATH:+:$PYTHONPATH}"
                  export PYTEST_PLUGINS=pandas.conftest
                fi
                # Luigi's selected test does not require pytest-sanic; prevent
                # its optional plugin from loading and failing on missing Sanic.
                if [ "$PROJECT" = "luigi" ]; then
                  export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
                fi
                # Preserve the candidate's declared pytest pin. Install the
                # fallback only when the selected test runner is unavailable.
                if python -m pytest --version >/dev/null 2>&1; then
                  echo "pytest already installed; preserving candidate-specific version"
                else
                  python -m pip install --disable-pip-version-check "pytest==6.2.5"
                fi
                python -m pytest --version
              ) > "$RUNNER_TEMP/$side-pytest-bootstrap.log" 2>&1
              pytest_setup_rc=$?
              set -e
              cp "$RUNNER_TEMP/$side-pytest-bootstrap.log" "$RUNNER_TEMP/case-artifact/$side-pytest-bootstrap.log"
              if [ "$pytest_setup_rc" -ne 0 ]; then
                echo "$side pinned pytest installation failed (exit=$pytest_setup_rc); no target test result" > "$RUNNER_TEMP/case-artifact/$side-status.txt"
                return 0
              fi
            fi

            aggregate="$RUNNER_TEMP/$side-test.log"
            : > "$aggregate"
            codes="$RUNNER_TEMP/case-artifact/$side-command-exit-codes.txt"
            : > "$codes"
            command_index=0
            all_passed=true
            any_test_failure=false
            mapfile -t commands < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["TARGET_COMMANDS_JSON"])))')
            original_pwd="$PWD"
            cd "$work_dir"
            # Legacy BugsInPy virtualenv activation references $1; with
            # nounset enabled Bash aborts before the target test can run.
            set +u
            source env/bin/activate nondestructive
            set -u
            # Keep project-specific pytest configuration available before
            # the target command starts; no test command or case is changed.
            if [ "$PROJECT" = "pandas" ]; then
              export PYTHONPATH="$work_dir${PYTHONPATH:+:$PYTHONPATH}"
              export PYTEST_PLUGINS=pandas.conftest
            fi
            if [ "$PROJECT" = "luigi" ]; then
              export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
            fi
            for command in "${commands[@]}"; do
              command_index=$((command_index+1))
              printf '\n### command_%s: %s\n' "$command_index" "$command" >> "$aggregate"
              set +e
              bash -c "$command" >> "$aggregate" 2>&1
              rc=$?
              set -e
              printf '%s\n' "$rc" >> "$codes"
              if [ "$rc" -ne 0 ]; then all_passed=false; fi
              if grep -Eiq '(^FAIL: |^ERROR: |FAILED \(.+\)|FAILED .+::|=+ FAILURES =+|[0-9]+ failed([,[:space:]]|$))' "$aggregate"; then
                any_test_failure=true
              fi
            done
            {
              python --version
              python -c 'import sys,platform; print("executable="+sys.executable); print("platform="+platform.platform())'
              python -m pip freeze
            } > "$RUNNER_TEMP/$side-runtime-fingerprint.txt"
            cp "$RUNNER_TEMP/$side-runtime-fingerprint.txt" "$RUNNER_TEMP/case-artifact/$side-runtime-fingerprint.txt"
            # Virtualenv deactivate may reference unset state under nounset.
            # Disable nounset for cleanup only, then restore strict mode.
            set +u
            deactivate || true
            set -u
            cd "$original_pwd"
            cp "$aggregate" "$RUNNER_TEMP/case-artifact/$side-test.log"
            target_rc=0
            if grep -Eq '[1-9]' "$codes"; then target_rc=1; fi
            printf '%s\n' "$target_rc" > "$RUNNER_TEMP/case-artifact/$side-target-test-exit-code.txt"
            pass_marker=false
            if [ "$all_passed" = true ] && grep -Eiq '([0-9]+ passed|^OK$|Ran [0-9]+ tests? in)' "$aggregate"; then pass_marker=true; fi
            if [ "$target_rc" -eq 0 ] && [ "$pass_marker" = true ]; then
              echo "$side target command set passed; raw output still requires human review" > "$RUNNER_TEMP/case-artifact/$side-status.txt"
            elif [ "$target_rc" -ne 0 ] && [ "$any_test_failure" = true ]; then
              echo "$side has test-failure signature; human review must determine whether the intended root-cause test failed" > "$RUNNER_TEMP/case-artifact/$side-status.txt"
            else
              echo "$side target command set did not yield a valid pass/fail classification; treat as environment/harness uncertainty" > "$RUNNER_TEMP/case-artifact/$side-status.txt"
            fi
            echo "checkout_exit=$checkout_rc compile_exit=$compile_rc target_set_exit=$target_rc all_commands_passed=$all_passed test_failure_signature=$any_test_failure pass_marker=$pass_marker" >> "$RUNNER_TEMP/case-artifact/$side-status.txt"
          }

          run_side fixed 1 "$RUNNER_TEMP/fixed-root"
          run_side buggy 0 "$RUNNER_TEMP/buggy-root"

          python - <<'PY'
          import hashlib,json,os,pathlib,platform
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"case-artifact"
          def text(name):
              p=root/name
              return p.read_text(encoding="utf-8",errors="replace").strip() if p.exists() else ""
          def integer(name):
              v=text(name)
              try:return int(v.splitlines()[0]) if v else None
              except ValueError:return None
          def commit(name):
              v=text(name)
              return v.splitlines()[0] if v else None
          def failure(side):
              v=text(side+"-status.txt")
              return "test_failure_signature=true" in v or ("test-failure signature" in v and "human review" in v)
          def passed(side):
              return "pass_marker=true" in text(side+"-status.txt")
          import re
          def runtime_version(name):
              value=text(name)
              match=re.search(r"^Python (\d+\.\d+\.\d+)$",value,re.MULTILINE)
              return match.group(1) if match else None
          buggy_runtime=runtime_version("buggy-runtime-fingerprint.txt")
          fixed_runtime=runtime_version("fixed-runtime-fingerprint.txt")
          # Runner Python is not necessarily the project venv Python; check both sides.
          runtime=buggy_runtime if buggy_runtime and buggy_runtime==fixed_runtime else None
          runtime_matches=bool(runtime and runtime==os.environ["EXPECTED_PYTHON"])
          def sha(name):
              p=root/name
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          run_url="https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          summary={
            "case_id":os.environ["CASE_ID"],
            "workflow_run_url":run_url,
            "buggy_test_log_relative_path":"buggy-test.log",
            "fixed_test_log_relative_path":"fixed-test.log",
            "runner_runtime_fingerprint_sha256":sha("runner-runtime-fingerprint.txt"),
            "buggy_runtime_python_observed":buggy_runtime,
            "fixed_runtime_python_observed":fixed_runtime,
            "buggy_runtime_fingerprint_sha256":sha("buggy-runtime-fingerprint.txt"),
            "fixed_runtime_fingerprint_sha256":sha("fixed-runtime-fingerprint.txt"),
            "dataset_commit":os.environ["BUGSINPY_COMMIT"],
            "target_test_commands":json.loads(os.environ["TARGET_COMMANDS_JSON"]),
            "expected_run_test_sha256":os.environ["EXPECTED_RUN_TEST_SHA256"],
            "dataset_recorded_python":os.environ["EXPECTED_PYTHON"],
            "runtime_python_observed":runtime,
            "runtime_matches_metadata":runtime_matches,
            "expected_buggy_commit":os.environ["EXPECTED_BUGGY"],
            "observed_buggy_base_commit":commit("buggy-actual-commit.txt"),
            "expected_fixed_commit_reference":os.environ["EXPECTED_FIXED"],
            "observed_fixed_base_commit":commit("fixed-actual-commit.txt"),
            "fixed_tree_representation":"BugsInPy may apply changed files from the fixed commit to a worktree whose HEAD remains the buggy base; review base HEAD, diff, statuses and raw logs.",
            "buggy_target_test_exit_code":integer("buggy-target-test-exit-code.txt"),
            "fixed_target_test_exit_code":integer("fixed-target-test-exit-code.txt"),
            "buggy_failure_signature_present":failure("buggy"),
            "fixed_pass_marker_present":passed("fixed"),
            "buggy_status":text("buggy-status.txt"),
            "fixed_status":text("fixed-status.txt"),
            "technical_pair_automation_status":"signals-only-human-review-required",
            "accepted_for_confirmatory":False,
            "confirmatory_eligible":False,
            "license_reviewed":False,
            "ground_truth_reviewed_by_two":False,
            "evidence_levels_reviewed_by_two":False,
            "leakage_and_prior_exposure_reviewed":False,
            "llm_inference_performed":False
          }
          (root/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
        env:
          PROJECT: ${{ matrix.project }}
          BUG_ID: ${{ matrix.bug_id }}
          CASE_ID: ${{ matrix.case_id }}
          TARGET_COMMANDS_JSON: ${{ toJSON(matrix.execution_test_commands) }}
          INSTALL_WORKTREE_PACKAGE: ${{ matrix.install_worktree_package }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
          EXPECTED_BUGGY: ${{ matrix.buggy_commit }}
          EXPECTED_FIXED: ${{ matrix.fixed_commit }}
          EXPECTED_RUN_TEST_SHA256: ${{ matrix.run_test_sha256 }}

      - name: Finalize portable checksums and triage audit record
        if: always()
        shell: bash {0}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/case-artifact"
          if [ ! -f "$RUNNER_TEMP/case-artifact/summary.json" ]; then
            python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"case-artifact"
          p=root/"summary.json"
          p.write_text(json.dumps({"case_id":os.environ["CASE_ID"],"setup_state":"failed_before_summary","accepted_for_confirmatory":False,"confirmatory_eligible":False,"llm_inference_performed":False},indent=2)+"\n",encoding="utf-8")
          PY
          fi
          cd "$RUNNER_TEMP/case-artifact"
          rm -f SHA256SUMS artifact-audit.json artifact-audit.sha256 SHA256SUMS.copy
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name artifact-audit.json -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/audit_evidence_abstention_triage_artifact.py" --root "$RUNNER_TEMP/case-artifact" --output "$RUNNER_TEMP/case-artifact/artifact-audit.json"
          printf '%s  ./artifact-audit.json\n' "$(sha256sum artifact-audit.json | cut -d ' ' -f 1)" >> SHA256SUMS
          sha256sum -c SHA256SUMS
        env:
          CASE_ID: ${{ matrix.case_id }}

      - name: Upload raw case-level technical screening package (never auto-accept)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-abstention-v12-cohort-${{ matrix.case_id }}-technical-screen
          path: ${{ runner.temp }}/case-artifact/
          if-no-files-found: warn
          retention-days: 90
