name: Research Integrity Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run test suite
        run: pytest -q
      - name: Audit frozen pilot configuration
        run: python scripts/audit_pilot_integrity.py
      - name: Validate all frozen research cases
        run: python scripts/validate_all_cases.py
      - name: Validate candidate and assessment pool
        run: python scripts/validate_all_candidates.py
      - name: Validate benchmark manifest scaffold
        run: python scripts/validate_benchmark_manifest.py
      - name: Validate all preselected confirmatory cases
        run: python scripts/validate_all_benchmark_cases.py
