name: NAPALM 2151 Stage 2 Pinned Reproduction (No Inference)

on:
  pull_request:
    paths:
      - ".github/workflows/napalm-2151-stage2-pinned.yml"
      - "research_candidates/evidence_abstention/reproduction/napalm_issue_2151/requirements.lock"
      - "research_candidates/evidence_abstention/implementation/run_swe_rebench_fail_to_pass.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  napalm-2151-pinned-reproduction:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      NAPALM_TEST_MOCK: "1"
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproduction-evidence

      - name: Authenticate exact upstream source revisions and provenance
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/napalm-automation/napalm.git upstream-napalm
          git -C upstream-napalm fetch --no-tags origin d0d2a3e70d21d0556de71ab0462bd71a1450f820 a3781b83e02cb7ea87da948d82e0c9ee4d91a39a
          git -C upstream-napalm cat-file -e 'd0d2a3e70d21d0556de71ab0462bd71a1450f820^{commit}'
          git -C upstream-napalm cat-file -e 'a3781b83e02cb7ea87da948d82e0c9ee4d91a39a^{commit}'
          git -C upstream-napalm checkout --detach d0d2a3e70d21d0556de71ab0462bd71a1450f820
          test "$(git -C upstream-napalm rev-parse HEAD:LICENSE)" = "261eeb9e9f8b2b4b0d119366dda99c6fd7d35c64"
          test "$(git -C upstream-napalm rev-parse HEAD:napalm/nxos_ssh/nxos_ssh.py)" = "7206756d4ed5562ad08958e1b5119bf31a0b85bc"
          test "$(git -C upstream-napalm rev-parse a3781b83e02cb7ea87da948d82e0c9ee4d91a39a:napalm/nxos_ssh/nxos_ssh.py)" = "5a71662a8f32bb0d39419a88f43300ce4491a833"
          git -C upstream-napalm diff d0d2a3e70d21d0556de71ab0462bd71a1450f820 a3781b83e02cb7ea87da948d82e0c9ee4d91a39a > reproduction-evidence/full-pr.patch
          git -C upstream-napalm diff --name-only d0d2a3e70d21d0556de71ab0462bd71a1450f820 a3781b83e02cb7ea87da948d82e0c9ee4d91a39a > reproduction-evidence/full-pr-changed-paths.txt
          git -C upstream-napalm show d0d2a3e70d21d0556de71ab0462bd71a1450f820:LICENSE > reproduction-evidence/upstream-LICENSE.txt
          git -C upstream-napalm show d0d2a3e70d21d0556de71ab0462bd71a1450f820:requirements.txt > reproduction-evidence/base-requirements.txt
          git -C upstream-napalm show d0d2a3e70d21d0556de71ab0462bd71a1450f820:setup.py > reproduction-evidence/base-setup.py
          git -C upstream-napalm show d0d2a3e70d21d0556de71ab0462bd71a1450f820:setup.cfg > reproduction-evidence/base-setup.cfg
          git -C upstream-napalm show d0d2a3e70d21d0556de71ab0462bd71a1450f820:napalm/base/test/getters.py > reproduction-evidence/base-getters-test-harness.py
          sha256sum reproduction-evidence/full-pr.patch reproduction-evidence/full-pr-changed-paths.txt reproduction-evidence/upstream-LICENSE.txt reproduction-evidence/base-requirements.txt reproduction-evidence/base-setup.py reproduction-evidence/base-setup.cfg reproduction-evidence/base-getters-test-harness.py > reproduction-evidence/source-provenance-sha256.txt

      - name: Download and authenticate frozen SWE-rebench row
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-dataset
          .venv-dataset/bin/python -m pip install --disable-pip-version-check --no-deps pyarrow==19.0.1
          curl --fail --location --retry 3 --retry-delay 2 "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet" --output reproduction-evidence/train-00000-of-00001.parquet
          echo "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9  reproduction-evidence/train-00000-of-00001.parquet" | sha256sum --check
          .venv-dataset/bin/python - <<'PY'
          import hashlib
          import json
          import pyarrow.parquet as pq
          path = "reproduction-evidence/train-00000-of-00001.parquet"
          instance_id = "napalm-automation__napalm-2152"
          columns = ["instance_id", "repo", "base_commit", "created_at", "language", "license", "FAIL_TO_PASS", "problem_statement"]
          rows = pq.read_table(path, columns=columns, filters=[("instance_id", "=", instance_id)]).to_pylist()
          if len(rows) != 1:
              raise SystemExit(f"Expected exactly one {instance_id} row, found {len(rows)}")
          row = rows[0]
          expected = {
              "repo": "napalm-automation/napalm",
              "base_commit": "d0d2a3e70d21d0556de71ab0462bd71a1450f820",
              "language": "python",
              "license": "Apache-2.0",
              "created_at": "2024-11-04 21:41:29",
          }
          observed = {key: str(row[key]) for key in expected}
          for key, value in expected.items():
              if observed[key] != value:
                  raise SystemExit(f"Dataset row mismatch for {key}: expected {value!r}, observed {observed[key]!r}")
          selectors = row["FAIL_TO_PASS"]
          if not selectors:
              raise SystemExit("Frozen NAPALM row has no FAIL_TO_PASS selectors")
          expected_selector = "test/nxos_ssh/test_getters.py::TestGetter::test_get_facts[issue2151]"
          if expected_selector not in selectors:
              raise SystemExit("The exact row does not include the issue2151 get_facts selector; no selector will be reconstructed or substituted.")
          canonical = json.dumps(row, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          with open("reproduction-evidence/dataset-row-canonical.json", "wb") as f:
              f.write(canonical)
          digest = hashlib.sha256(canonical).hexdigest()
          with open("reproduction-evidence/dataset-row-sha256.txt", "w", encoding="utf-8") as f:
              f.write(digest + "  dataset-row-canonical.json\n")
          with open("reproduction-evidence/dataset-fail-to-pass-selectors.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(selectors) + "\n")
          with open("reproduction-evidence/dataset-row-summary.json", "w", encoding="utf-8") as f:
              json.dump({"instance_id": instance_id, "row_sha256": digest, "created_at": observed["created_at"], "repo": observed["repo"], "base_commit": observed["base_commit"], "license": observed["license"], "selector_count": len(selectors), "selectors": selectors}, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps({"dataset_row_sha256": digest, "created_at": observed["created_at"], "selector_count": len(selectors), "selectors": selectors}, indent=2, ensure_ascii=False))
          PY

      - name: Install exact pinned NAPALM test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-napalm
          .venv-napalm/bin/python -m pip install --disable-pip-version-check -r research_candidates/evidence_abstention/reproduction/napalm_issue_2151/requirements.lock
          .venv-napalm/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e ./upstream-napalm
          .venv-napalm/bin/python -m pip check
          .venv-napalm/bin/python -m pip freeze --all | sort > reproduction-evidence/pinned-environment-freeze.txt
          .venv-napalm/bin/python - <<'PY'
          import hashlib
          import importlib.metadata as md
          import json
          import re
          from pathlib import Path
          lock_path = Path("research_candidates/evidence_abstention/reproduction/napalm_issue_2151/requirements.lock")
          expected = {}
          for line in lock_path.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name, version = line.split("==", 1)
              key = re.sub(r"[-_.]+", "-", name).lower()
              if key in expected:
                  raise SystemExit(f"Duplicate normalized package in lock: {name}")
              expected[key] = version
          inventory = {}
          missing = []
          for dist in md.distributions():
              name = dist.metadata.get("Name")
              if not name:
                  continue
              key = re.sub(r"[-_.]+", "-", name).lower()
              classifiers = [x for x in dist.metadata.get_all("Classifier", []) if x.startswith("License ::")]
              license_text = dist.metadata.get("License") or dist.metadata.get("License-Expression")
              if not license_text and not classifiers:
                  missing.append(name)
              inventory[key] = {
                  "name": name,
                  "version": dist.version,
                  "license": license_text,
                  "license_expression": dist.metadata.get("License-Expression"),
                  "license_classifiers": classifiers,
              }
          if missing:
              raise SystemExit("Missing installed license metadata; stop before source tests: " + ", ".join(sorted(missing)))
          installed = {key: value["version"] for key, value in inventory.items() if key != "napalm"}
          if installed != expected:
              absent = sorted(set(expected) - set(installed))
              unexpected = sorted(set(installed) - set(expected))
              mismatched = {key: (expected[key], installed[key]) for key in set(expected) & set(installed) if expected[key] != installed[key]}
              raise SystemExit(json.dumps({"absent": absent, "unexpected": unexpected, "version_mismatch": mismatched}, indent=2))
          with open("reproduction-evidence/dependency-license-inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2, sort_keys=True)
              f.write("\n")
          with open("reproduction-evidence/requirements-lock-sha256.txt", "w", encoding="utf-8") as f:
              f.write(hashlib.sha256(lock_path.read_bytes()).hexdigest() + "  requirements.lock\n")
          print(json.dumps({"locked_external_distribution_count": len(expected), "installed_distribution_count": len(inventory), "all_locked_versions_match": True, "license_metadata_complete": True}, indent=2))
          PY

      - name: Prepare exact test-only fixture patch and verify scope
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-napalm checkout --detach d0d2a3e70d21d0556de71ab0462bd71a1450f820
          git -C upstream-napalm diff d0d2a3e70d21d0556de71ab0462bd71a1450f820 a3781b83e02cb7ea87da948d82e0c9ee4d91a39a -- test/nxos_ssh/mocked_data/test_get_facts/issue2151 > reproduction-evidence/test-only.patch
          test -s reproduction-evidence/test-only.patch
          git -C upstream-napalm apply "$GITHUB_WORKSPACE/reproduction-evidence/test-only.patch"
          .venv-napalm/bin/python - <<'PY'
          import json
          import subprocess
          tracked_changes = subprocess.check_output(["git", "-C", "upstream-napalm", "diff", "--name-only"], text=True).splitlines()
          untracked_files = subprocess.check_output(["git", "-C", "upstream-napalm", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          changed = sorted(set(tracked_changes) | set(untracked_files))
          prefix = "test/nxos_ssh/mocked_data/test_get_facts/issue2151/"
          expected = {
              prefix + "expected_result.json",
              prefix + "show_hostname.txt",
              prefix + "show_hosts.txt",
              prefix + "show_interface_status.txt",
              prefix + "show_inventory___json.txt",
              prefix + "show_version.txt",
          }
          if set(changed) != expected:
              raise SystemExit(f"NAPALM test-only patch scope mismatch: observed={changed}, expected={sorted(expected)}")
          scope = {"tracked_changes": sorted(tracked_changes), "untracked_files": sorted(untracked_files), "changed_paths": changed, "expected_paths": sorted(expected), "production_code_changed": any(not p.startswith("test/") for p in changed)}
          if scope["production_code_changed"]:
              raise SystemExit("Production code was applied to the buggy base")
          with open("reproduction-evidence/test-only-patch-scope.json", "w", encoding="utf-8") as f:
              json.dump(scope, f, indent=2)
              f.write("\n")
          print(json.dumps(scope, indent=2))
          PY
          .venv-napalm/bin/python - <<'PY'
          from pathlib import Path
          source = Path("upstream-napalm/setup.cfg").read_text(encoding="utf-8")
          filtered = [line for line in source.splitlines() if line.strip() != "jsonapi = true" and not line.strip().startswith("json_report =")]
          Path("upstream-napalm/.napalm-stage2.cfg").write_text("\n".join(filtered) + "\n", encoding="utf-8")
          PY
          sha256sum reproduction-evidence/test-only.patch reproduction-evidence/test-only-patch-scope.json >> reproduction-evidence/source-provenance-sha256.txt

      - name: Run exact frozen dataset selectors on buggy base (real test failure required)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          NAPALM_TEST_MOCK=1 PYTHONPATH="$GITHUB_WORKSPACE/upstream-napalm" .venv-napalm/bin/python "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/implementation/run_swe_rebench_fail_to_pass.py" --source-dir "$GITHUB_WORKSPACE/upstream-napalm" --selectors-file "$GITHUB_WORKSPACE/reproduction-evidence/dataset-fail-to-pass-selectors.txt" --config-file "$GITHUB_WORKSPACE/upstream-napalm/.napalm-stage2.cfg" --expect base-fail --log-file "$GITHUB_WORKSPACE/reproduction-evidence/base-dataset-tests.json" > "$GITHUB_WORKSPACE/reproduction-evidence/base-dataset-test.log" 2>&1
          status=$?
          set -e
          cat reproduction-evidence/base-dataset-test.log
          if [ "$status" -ne 0 ]; then
            echo "Exact dataset selectors did not execute and fail on the pinned buggy base." >&2
            exit "$status"
          fi

      - name: Run the identical dataset selectors on fixed revision (real pass required)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f reproduction-evidence/dataset-fail-to-pass-selectors.txt ] || [ ! -x .venv-napalm/bin/python ]; then
            echo "Selectors or the test environment are unavailable; fixed-side reproduction cannot be claimed." >&2
            exit 1
          fi
          git -C upstream-napalm clean -fd -- test/nxos_ssh/mocked_data/test_get_facts/issue2151
          git -C upstream-napalm checkout --detach --force a3781b83e02cb7ea87da948d82e0c9ee4d91a39a
          NAPALM_TEST_MOCK=1 PYTHONPATH="$GITHUB_WORKSPACE/upstream-napalm" .venv-napalm/bin/python "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/implementation/run_swe_rebench_fail_to_pass.py" --source-dir "$GITHUB_WORKSPACE/upstream-napalm" --selectors-file "$GITHUB_WORKSPACE/reproduction-evidence/dataset-fail-to-pass-selectors.txt" --config-file "$GITHUB_WORKSPACE/upstream-napalm/.napalm-stage2.cfg" --expect fixed-pass --log-file "$GITHUB_WORKSPACE/reproduction-evidence/fixed-dataset-tests.json" > "$GITHUB_WORKSPACE/reproduction-evidence/fixed-dataset-test.log" 2>&1
          cat reproduction-evidence/fixed-dataset-test.log

      - name: Summarize and hash the pinned reproduction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### NAPALM #2151 — pinned no-inference reproduction"
            echo "- Base: d0d2a3e70d21d0556de71ab0462bd71a1450f820"
            echo "- Fixed: a3781b83e02cb7ea87da948d82e0c9ee4d91a39a"
            echo "- NAPALM_TEST_MOCK=1; no real switch, SSH endpoint, or cloud."
            echo "- External environment packages are pinned by requirements.lock and all installed distribution versions are checked against that lock."
            echo "- Model loading, inference and training were not performed."
          } >> "$GITHUB_STEP_SUMMARY"
          (cd reproduction-evidence && find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -print0 | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload raw NAPALM pinned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: napalm-issue-2151-pinned-reproduction
          path: reproduction-evidence/
          if-no-files-found: warn
          retention-days: 90
