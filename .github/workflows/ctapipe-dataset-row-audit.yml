name: CTAPIpe Frozen Dataset Row Audit (No Inference)

on:
  push:
    branches:
      - "research/**"
    paths:
      - ".github/workflows/ctapipe-dataset-row-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-exact-row:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9 for the pinned PyArrow wheel
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Download frozen SWE-rebench Parquet and verify file hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ctapipe-row-evidence
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet" \
            --output ctapipe-row-evidence/train-00000-of-00001.parquet
          echo "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9  ctapipe-row-evidence/train-00000-of-00001.parquet" | sha256sum --check

      - name: Extract and authenticate exact CTAPIpe row
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-dataset
          .venv-dataset/bin/python -m pip install --disable-pip-version-check --no-deps "pyarrow==19.0.1"
          .venv-dataset/bin/python - <<'PY'
          import hashlib
          import json
          import pyarrow.parquet as pq

          parquet_path = "ctapipe-row-evidence/train-00000-of-00001.parquet"
          project_table = pq.read_table(
              parquet_path,
              filters=[("repo", "=", "cta-observatory/ctapipe")],
          )
          project_rows_raw = sorted(
              project_table.to_pylist(),
              key=lambda row: (row["instance_id"], row.get("base_commit") or ""),
          )
          inventory = {
              "repository": "cta-observatory/ctapipe",
              "dataset_revision": "fb9aa226b2ce37c708ea7732e7b980abacdadb67",
              "parquet_sha256": "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9",
              "schema_columns": project_table.schema.names,
              "matching_row_count": len(project_rows_raw),
              "instances": [],
              "interpretation": "Every frozen row for this exact repository identity. Repository-level row membership does not prove semantic defect independence.",
          }
          for project_row in project_rows_raw:
              canonical = json.dumps(
                  project_row,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              row_hash = hashlib.sha256(canonical).hexdigest()
              row_path = f"ctapipe-row-evidence/project_rows/{project_row['instance_id']}.json"
              import os
              os.makedirs("ctapipe-row-evidence/project_rows", exist_ok=True)
              with open(row_path, "wb") as f:
                  f.write(json.dumps(
                      project_row, sort_keys=True, indent=2, ensure_ascii=False
                  ).encode("utf-8"))
                  f.write(bytes([10]))
              inventory["instances"].append({
                  "instance_id": project_row["instance_id"],
                  "repo": project_row["repo"],
                  "base_commit": project_row.get("base_commit"),
                  "created_at": str(project_row.get("created_at")),
                  "language": project_row.get("language"),
                  "license": project_row.get("license"),
                  "fail_to_pass": project_row.get("FAIL_TO_PASS"),
                  "pass_to_pass_count": len(project_row.get("PASS_TO_PASS") or []),
                  "problem_statement_sha256": hashlib.sha256(
                      str(project_row.get("problem_statement") or "").encode("utf-8")
                  ).hexdigest(),
                  "patch_sha256": hashlib.sha256(
                      str(project_row.get("patch") or "").encode("utf-8")
                  ).hexdigest(),
                  "test_patch_sha256": hashlib.sha256(
                      str(project_row.get("test_patch") or "").encode("utf-8")
                  ).hexdigest(),
                  "canonical_row_sha256": row_hash,
                  "artifact_row_path": f"project_rows/{project_row['instance_id']}.json",
              })
              print(
                  "UPSTREAM_PROJECT_INSTANCE="
                  + project_row["instance_id"]
                  + " base="
                  + str(project_row.get("base_commit"))
                  + " created_at="
                  + str(project_row.get("created_at"))
                  + " fail_to_pass="
                  + str(len(project_row.get("FAIL_TO_PASS") or []))
                  + " row_sha256="
                  + row_hash
              )
          with open("ctapipe-row-evidence/upstream-project-row-inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2, ensure_ascii=False)
              f.write(chr(10))
          print("upstream_project_row_count=" + str(len(project_rows_raw)))

          columns = [
              "instance_id", "repo", "base_commit", "created_at",
              "language", "license", "FAIL_TO_PASS", "problem_statement",
          ]
          table = pq.read_table(
              parquet_path,
              columns=columns,
              filters=[("instance_id", "=", "cta-observatory__ctapipe-2732")],
          )
          rows = table.to_pylist()
          assert len(rows) == 1, f"Expected exactly one row, got {len(rows)}"
          row = rows[0]
          assert row["instance_id"] == "cta-observatory__ctapipe-2732", row
          assert row["repo"] == "cta-observatory/ctapipe", row
          assert row["base_commit"] == "287e7685e0e963f3fb44d92832ca97ac8c265c40", row
          assert row["language"] == "python", row
          assert isinstance(row["FAIL_TO_PASS"], list) and row["FAIL_TO_PASS"], row

          canonical = json.dumps(
              row, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          ).encode("utf-8")
          digest = hashlib.sha256(canonical).hexdigest()
          with open("ctapipe-row-evidence/dataset-row-canonical.json", "wb") as f:
              f.write(canonical)
          with open("ctapipe-row-evidence/dataset-row-sha256.txt", "w", encoding="utf-8") as f:
              f.write(digest + "  dataset-row-canonical.json\n")
          with open("ctapipe-row-evidence/dataset-fail-to-pass-selectors.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(row["FAIL_TO_PASS"]) + "\n")
          with open("ctapipe-row-evidence/dataset-row-summary.json", "w", encoding="utf-8") as f:
              json.dump({
                  "instance_id": row["instance_id"],
                  "repo": row["repo"],
                  "base_commit": row["base_commit"],
                  "created_at": row["created_at"],
                  "language": row["language"],
                  "license": row["license"],
                  "fail_to_pass_count": len(row["FAIL_TO_PASS"]),
                  "row_sha256": digest,
                  "upstream_project_dataset_row_count": len(project_rows_raw),
              }, f, indent=2)
              f.write("\n")
          print("dataset_row_sha256=" + digest)
          print("dataset_created_at=" + str(row["created_at"]))
          print("dataset_license=" + str(row["license"]))
          print("fail_to_pass_count=" + str(len(row["FAIL_TO_PASS"])))
          for selector in row["FAIL_TO_PASS"]:
              print("FAIL_TO_PASS_SELECTOR=" + selector)
          PY
          rm ctapipe-row-evidence/train-00000-of-00001.parquet
          (cd ctapipe-row-evidence && find . -type f ! -name SHA256SUMS.txt -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          cat ctapipe-row-evidence/dataset-row-summary.json
          cat ctapipe-row-evidence/dataset-fail-to-pass-selectors.txt

      - name: Upload raw row-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctapipe-2730-dataset-row-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ctapipe-row-evidence/
          if-no-files-found: warn
          retention-days: 30
