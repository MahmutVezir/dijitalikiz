name: Gerçek2.0 Kaggle Runner

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/kaggle-pilot-trigger"

jobs:
  run-gercek2:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v4

      - name: Install Kaggle tooling
        run: python -m pip install --upgrade pip kaggle kagglehub nbformat

      - name: Authenticate and resolve Kaggle account
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing GitHub secret: KAGGLE_API_TOKEN"; exit 1; }
          KAGGLE_USER="$(python -c 'import kagglehub; print(kagglehub.whoami(verbose=False)["username"])')"
          test -n "$KAGGLE_USER" || { echo "Could not resolve Kaggle username"; exit 1; }
          echo "KAGGLE_USERNAME=$KAGGLE_USER" >> "$GITHUB_ENV"
          kaggle --version
          kaggle kernels list --mine --page-size 5

      - name: Pull Gerçek2.0 notebook
        run: |
          set -euo pipefail
          rm -rf gercek2-kernel
          mkdir -p gercek2-kernel
          kaggle kernels pull "$KAGGLE_USERNAME/ger-ek2-0" -p gercek2-kernel -m
          find gercek2-kernel -maxdepth 2 -type f -print | sort

      - name: Inject project runner into Gerçek2.0
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          kernel_dir = Path("gercek2-kernel")
          metadata = json.loads((kernel_dir / "kernel-metadata.json").read_text(encoding="utf-8"))
          code_file = Path(metadata["code_file"])
          notebook_path = kernel_dir / code_file
          if notebook_path.suffix.lower() != ".ipynb":
              raise SystemExit(f"Gerçek2.0 code_file is not a notebook: {notebook_path}")

          nb = json.loads(notebook_path.read_text(encoding="utf-8"))
          marker = "# BEGIN DIJITALIKIZ GERCEK2 RUNNER"
          nb["cells"] = [
              cell for cell in nb.get("cells", [])
              if marker not in "".join(cell.get("source", []))
          ]

          source_commit = Path(".git/HEAD").read_text(encoding="utf-8").strip()
          runner = r'''
          # BEGIN DIJITALIKIZ GERCEK2 RUNNER
          from __future__ import annotations

          import json
          import os
          import shutil
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          ROOT = Path("/kaggle/working")
          BUNDLE = ROOT / "project.tar.gz"
          COMMIT_FILE = ROOT / "source_commit.txt"
          WORKDIR = ROOT / "dijitalikiz"
          OUTPUT = ROOT / "gercek2-pilot-output"

          def run(*args: str, cwd: Path | None = None, env: dict[str, str] | None = None) -> None:
              print("$", " ".join(args), flush=True)
              subprocess.run(args, cwd=str(cwd) if cwd else None, env=env, check=True)

          if not BUNDLE.is_file():
              raise RuntimeError("project.tar.gz was not uploaded with Gerçek2.0 kernel.")
          if WORKDIR.exists():
              shutil.rmtree(WORKDIR)
          WORKDIR.mkdir(parents=True, exist_ok=True)

          with tarfile.open(BUNDLE, "r:gz") as archive:
              archive.extractall(WORKDIR)

          source_commit = COMMIT_FILE.read_text(encoding="utf-8").strip()
          pilot_dir = WORKDIR / "data" / "pilot"
          pilot_dir.mkdir(parents=True, exist_ok=True)
          (pilot_dir / "kaggle_source_commit.txt").write_text(source_commit + "
", encoding="utf-8")

          run(sys.executable, "-m", "pip", "install", "-r", "requirements-pilot.txt", cwd=WORKDIR)
          env = dict(os.environ)
          env["PYTHONPATH"] = str(WORKDIR)

          run(sys.executable, "scripts/capture_environment.py", cwd=WORKDIR, env=env)
          environment_path = pilot_dir / "environment.json"
          environment = json.loads(environment_path.read_text(encoding="utf-8"))
          environment["source_commit"] = source_commit
          environment["source_commit_verified_from_bundle"] = True
          environment_path.write_text(json.dumps(environment, indent=2, ensure_ascii=False) + "
", encoding="utf-8")

          run(sys.executable, "scripts/pilot_preflight.py", "--require-cuda", cwd=WORKDIR, env=env)
          run(sys.executable, "scripts/model_load_preflight.py", cwd=WORKDIR, env=env)
          run(sys.executable, "scripts/audit_pilot_integrity.py", cwd=WORKDIR, env=env)
          run(sys.executable, "scripts/run_pilot.py", cwd=WORKDIR, env=env)
          run(sys.executable, "scripts/finalize_pilot.py", cwd=WORKDIR, env=env)

          if OUTPUT.exists():
              shutil.rmtree(OUTPUT)
          OUTPUT.mkdir(parents=True, exist_ok=True)
          for item in pilot_dir.iterdir():
              destination = OUTPUT / item.name
              if item.is_dir():
                  shutil.copytree(item, destination)
              else:
                  shutil.copy2(item, destination)

          required = (
              OUTPUT / "pilot_records.jsonl",
              OUTPUT / "pilot_evaluation.json",
              OUTPUT / "case_level_analysis.json",
              OUTPUT / "pilot_artifact_manifest.json",
          )
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise RuntimeError("Missing finalized pilot artifacts: " + ", ".join(missing))

          print("GERCEK2_FROZEN_PILOT_COMPLETE", flush=True)
          # END DIJITALIKIZ GERCEK2 RUNNER
          '''

          nb["cells"].append({
              "cell_type": "code",
              "execution_count": None,
              "metadata": {},
              "outputs": [],
              "source": runner.strip("
").splitlines(True),
          })
          notebook_path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + "
", encoding="utf-8")

          metadata["id"] = f"{__import__('os').environ['KAGGLE_USERNAME']}/ger-ek2-0"
          metadata["enable_gpu"] = True
          metadata["enable_internet"] = True
          metadata["kernel_type"] = "notebook"
          metadata["code_file"] = code_file.as_posix()
          (kernel_dir / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + "
", encoding="utf-8")
          print("Injected runner into", notebook_path)
          PY

      - name: Package exact repository source
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=gercek2-kernel/project.tar.gz HEAD
          printf '%s
' "$GITHUB_SHA" > gercek2-kernel/source_commit.txt
          test -s gercek2-kernel/project.tar.gz
          test -s gercek2-kernel/source_commit.txt
          python -m json.tool gercek2-kernel/kernel-metadata.json >/dev/null

      - name: Push and run Gerçek2.0 on Kaggle GPU
        run: |
          set -euo pipefail
          kaggle kernels push -p gercek2-kernel --timeout 10800 --accelerator NvidiaTeslaT4

      - name: Wait for Gerçek2.0 completion
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            status="$(kaggle kernels status "$KAGGLE_USERNAME/ger-ek2-0" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              exit 0
            fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              kaggle kernels logs "$KAGGLE_USERNAME/ger-ek2-0" || true
              exit 1
            fi
            sleep 60
          done
          kaggle kernels logs "$KAGGLE_USERNAME/ger-ek2-0" || true
          exit 1

      - name: Download and persist Gerçek2.0 results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gercek2-output
          mkdir -p gercek2-output
          kaggle kernels output "$KAGGLE_USERNAME/ger-ek2-0" -p gercek2-output --force
          find gercek2-output -type f -print | sort
          test -n "$(find gercek2-output -name pilot_records.jsonl -print -quit)"
          test -n "$(find gercek2-output -name pilot_evaluation.json -print -quit)"
          test -n "$(find gercek2-output -name case_level_analysis.json -print -quit)"

          mkdir -p data/pilot/gercek2
          cp -a gercek2-output/. data/pilot/gercek2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pilot/gercek2
          git commit -m "Record Gerçek2.0 frozen pilot results [pilot-artifacts]"
          git push origin HEAD:main
