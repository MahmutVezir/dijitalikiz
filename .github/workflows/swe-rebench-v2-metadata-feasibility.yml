name: SWE-rebench V2 Filtered-Verified Metadata Feasibility (No Inference)

on:
  push:
    branches:
      - "research/2026-11-12-swe-rebench-metadata-inventory"
    paths:
      - ".github/workflows/swe-rebench-v2-metadata-feasibility.yml"
      - "scripts/audit_swe_rebench_filtered_verified.py"
      - "tests/test_audit_swe_rebench_filtered_verified.py"
      - "scripts/select_swe_rebench_project_cohort.py"
      - "tests/test_select_swe_rebench_project_cohort.py"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPERIMENT_MANIFEST_V0_1.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_TIMESTAMP_SEMANTICS_AUDIT_2026-11-15.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/swe-rebench-v2-metadata-feasibility.yml"
      - "scripts/audit_swe_rebench_filtered_verified.py"
      - "tests/test_audit_swe_rebench_filtered_verified.py"
      - "scripts/select_swe_rebench_project_cohort.py"
      - "tests/test_select_swe_rebench_project_cohort.py"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPERIMENT_MANIFEST_V0_1.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_TIMESTAMP_SEMANTICS_AUDIT_2026-11-15.md"

permissions:
  contents: read

concurrency:
  group: swe-rebench-v2-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-feasibility:
    name: Verify pinned dataset and count metadata candidates only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATASET_URL: "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet"
      EXPECTED_SHA256: "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9"
      EXPECTED_BYTES: "226272977"
      EXPECTED_ROWS: "6272"
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check "pyarrow==19.0.1"

      - name: Run synthetic metadata audit tests
        run: python -m unittest discover -s tests -p "test_audit_swe_rebench_filtered_verified.py" -v

      - name: Download exact public Parquet snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swe-rebench-v2"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DATASET_URL" \
            --output "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet"
          actual_bytes="$(stat -c '%s' "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet")"
          actual_sha="$(sha256sum "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet" | awk '{print $1}')"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          test "$actual_sha" = "$EXPECTED_SHA256"
          echo "verified_bytes=$actual_bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "verified_sha256=$actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Build no-inference metadata inventory
        id: metadata_inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_swe_rebench_filtered_verified.py \
            --input "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet" \
            --output-json "$RUNNER_TEMP/swe-rebench-v2-metadata-summary.json" \
            --output-csv "$RUNNER_TEMP/swe-rebench-v2-metadata-candidates.csv" \
            | tee "$RUNNER_TEMP/swe-rebench-v2-metadata-summary.stdout.json"
          cat "$RUNNER_TEMP/swe-rebench-v2-metadata-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate cohort generation on independently reviewed timestamp semantics
        id: timestamp_gate
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPERIMENT_MANIFEST_V0_1.json" "$RUNNER_TEMP/swe-rebench-v2-metadata-summary.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          summary = json.load(open(sys.argv[2], encoding="utf-8"))
          review = manifest.get("dataset", {}).get("created_at_timezone_assumption_review")
          unverified = summary.get("timezone_unverified_created_at_count")
          eligible = review in {"confirmed", "confirmed_utc", "passed"} and unverified == 0
          with open(sys.argv[3], "a", encoding="utf-8") as output:
              output.write("eligible=" + ("true" if eligible else "false") + "\n")
          if not eligible:
              print("COHORT_GENERATION_SKIPPED: timestamp provenance is not independently confirmed or naive timestamps remain.")
              print("manifest_review_status=" + str(review))
              print("timezone_unverified_created_at_count=" + str(unverified))
          else:
              print("Timestamp provenance gate passed; cohort generation may proceed.")
          PY

      - name: Run deterministic cohort sampler tests
        run: python -m unittest discover -s tests -p "test_select_swe_rebench_project_cohort.py" -v

      - name: Build versioned pre-review cohort and reserves
        if: steps.timestamp_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_swe_rebench_project_cohort.py \
            --input "$RUNNER_TEMP/swe-rebench-v2-metadata-candidates.csv" \
            --output-dir "$RUNNER_TEMP/swe-rebench-v2-cohort" \
            | tee "$RUNNER_TEMP/swe-rebench-v2-cohort-summary.stdout.json"
          python - "$RUNNER_TEMP/swe-rebench-v2-cohort/SWE_REBENCH_V2_COHORT_96_MANIFEST_2026-11-12.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1], encoding="utf-8"))
          assert m["primary_cases"] == 96 and m["primary_distinct_projects"] == 96, m
          assert m["project_reserve_cases"] >= 0, m
          assert m["accepted_confirmatory_cases"] == 0, m
          assert m["model_inference_performed"] is False, m
          assert m["fine_tuning_performed"] is False, m
          print("PASS: versioned pre-review cohort generated; no case accepted.")
          PY

      - name: Record why cohort generation was skipped
        if: steps.timestamp_gate.outputs.eligible != 'true'
        shell: bash
        run: |
          {
            echo "### Candidate cohort generation"
            echo "Skipped: timestamp provenance is unresolved or timezone-naive values remain. Metadata inventory only; no cohort selection and no inference."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metadata inventory and deterministic cohort outputs
        uses: actions/upload-artifact@v4
        with:
          name: swe-rebench-v2-metadata-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swe-rebench-v2-metadata-summary.json
            ${{ runner.temp }}/swe-rebench-v2-metadata-candidates.csv
            ${{ runner.temp }}/swe-rebench-v2-metadata-summary.stdout.json
            ${{ runner.temp }}/swe-rebench-v2-cohort/SWE_REBENCH_V2_COHORT_96_PRIMARY_2026-11-12.csv
            ${{ runner.temp }}/swe-rebench-v2-cohort/SWE_REBENCH_V2_PROJECT_RESERVES_2026-11-12.csv
            ${{ runner.temp }}/swe-rebench-v2-cohort/SWE_REBENCH_V2_WITHIN_PROJECT_ALTERNATES_2026-11-12.csv
            ${{ runner.temp }}/swe-rebench-v2-cohort/SWE_REBENCH_V2_COHORT_96_MANIFEST_2026-11-12.json
            ${{ runner.temp }}/swe-rebench-v2-cohort-summary.stdout.json
          if-no-files-found: warn
          retention-days: 90
