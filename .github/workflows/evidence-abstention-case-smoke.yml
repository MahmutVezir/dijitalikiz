name: Evidence Abstention Dataset Case Smoke Test

on:
  push:
    branches:
      - "research/evidence-abstention-draft-2026-10-19"
    paths:
      - ".github/workflows/evidence-abstention-case-smoke.yml"
      - "research_candidates/evidence_abstention/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pysnooper_bug_1:
    name: Verify one pinned buggy/fixed test pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up the bug's recorded Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.1"
          cache: "pip"

      - name: Install test runner
        run: |
          python -m pip install --upgrade "pip<25.1"
          python -m pip install "pytest<8.4"

      - name: Fetch pinned dataset metadata and source repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/soarsmu/BugsInPy.git "$RUNNER_TEMP/BugsInPy"
          git -C "$RUNNER_TEMP/BugsInPy" checkout --detach 11c5f1eea954a42132cfd06bf257766a7963e0fd
          git clone https://github.com/cool-RR/PySnooper.git "$RUNNER_TEMP/PySnooper"
          git -C "$RUNNER_TEMP/PySnooper" checkout --detach 56f22f8ffe1c6b2be4d2cf3ad1987fdb66113da2
          test -f "$RUNNER_TEMP/PySnooper/tests/test_chinese.py"
          cp "$RUNNER_TEMP/PySnooper/tests/test_chinese.py" "$RUNNER_TEMP/test_chinese.py"

      - name: Run target test on the buggy revision (failure is expected)
        id: buggy
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/PySnooper"
          git -C "$repo" checkout --detach e21a31162f4c54be693d8ca8260e42393b39abd3
          git -C "$repo" clean -fd
          mkdir -p "$repo/tests"
          cp "$RUNNER_TEMP/test_chinese.py" "$repo/tests/test_chinese.py"
          cd "$repo"
          set +e
          python -m pytest -q -s tests/test_chinese.py::test_chinese > "$RUNNER_TEMP/buggy-test.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/buggy-test.log"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "The pinned buggy revision unexpectedly passed; case fails the expected-reproduction gate."
            exit 1
          fi

      - name: Run the same target test on the fixed revision (pass is expected)
        id: fixed
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/PySnooper"
          git -C "$repo" checkout --detach 56f22f8ffe1c6b2be4d2cf3ad1987fdb66113da2
          git -C "$repo" clean -fd
          mkdir -p "$repo/tests"
          cp "$RUNNER_TEMP/test_chinese.py" "$repo/tests/test_chinese.py"
          cd "$repo"
          set +e
          python -m pytest -q -s tests/test_chinese.py::test_chinese > "$RUNNER_TEMP/fixed-test.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fixed-test.log"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "The pinned fixed revision did not pass; case fails the expected-reproduction gate."
            exit 1
          fi

      - name: Prepare audit record
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-abstention-case-smoke"
          cp "$RUNNER_TEMP/buggy-test.log" "$RUNNER_TEMP/evidence-abstention-case-smoke/buggy-test.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/fixed-test.log" "$RUNNER_TEMP/evidence-abstention-case-smoke/fixed-test.log" 2>/dev/null || true
          cat > "$RUNNER_TEMP/evidence-abstention-case-smoke/summary.json" <<'JSON'
          {
            "case_id": "BugsInPy-PySnooper-1",
            "purpose": "operational smoke test only; permanently excluded from confirmatory data",
            "dataset_repository": "https://github.com/soarsmu/BugsInPy",
            "dataset_commit": "11c5f1eea954a42132cfd06bf257766a7963e0fd",
            "source_repository": "https://github.com/cool-RR/PySnooper",
            "buggy_commit": "e21a31162f4c54be693d8ca8260e42393b39abd3",
            "fixed_commit": "56f22f8ffe1c6b2be4d2cf3ad1987fdb66113da2",
            "test": "tests/test_chinese.py::test_chinese",
            "python": "3.8.1",
            "llm_inference_performed": false,
            "confirmatory_eligible": false,
            "human_ground_truth_reviewed": false,
            "project_license_reviewed": false,
            "dataset_contamination_reviewed": false,
            "note": "CI pass is only a reproduction-pair smoke test; it is not case approval."
          }
          JSON

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-abstention-pysnooper-smoke
          path: ${{ runner.temp }}/evidence-abstention-case-smoke/
          if-no-files-found: warn
          retention-days: 14
