name: Evidence Abstention Dataset Case Smoke Test (Excluded Case Only)

on:
  push:
    branches:
      - "research/evidence-abstention-draft-2026-10-19"
    paths:
      - ".github/workflows/evidence-abstention-case-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/evidence-abstention-case-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  tqdm_bug_1:
    name: Exact-Python reproduction diagnostic (permanently excluded case)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up Conda with metadata-recorded Python 3.6.9
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: tqdm-smoke
          python-version: "3.6.9"
          channels: conda-forge
          channel-priority: strict
          use-only-tar-bz2: true

      - name: Verify exact runtime and install Python-3.6-compatible test tools
        run: |
          set -euo pipefail
          python --version
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.6.9"
          python -m pip install --upgrade "pip<22" "setuptools<60" "wheel<0.38"
          python -m pip install "pytest<7" "nose==1.3.7"
          python -m pip freeze > "$RUNNER_TEMP/smoke-pip-freeze.txt"

      - name: Fetch pinned dataset metadata and source repository
        shell: bash -el {0}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/soarsmu/BugsInPy.git "$RUNNER_TEMP/BugsInPy"
          git -C "$RUNNER_TEMP/BugsInPy" checkout --detach 11c5f1eea954a42132cfd06bf257766a7963e0fd
          test -f "$RUNNER_TEMP/BugsInPy/projects/tqdm/bugs/1/bug.info"
          recorded_python="$(sed -n 's/^python_version="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/BugsInPy/projects/tqdm/bugs/1/bug.info" | head -n 1)"
          test "$recorded_python" = "3.6.9"
          git clone https://github.com/tqdm/tqdm.git "$RUNNER_TEMP/tqdm"
          git -C "$RUNNER_TEMP/tqdm" checkout --detach c0dcf39b046d1b4ff6de14ac99ad9a1b10487512
          test -f "$RUNNER_TEMP/tqdm/tqdm/tests/tests_contrib.py"
          git -C "$RUNNER_TEMP/tqdm" show c0dcf39b046d1b4ff6de14ac99ad9a1b10487512:tqdm/tests/tests_contrib.py > "$RUNNER_TEMP/tests_contrib.py"
          test -s "$RUNNER_TEMP/tests_contrib.py"

      - name: Capture runtime fingerprint before tests
        run: |
          set -euo pipefail
          {
            python --version
            python -c 'import platform, sys; print("executable=" + sys.executable); print("platform=" + platform.platform()); print("implementation=" + platform.python_implementation())'
            conda list
            cat "$RUNNER_TEMP/smoke-pip-freeze.txt"
          } > "$RUNNER_TEMP/runtime-fingerprint.txt"
          cat "$RUNNER_TEMP/runtime-fingerprint.txt"

      - name: Run target test on the buggy revision (target failure expected)
        id: buggy_test
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.6.9"
          repo="$RUNNER_TEMP/tqdm"
          git -C "$repo" checkout --detach 8cc777fe8401a05d07f2c97e65d15e4460feab88
          git -C "$repo" clean -fd
          cp "$RUNNER_TEMP/tests_contrib.py" "$repo/tqdm/tests/tests_contrib.py"
          cd "$repo"
          export PYTHONPATH="$repo"
          set +e
          python -m pytest -q -s tqdm/tests/tests_contrib.py::test_enumerate > "$RUNNER_TEMP/buggy-test.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/buggy-test.log"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "The pinned buggy revision unexpectedly passed; the diagnostic pair is not reproduced."
            exit 1
          fi
          if ! grep -Eq "FAILED tqdm/tests/tests_contrib.py::test_enumerate" "$RUNNER_TEMP/buggy-test.log"; then
            echo "The intended test did not fail. Collection, import, or environment errors do not qualify."
            exit 1
          fi

      - name: Run the same target test on the fixed revision (pass expected)
        id: fixed_test
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.6.9"
          repo="$RUNNER_TEMP/tqdm"
          git -C "$repo" reset --hard c0dcf39b046d1b4ff6de14ac99ad9a1b10487512
          cd "$repo"
          export PYTHONPATH="$repo"
          set +e
          python -m pytest -q -s tqdm/tests/tests_contrib.py::test_enumerate > "$RUNNER_TEMP/fixed-test.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/fixed-test.log"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "The fixed revision did not pass; the pair is not reproduced."
            exit 1
          fi
          if ! grep -Eq "1 passed" "$RUNNER_TEMP/fixed-test.log"; then
            echo "The fixed run did not report the target test passing."
            exit 1
          fi

      - name: Prepare audit record
        if: always()
        shell: bash -el {0}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-abstention-case-smoke"
          for file in buggy-test.log fixed-test.log runtime-fingerprint.txt smoke-pip-freeze.txt; do
            cp "$RUNNER_TEMP/$file" "$RUNNER_TEMP/evidence-abstention-case-smoke/$file" 2>/dev/null || true
          done
          runtime_python="unavailable"
          if command -v python >/dev/null 2>&1; then
            runtime_python="$(python -c 'import platform; print(platform.python_version())' 2>/dev/null || echo unavailable)"
          fi
          runtime_match=false
          if [ "$runtime_python" = "3.6.9" ]; then runtime_match=true; fi
          buggy_code="${{ steps.buggy_test.outputs.exit_code || 'not_run' }}"
          fixed_code="${{ steps.fixed_test.outputs.exit_code || 'not_run' }}"
          cat > "$RUNNER_TEMP/evidence-abstention-case-smoke/summary.json" <<JSON
          {
            "case_id": "BugsInPy-tqdm-1",
            "purpose": "exact-runtime diagnostic only; permanently excluded from confirmatory data because its metadata/patch was opened during feasibility review",
            "dataset_repository": "https://github.com/soarsmu/BugsInPy",
            "dataset_commit": "11c5f1eea954a42132cfd06bf257766a7963e0fd",
            "source_repository": "https://github.com/tqdm/tqdm",
            "buggy_commit": "8cc777fe8401a05d07f2c97e65d15e4460feab88",
            "fixed_commit": "c0dcf39b046d1b4ff6de14ac99ad9a1b10487512",
            "test": "tqdm/tests/tests_contrib.py::test_enumerate",
            "dataset_recorded_python": "3.6.9",
            "runtime_python_observed": "$runtime_python",
            "runtime_matches_metadata": $runtime_match,
            "buggy_test_exit_code": "$buggy_code",
            "fixed_test_exit_code": "$fixed_code",
            "llm_inference_performed": false,
            "confirmatory_eligible": false,
            "human_ground_truth_reviewed": false,
            "project_license_reviewed": false,
            "dataset_contamination_reviewed": false,
            "note": "This previously exposed case is permanently excluded regardless of smoke outcome. Only a target-specific buggy failure plus the same fixed test passing under exact metadata Python may count as a reproduced test pair."
          }
          JSON
          find "$RUNNER_TEMP/evidence-abstention-case-smoke" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/evidence-abstention-case-smoke/SHA256SUMS"

      - name: Upload exact-runtime smoke logs (excluded case only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-abstention-tqdm-exact-python-smoke
          path: ${{ runner.temp }}/evidence-abstention-case-smoke/
          if-no-files-found: warn
          retention-days: 30
