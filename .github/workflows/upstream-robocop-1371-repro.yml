name: Upstream Robocop #1371 fail-pass reproduction (no inference)

on:
  pull_request:
    paths:
      - ".github/workflows/upstream-robocop-1371-repro.yml"

permissions:
  contents: read

jobs:
  reproduce:
    name: Exact base-fail / fix-pass regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Clone upstream repository and pin exact commits
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/MarketSquare/robotframework-robocop.git upstream
          git -C upstream checkout --detach 271e73253a70710cc80374128efa9eabb549b5f2
          git -C upstream rev-parse HEAD
          git -C upstream fetch --depth=1 origin ceb6824fb4d80442937497a740edf60a5b6382e0
          git -C upstream cat-file -e ceb6824fb4d80442937497a740edf60a5b6382e0^{commit}

      - name: Create identical regression test for both revisions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test_robocop_issue_1371.py <<'PY'
          import os
          from pathlib import Path

          import pytest
          from typer.testing import CliRunner

          from robocop.run import app

          @pytest.mark.parametrize(
              ("check", "will_format", "expected_exit_code"),
              [
                  (False, True, 0),
                  (False, False, 0),
                  (True, True, 1),
                  (True, False, 0),
              ],
          )
          def test_issue_1371_exit_code(check, will_format, expected_exit_code, monkeypatch):
              root = Path(os.environ["ROBOCOP_ROOT"])
              test_data = root / "tests" / "formatter" / "formatters" / "NormalizeSeparators"
              test_data = test_data / ("source" if will_format else "expected")
              command = ["format", "--select", "NormalizeSeparators", "--no-overwrite"]
              if check:
                  command.append("--check")
              monkeypatch.chdir(test_data)
              result = CliRunner().invoke(app, [*command, "test.robot"])
              assert result.exit_code == expected_exit_code
          PY

      - name: Prove the exact base commit fails the regression test
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git checkout --detach 271e73253a70710cc80374128efa9eabb549b5f2
          python -m venv /tmp/robocop-base-venv
          /tmp/robocop-base-venv/bin/python -m pip install --disable-pip-version-check -e . pytest
          /tmp/robocop-base-venv/bin/python -m pip check
          set +e
          ROBOCOP_ROOT="$PWD" /tmp/robocop-base-venv/bin/python -m pytest -vv /tmp/test_robocop_issue_1371.py 2>&1 | tee /tmp/base-test.log
          test_status=\${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 1 ]] || ! grep -Eq "1 failed, 3 passed" /tmp/base-test.log || ! grep -q "assert 0 == 1" /tmp/base-test.log; then
            echo "::error::Base commit did not fail in the expected issue-specific regression case."
            exit 1
          fi
          echo "BASE_EXPECTED_FAILURE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned base commit reproduces issue #1371: one --check/modified-files assertion fails; three controls pass." >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the exact fix commit passes the same regression test
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git checkout --detach ceb6824fb4d80442937497a740edf60a5b6382e0
          python -m venv /tmp/robocop-fix-venv
          /tmp/robocop-fix-venv/bin/python -m pip install --disable-pip-version-check -e . pytest
          /tmp/robocop-fix-venv/bin/python -m pip check
          ROBOCOP_ROOT="$PWD" /tmp/robocop-fix-venv/bin/python -m pytest -vv /tmp/test_robocop_issue_1371.py 2>&1 | tee /tmp/fix-test.log
          grep -Eq "4 passed" /tmp/fix-test.log
          echo "FIX_EXPECTED_PASS=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned fix commit passes all four identical regression/control cases." >> "$GITHUB_STEP_SUMMARY"

      - name: Record tested source identities
        if: always()
        shell: bash
        run: |
          {
            echo "## Reproduction identity"
            echo "- Repository: MarketSquare/robotframework-robocop"
            echo "- Base: 271e73253a70710cc80374128efa9eabb549b5f2"
            echo "- Fix: ceb6824fb4d80442937497a740edf60a5b6382e0"
            echo "- Test: same four parameterized cases executed at both commits"
            echo "- Model inference/training: not invoked"
          } >> "$GITHUB_STEP_SUMMARY"
