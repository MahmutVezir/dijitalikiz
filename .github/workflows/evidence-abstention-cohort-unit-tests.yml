name: Evidence abstention cohort builder tests (No Inference)

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-abstention-cohort-batch1.yml"
      - ".github/workflows/evidence-abstention-cohort-unit-tests.yml"
      - "research_candidates/evidence_abstention/SCREENING_COHORT_100_V9_2026-10-22.json"
      - "scripts/inventory_bugsinpy_candidates.py"
      - "scripts/build_evidence_abstention_screening_queue.py"
      - "scripts/build_evidence_abstention_cohort_matrix.py"
      - "scripts/build_evidence_abstention_intake.py"
      - "scripts/evidence_abstention_requires_pytest.py"
      - "tests/test_inventory_bugsinpy_candidates.py"
      - "tests/test_build_evidence_abstention_screening_queue.py"
      - "tests/test_build_evidence_abstention_cohort_matrix.py"
      - "tests/test_build_evidence_abstention_intake.py"
      - "tests/test_evidence_abstention_requires_pytest.py"
  push:
    branches:
      - "research/evidence-abstention-*"
    paths:
      - ".github/workflows/evidence-abstention-cohort-batch1.yml"
      - ".github/workflows/evidence-abstention-cohort-unit-tests.yml"
      - "research_candidates/evidence_abstention/SCREENING_COHORT_100_V9_2026-10-22.json"
      - "scripts/inventory_bugsinpy_candidates.py"
      - "scripts/build_evidence_abstention_screening_queue.py"
      - "scripts/build_evidence_abstention_cohort_matrix.py"
      - "scripts/build_evidence_abstention_intake.py"
      - "scripts/evidence_abstention_requires_pytest.py"
      - "tests/test_inventory_bugsinpy_candidates.py"
      - "tests/test_build_evidence_abstention_screening_queue.py"
      - "tests/test_build_evidence_abstention_cohort_matrix.py"
      - "tests/test_build_evidence_abstention_intake.py"
      - "tests/test_evidence_abstention_requires_pytest.py"

permissions:
  contents: read

jobs:
  metadata-builder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run metadata-only and batch-offset regression tests
        shell: bash
        run: |
          set +e
          log_dir="$RUNNER_TEMP/metadata-builder-test-logs"
          mkdir -p "$log_dir"
          failed=0
          for spec in \
            "test_inventory_bugsinpy_candidates.py" \
            "test_build_evidence_abstention_screening_queue.py" \
            "test_build_evidence_abstention_cohort_matrix.py" \
            "test_build_evidence_abstention_intake.py" \
            "test_evidence_abstention_requires_pytest.py"; do
            log="$log_dir/$spec.log"
            python -m unittest discover -s tests -p "$spec" -v >"$log" 2>&1
            rc=$?
            cat "$log"
            printf '%s\n' "$rc" > "$log_dir/$spec.exit-code"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"

      - name: Upload metadata test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-builder-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metadata-builder-test-logs/
          if-no-files-found: warn
          retention-days: 14
