name: GeoFileOps #649 — pre-acceptance snapshot archival integrity (no inference)

on:
  push:
    branches:
      - "research/2026-11-16-followup-evidence-validation"
    paths:
      - ".github/workflows/geofileops-649-case-acceptance-validation.yml"
      - "research_candidates/evidence_abstention/geofileops_649/SWE_REBENCH_V2_GEOFILEOPS_649_CASE_ACCEPTANCE_PROPOSED_V0_2_2026-11-21.json"
      - "research_candidates/evidence_abstention/geofileops_649/SWE_REBENCH_V2_GEOFILEOPS_649_CASE_ACCEPTANCE_V0_2_2026-11-21.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_REGISTRY_V0_2.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_ACCEPTANCE_SCHEMA_V0_1.json"
      - "research_candidates/evidence_abstention/implementation/swe_rebench_v2_exploratory_case_acceptance.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/geofileops-649-case-acceptance-validation.yml"
      - "research_candidates/evidence_abstention/geofileops_649/**"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_REGISTRY_V0_2.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_ACCEPTANCE_SCHEMA_V0_1.json"
      - "research_candidates/evidence_abstention/implementation/swe_rebench_v2_exploratory_case_acceptance.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geofileops-649-pre-acceptance-archive-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-historical-proposal-and-accepted-copy:
    name: Validate proposal snapshot, accepted copy and exact evidence preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate immutable proposal snapshot and accepted record
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="research_candidates/evidence_abstention/implementation${PYTHONPATH:+:$PYTHONPATH}"
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from swe_rebench_v2_exploratory_case_acceptance import validate_case_record, validate_registry

          root = Path("research_candidates/evidence_abstention")
          proposed = json.loads((root / "geofileops_649/SWE_REBENCH_V2_GEOFILEOPS_649_CASE_ACCEPTANCE_PROPOSED_V0_2_2026-11-21.json").read_text(encoding="utf-8"))
          accepted = json.loads((root / "geofileops_649/SWE_REBENCH_V2_GEOFILEOPS_649_CASE_ACCEPTANCE_V0_2_2026-11-21.json").read_text(encoding="utf-8"))
          registry = json.loads((root / "SWE_REBENCH_V2_EXPLORATORY_CASE_REGISTRY_V0_2.json").read_text(encoding="utf-8"))

          proposed_result = validate_case_record(proposed)
          accepted_result = validate_case_record(accepted)
          registry_result = validate_registry(registry)
          print("PROPOSED SNAPSHOT")
          print(json.dumps(proposed_result, ensure_ascii=False, indent=2))
          print("ACCEPTED RECORD")
          print(json.dumps(accepted_result, ensure_ascii=False, indent=2))
          print("REGISTRY")
          print(json.dumps(registry_result, ensure_ascii=False, indent=2))

          assert proposed_result["status"] == "structurally_complete_candidate", proposed_result
          assert proposed_result["blockers"] == [], proposed_result
          assert proposed_result["acceptance_decision"] == "proposed"
          assert proposed_result["eligible_for_registry"] is False
          assert proposed["final_acceptance"]["status"] == "pending"

          assert accepted_result["status"] == "structurally_complete_candidate", accepted_result
          assert accepted_result["blockers"] == [], accepted_result
          assert accepted_result["acceptance_decision"] == "accepted"
          assert accepted_result["eligible_for_registry"] is True
          assert accepted["final_acceptance"]["status"] == "approved"
          assert accepted["final_acceptance"]["decision_record"]["sha256"]

          # The accepted case must preserve every scientific/evidence field from
          # the proposal snapshot; only the final decision fields may differ.
          expected = copy.deepcopy(proposed)
          expected["acceptance_decision"] = "accepted"
          expected["final_acceptance"] = accepted["final_acceptance"]
          assert expected == accepted, "Accepted record must differ only by final decision fields"

          assert registry_result["status"] == "structurally_valid_candidate_registry", registry_result
          assert registry_result["blockers"] == [], registry_result
          matches = [item for item in registry["records"] if item.get("case_id") == accepted["case_id"]]
          assert len(matches) == 1
          assert matches[0] == accepted
          assert registry_result["inference_authorized"] is False
          print("PASS: proposal remains an immutable pending snapshot; accepted copy preserves all evidence; registry is valid; no inference.")
          PY
