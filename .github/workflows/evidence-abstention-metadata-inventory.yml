name: Evidence Abstention Metadata Inventory (No Tests, No Inference)

on:
  push:
    branches:
      - "research/evidence-abstention-draft-2026-10-19"
    paths:
      - "scripts/inventory_bugsinpy_candidates.py"
      - "tests/test_inventory_bugsinpy_candidates.py"
      - "scripts/build_evidence_abstention_screening_queue.py"
      - "tests/test_build_evidence_abstention_screening_queue.py"
      - "scripts/audit_evidence_abstention_triage_artifact.py"
      - "tests/test_audit_evidence_abstention_triage_artifact.py"
      - "research_candidates/evidence_abstention/DATA_FEASIBILITY.md"
      - "research_candidates/evidence_abstention/EXPOSURE_EXCLUSION_LOG_2026-10-21.json"
      - "research_candidates/evidence_abstention/EXPOSURE_EXCLUSION_ADDENDUM_2026-10-22.json"
      - ".github/workflows/evidence-abstention-metadata-inventory.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/inventory_bugsinpy_candidates.py"
      - "tests/test_inventory_bugsinpy_candidates.py"
      - "scripts/build_evidence_abstention_screening_queue.py"
      - "tests/test_build_evidence_abstention_screening_queue.py"
      - "research_candidates/evidence_abstention/DATA_FEASIBILITY.md"
      - "research_candidates/evidence_abstention/EXPOSURE_EXCLUSION_LOG_2026-10-21.json"
      - "research_candidates/evidence_abstention/EXPOSURE_EXCLUSION_ADDENDUM_2026-10-22.json"
      - ".github/workflows/evidence-abstention-metadata-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUGSINPY_COMMIT: "11c5f1eea954a42132cfd06bf257766a7963e0fd"
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test metadata inventory, screening queue and triage audit utilities
        shell: bash
        run: |
          set +e
          log_dir="$RUNNER_TEMP/metadata-inventory-diagnostics"
          mkdir -p "$log_dir"
          failed=0
          for spec in \
            "test_inventory_bugsinpy_candidates.py" \
            "test_build_evidence_abstention_screening_queue.py" \
            "test_audit_evidence_abstention_triage_artifact.py"; do
            log="$log_dir/$spec.log"
            python -m unittest discover -s tests -p "$spec" -v >"$log" 2>&1
            rc=$?
            cat "$log"
            printf '%s\n' "$rc" > "$log_dir/$spec.exit-code"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"

      - name: Fetch exact pinned BugsInPy metadata tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/soarsmu/BugsInPy.git "$RUNNER_TEMP/BugsInPy"
          git -C "$RUNNER_TEMP/BugsInPy" checkout --detach "$BUGSINPY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/BugsInPy" rev-parse HEAD)" = "$BUGSINPY_COMMIT"

      - name: Build metadata-only case inventory
        run: |
          python scripts/inventory_bugsinpy_candidates.py \
            --root "$RUNNER_TEMP/BugsInPy" \
            --output "$RUNNER_TEMP/bugsinpy-metadata-inventory.csv" \
            --summary "$RUNNER_TEMP/bugsinpy-metadata-inventory-summary.json" \
            --expected-commit "$BUGSINPY_COMMIT" \
            --expected-count 501

      - name: Build balanced manual screening queue (still no tests and no inference)
        run: |
          python scripts/build_evidence_abstention_screening_queue.py \
            --input "$RUNNER_TEMP/bugsinpy-metadata-inventory.csv" \
            --output "$RUNNER_TEMP/bugsinpy-screening-queue.csv" \
            --summary "$RUNNER_TEMP/bugsinpy-screening-queue-summary.json" \
            --first-batch-per-project 5

      - name: Upload metadata inventory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-inventory-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metadata-inventory-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload metadata inventory and manual screening queue (not accepted experiment data)
        uses: actions/upload-artifact@v4
        with:
          name: evidence-abstention-bugsinpy-screening-queue
          path: |
            ${{ runner.temp }}/bugsinpy-metadata-inventory.csv
            ${{ runner.temp }}/bugsinpy-metadata-inventory-summary.json
            ${{ runner.temp }}/bugsinpy-screening-queue.csv
            ${{ runner.temp }}/bugsinpy-screening-queue-summary.json
          if-no-files-found: error
          retention-days: 30
