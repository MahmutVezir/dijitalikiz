name: "PSyclone #2755 Pinned Test Environment Lock (No Tests, No Inference)"

on:
  pull_request:
    paths:
      - ".github/workflows/psyclone-2755-environment-lock.yml"
      - "research_candidates/evidence_abstention/PSYCLONE_2755_REQUIREMENTS_LOCK_PY313_2026-11-19.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve_environment:
    name: Resolve and fingerprint PSyclone test environment
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Checkout exact PSyclone buggy base and submodules
        uses: actions/checkout@v4
        with:
          repository: stfc/PSyclone
          ref: a33a99b7953130220ed7d3ad38d358c1124276af
          path: psyclone
          submodules: recursive
          fetch-depth: 0

      - name: Set up exact Python 3.13.0
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install pinned bootstrap installer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform
          import sys
          expected = "3.13.0"
          actual = platform.python_version()
          print("expected_python=" + expected)
          print("observed_python=" + actual)
          print("executable=" + sys.executable)
          if actual != expected:
              raise SystemExit("Python patch version differs from frozen environment selection")
          PY
          python -m pip install --disable-pip-version-check "pip==24.3.1"

      - name: Resolve PSyclone test dependencies (no test execution)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "setuptools==75.3.0" "wheel==0.45.0"
          cd psyclone
          python -m pip install --disable-pip-version-check ".[test]"
          python -m pip check
          cd ..
          python - <<'PY'
          import importlib.metadata as md
          import json
          import platform
          import sys
          from pathlib import Path
          from packaging.utils import canonicalize_name

          excluded = {"psyclone"}
          package_versions = {}
          license_records = {}
          duplicate_metadata = []
          for dist in md.distributions():
              name = dist.metadata.get("Name")
              version = dist.version
              if not name:
                  continue
              normalized = canonicalize_name(name)
              if normalized in excluded:
                  continue
              prior = package_versions.get(normalized)
              if prior is not None and prior != version:
                  raise SystemExit(
                      f"Conflicting installed versions for {normalized}: {prior} vs {version}"
                  )
              if prior is not None:
                  duplicate_metadata.append({"name": normalized, "version": version})
                  continue
              package_versions[normalized] = version
              meta = dist.metadata
              license_records[normalized] = {
                  "name": name,
                  "version": version,
                  "license": meta.get("License"),
                  "license_expression": meta.get("License-Expression"),
                  "home_page": meta.get("Home-page"),
                  "project_urls": meta.get_all("Project-URL") or [],
              }

          packages = sorted(package_versions.items())
          licenses = [license_records[name] for name, _ in packages]
          lock = "".join(f"{name}=={version}\n" for name, version in packages)
          Path("psyclone-environment-lock").mkdir(exist_ok=True)
          Path("psyclone-environment-lock/requirements.lock.txt").write_text(
              lock, encoding="utf-8"
          )
          fingerprint = {
              "purpose": "PSyclone #2755 paired Stage 2 environment lock discovery",
              "python": platform.python_version(),
              "python_implementation": platform.python_implementation(),
              "python_executable": sys.executable,
              "platform": platform.platform(),
              "pip_version": md.version("pip"),
              "setuptools_version": md.version("setuptools"),
              "wheel_version": md.version("wheel"),
              "upstream_repository": "stfc/PSyclone",
              "buggy_base_commit": "a33a99b7953130220ed7d3ad38d358c1124276af",
              "upstream_test_matrix_at_base": ["3.7", "3.8", "3.13"],
              "selected_python_rationale": "Exact 3.13.0 patch release, from the Python 3.13 line explicitly exercised by the upstream base commit's python-package CI workflow. Dataset row did not declare a Python runtime.",
              "submodules": __import__("subprocess").run(
                  ["git", "submodule", "status", "--recursive"],
                  cwd="psyclone", capture_output=True, text=True, check=True
              ).stdout.splitlines(),
              "package_count_excluding_local_psyclone": len(packages),
              "packages": [{"name": n, "version": v} for n, v in packages],
              "package_license_metadata": licenses,
              "duplicate_same_version_metadata_records_collapsed": duplicate_metadata,
              "test_execution_performed": False,
              "source_build_performed": True,
              "source_build_note": "Environment resolution ran pip install .[test] from the exact upstream PSyclone checkout; pip built and installed the local PSyclone wheel as part of dependency resolution. Stage 2 will not reinstall this wheel and will import the target tree through PYTHONPATH=src.",
              "source_tests_executed": False,
              "model_inference_performed": False,
          }
          import hashlib
          fingerprint["requirements_lock_sha256"] = hashlib.sha256(lock.encode("utf-8")).hexdigest()
          Path("psyclone-environment-lock/runtime-fingerprint.json").write_text(
              json.dumps(fingerprint, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps({
              "python": fingerprint["python"],
              "pip": fingerprint["pip_version"],
              "setuptools": fingerprint["setuptools_version"],
              "wheel": fingerprint["wheel_version"],
              "package_count": fingerprint["package_count_excluding_local_psyclone"],
              "requirements_lock_sha256": fingerprint["requirements_lock_sha256"],
              "test_execution_performed": False,
          }, indent=2))
          PY
          mkdir -p psyclone-environment-lock/wheelhouse
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --requirement psyclone-environment-lock/requirements.lock.txt \
            --dest psyclone-environment-lock/wheelhouse
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from packaging.utils import canonicalize_name, parse_wheel_filename

          root = Path("psyclone-environment-lock")
          wheelhouse = root / "wheelhouse"
          expected = {}
          for line in (root / "requirements.lock.txt").read_text(encoding="utf-8").splitlines():
              name, version = line.split("==", 1)
              expected[canonicalize_name(name)] = version

          observed = {}
          records = []
          for wheel in sorted(wheelhouse.glob("*.whl")):
              name, version, build, tags = parse_wheel_filename(wheel.name)
              normalized = canonicalize_name(name)
              if normalized in observed:
                  raise SystemExit(f"Multiple wheel artifacts selected for {normalized}; require a single exact platform artifact")
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              observed[normalized] = str(version)
              records.append({
                  "name": normalized,
                  "version": str(version),
                  "wheel_filename": wheel.name,
                  "sha256": digest,
                  "size_bytes": wheel.stat().st_size,
                  "tags": sorted(str(tag) for tag in tags),
              })

          if observed != expected:
              raise SystemExit(
                  "Downloaded wheel set differs from resolved package lock: "
                  f"missing={sorted(set(expected)-set(observed))}; "
                  f"unexpected={sorted(set(observed)-set(expected))}; "
                  f"version_mismatches={[(n, expected[n], observed.get(n)) for n in expected if observed.get(n) != expected[n]]}"
              )

          hashed_lock = "".join(
              f"{item['name']}=={item['version']} --hash=sha256:{item['sha256']}\\n"
              for item in sorted(records, key=lambda x: x["name"])
          )
          (root / "requirements.hashed.lock.txt").write_text(hashed_lock, encoding="utf-8")
          (root / "wheel-hashes.json").write_text(
              json.dumps(records, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )

          fingerprint_path = root / "runtime-fingerprint.json"
          fingerprint = json.loads(fingerprint_path.read_text(encoding="utf-8"))
          fingerprint["wheel_artifact_count"] = len(records)
          fingerprint["wheel_hashes_sha256"] = hashlib.sha256(
              json.dumps(records, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          fingerprint["hashed_requirements_lock_sha256"] = hashlib.sha256(
              hashed_lock.encode("utf-8")
          ).hexdigest()
          fingerprint_path.write_text(
              json.dumps(fingerprint, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          print(json.dumps({
              "wheel_count": len(records),
              "hashed_requirements_lock_sha256": fingerprint["hashed_requirements_lock_sha256"],
              "wheel_hashes_sha256": fingerprint["wheel_hashes_sha256"],
          }, indent=2))
          PY
          rm -rf psyclone-environment-lock/wheelhouse
          cp psyclone/setup.py psyclone-environment-lock/upstream-setup.py
          cp psyclone/setup.cfg psyclone-environment-lock/upstream-setup.cfg
          cp psyclone/requirements.txt psyclone-environment-lock/upstream-requirements.txt
          cp psyclone/.github/workflows/python-package.yml psyclone-environment-lock/upstream-python-package.yml
          cp psyclone/LICENSE psyclone-environment-lock/upstream-LICENSE

      - name: Hash and upload immutable environment lock
        shell: bash
        run: |
          set -euo pipefail
          cd psyclone-environment-lock
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload pinned environment and dependency-license inventory
        uses: actions/upload-artifact@v4
        with:
          name: psyclone-2755-python313-environment-lock
          path: psyclone-environment-lock/
          if-no-files-found: error
          retention-days: 90
