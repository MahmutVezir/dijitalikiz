name: Extract pinned SWE-rebench V2 environment metadata (no upstream execution)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/swe-rebench-v2-pyfar-environment-metadata.yml"
      - "scripts/extract_swe_rebench_v2_environment_metadata.py"
      - "tests/test_extract_swe_rebench_v2_environment_metadata.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swe-rebench-v2-pyfar-environment-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-pinned-environment-metadata:
    name: Extract pyfar row install_config from exact pinned Parquet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATASET_URL: "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet"
      EXPECTED_SHA256: "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9"
      EXPECTED_BYTES: "226272977"
      TARGET_INSTANCE_ID: "pyfar__pyfar-722"
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install pinned Parquet reader only
        run: python -m pip install --disable-pip-version-check "pyarrow==19.0.1"

      - name: Run extraction utility unit tests
        run: python -m unittest discover -s tests -p "test_extract_swe_rebench_v2_environment_metadata.py" -v

      - name: Download exact pinned Parquet snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swe-rebench-v2"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DATASET_URL" \
            --output "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet"
          actual_bytes="$(stat -c '%s' "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet")"
          actual_sha="$(sha256sum "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet" | awk '{print $1}')"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          test "$actual_sha" = "$EXPECTED_SHA256"

      - name: Extract only pyfar row environment metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_swe_rebench_v2_environment_metadata.py \
            --input "$RUNNER_TEMP/swe-rebench-v2/train-00000-of-00001.parquet" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --output "$RUNNER_TEMP/swe-rebench-v2/PYFAR_722_ENVIRONMENT_METADATA.json"

      - name: Upload exact-row environment metadata
        uses: actions/upload-artifact@v4
        with:
          name: pyfar-722-environment-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-rebench-v2/PYFAR_722_ENVIRONMENT_METADATA.json
          if-no-files-found: error
          retention-days: 90
