name: Fetch official TÜBİTAK 2204-A 2026-2027 template

on:
  push:
    paths:
      - ".github/template-fetch-trigger"
      - ".github/workflows/fetch-tubitak-template.yml"
      - "scripts/build_tubitak_report_docx.py"
      - "docs/TUBITAK_REPORT_DRAFT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-official-template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v5

      - name: Download and verify official Word template
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tubitak.gov.tr/sites/default/files/2026-09/proje_yazma_sablonu_2026-2027.docx"
          mkdir -p /tmp/tubitak-template
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$URL" --output /tmp/tubitak-template/proje_yazma_sablonu_2026-2027.docx
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import zipfile
          from pathlib import Path

          out_dir = Path("/tmp/tubitak-template")
          docx_path = out_dir / "proje_yazma_sablonu_2026-2027.docx"
          assert docx_path.is_file() and docx_path.stat().st_size > 1000, "Downloaded template is missing or implausibly small"
          with zipfile.ZipFile(docx_path) as package:
              bad = package.testzip()
              assert bad is None, f"Corrupt DOCX package member: {bad}"
              names = set(package.namelist())
              assert "word/document.xml" in names, "Downloaded file is not a valid DOCX package"

          report_src = Path("docs/TUBITAK_REPORT_DRAFT.md")
          ai_src = Path("docs/AI_USAGE_DISCLOSURE_DRAFT.md")
          assert report_src.is_file() and ai_src.is_file(), "Report draft or AI disclosure draft is missing"
          shutil.copy2(report_src, out_dir / report_src.name)
          shutil.copy2(ai_src, out_dir / ai_src.name)

          def digest_file(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "source_url": "https://tubitak.gov.tr/sites/default/files/2026-09/proje_yazma_sablonu_2026-2027.docx",
              "file_name": docx_path.name,
              "size_bytes": docx_path.stat().st_size,
              "sha256": digest_file(docx_path),
              "zip_test": "passed",
              "document_xml_present": True,
              "report_source": {"file_name": report_src.name, "sha256": digest_file(out_dir / report_src.name)},
              "ai_disclosure_source": {"file_name": ai_src.name, "sha256": digest_file(out_dir / ai_src.name)},
          }
          (out_dir / "template_manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install document build and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils

      - name: Build report from current Markdown and official template
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_tubitak_report_docx.py \
            --markdown docs/TUBITAK_REPORT_DRAFT.md \
            --template /tmp/tubitak-template/proje_yazma_sablonu_2026-2027.docx \
            --output /tmp/tubitak-template/TUBITAK_2204A_Rapor_Taslak_2026-2027.docx \
            --manifest /tmp/tubitak-template/report_build_manifest.json
          PDF="/tmp/tubitak-template/TUBITAK_2204A_Rapor_Taslak_2026-2027.pdf"
          soffice --headless --convert-to pdf --outdir /tmp/tubitak-template /tmp/tubitak-template/TUBITAK_2204A_Rapor_Taslak_2026-2027.docx
          test -s "$PDF"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          echo "Rendered report pages: $PAGES"
          test "$PAGES" -le 20
          mkdir -p /tmp/tubitak-template/render
          pdftoppm -png -r 110 "$PDF" /tmp/tubitak-template/render/page
          test "$(find /tmp/tubitak-template/render -name 'page-*.png' | wc -l)" -eq "$PAGES"
          python - "$PDF" "$PAGES" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          pdf = Path(sys.argv[1])
          manifest_path = Path("/tmp/tubitak-template/report_build_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["output_pdf"] = pdf.name
          manifest["output_pdf_sha256"] = hashlib.sha256(pdf.read_bytes()).hexdigest()
          manifest["pdf_page_count"] = int(sys.argv[2])
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY

      - name: Upload verified template as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubitak-official-template-2026-2027
          path: /tmp/tubitak-template/
          if-no-files-found: error
          retention-days: 5
