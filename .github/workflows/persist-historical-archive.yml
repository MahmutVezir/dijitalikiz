name: Persist pinned historical confirmatory archive (no inference)

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Confirm that this action only restores the immutable 2026-10-09 archive and opens a review PR."
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: persist-historical-confirmatory-archive
  cancel-in-progress: false

jobs:
  persist:
    if: github.repository == 'MahmutVezir/dijitalikiz'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: "11640450681"
      EXPECTED_BYTES: "292742"
      EXPECTED_SHA256: "e54ad960f141f3fadcfbdd88528f89d9fc0727c0c5e5062250d94da9cb0943bd"
      ARCHIVE_PATH: "data/historical/confirmatory_artifact_2026-10-09.zip"
      ARCHIVE_ACK: ${{ inputs.acknowledge }}

    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Guard target and detect an already-persisted identical archive
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "MahmutVezir/dijitalikiz"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ARCHIVE_ACK" = "true" || {
            echo "::error::Explicit manual acknowledgement is required."
            exit 1
          }

          if [[ -e "$ARCHIVE_PATH" ]]; then
            test -f "$ARCHIVE_PATH" || {
              echo "::error::The historical archive path exists but is not a regular file."
              exit 1
            }
            existing="$(sha256sum "$ARCHIVE_PATH" | cut -d' ' -f1)"
            test "$existing" = "$EXPECTED_SHA256" || {
              echo "::error::The repository path contains different bytes; refusing to overwrite it."
              exit 1
            }
            echo "already_present=true" >> "$GITHUB_OUTPUT"
            echo "The exact pinned archive is already present; no branch or PR is needed."
          else
            echo "already_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the original GitHub Actions artifact
        if: steps.guard.outputs.already_present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/confirmatory_artifact_2026-10-09.zip"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output "$archive_path" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test -s "$archive_path"

      - name: Verify exact archive bytes and all historical records (no inference)
        if: steps.guard.outputs.already_present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/confirmatory_artifact_2026-10-09.zip"
          test "$(stat -c '%s' "$archive_path")" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive_path" | sha256sum --check -
          python -m zipfile -t "$archive_path"
          python scripts/audit_historical_artifact.py \
            --archive "$archive_path" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --expected-run-record-count 160

      - name: Create an isolated review branch and open a pull request
        if: steps.guard.outputs.already_present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/confirmatory_artifact_2026-10-09.zip"
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          test ! -e "$ARCHIVE_PATH"
          cp -- "$archive_path" "$ARCHIVE_PATH"
          test "$(stat -c '%s' "$ARCHIVE_PATH")" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE_PATH" | sha256sum --check -

          branch="automation/persist-confirmatory-archive-$GITHUB_RUN_ID"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ARCHIVE_PATH"
          git diff --cached --check
          git commit -m "data(research): persist immutable confirmatory archive"
          git push origin "$branch"

          cat > "$RUNNER_TEMP/pull-request-body.md" <<'EOF'
          ## Purpose
          Restore the original 2026-10-09 confirmatory artifact into the repository's historical audit path.

          ## Fail-closed validation performed before branch creation
          - GitHub Actions artifact ID: 11640450681
          - Exact byte length: 292742
          - Exact SHA-256: e54ad960f141f3fadcfbdd88528f89d9fc0727c0c5e5062250d94da9cb0943bd
          - ZIP integrity check and the repository's historical artifact auditor
          - Exactly 160 historical run records required by the frozen manifest

          This workflow only downloads, validates, and proposes the immutable historical ZIP. It does not execute model inference, invoke Kaggle, modify historical results/prompts/manifests, or push directly to main. Review and the regular no-inference CI are still required before merge.
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "data(research): persist immutable historical confirmatory archive" \
            --body-file "$RUNNER_TEMP/pull-request-body.md"

          # GITHUB_TOKEN-created PR/push events do not reliably start a new workflow.
          # Explicitly dispatch the existing no-inference validator on the archive PR branch.
          head_sha="$(git rev-parse HEAD)"
          gh workflow run research-validation.yml --ref "$branch"

          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow research-validation.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          test -n "$run_id" || {
            echo "::error::Archive PR was created, but no matching no-inference validation run could be found."
            exit 1
          }
          echo "No-inference validation run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run watch "$run_id" --exit-status
