name: Kaggle Frozen Pilot

on:
  workflow_dispatch:
    inputs:
      execute_inference:
        description: "Run the frozen pilot on Kaggle GPU"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - ".github/kaggle-pilot-trigger"

permissions:
  contents: read

concurrency:
  group: dijitalikiz-frozen-pilot-v2
  cancel-in-progress: false

jobs:
  run-frozen-pilot:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execute_inference == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Kaggle CLI and identity helper
        run: python -m pip install --upgrade pip kaggle kagglehub

      - name: Verify token and resolve Kaggle account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing GitHub secret: KAGGLE_API_TOKEN"; exit 1; }
          KAGGLE_USER="$(python -c 'import kagglehub; print(kagglehub.whoami(verbose=False)["username"])')"
          test -n "$KAGGLE_USER" || { echo "Could not resolve Kaggle username from token"; exit 1; }
          echo "KAGGLE_USERNAME=$KAGGLE_USER" >> "$GITHUB_ENV"
          kaggle --version
          kaggle kernels list --mine --page-size 20

      - name: Resolve existing Kaggle pilot kernel slug
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_REF="$(kaggle kernels list --mine --page-size 50 2>/dev/null | awk '$1=="mahmutvezir/dijitalikiz-frozen-pilot" {print $1; exit}')"
          if [ -z "$KERNEL_REF" ]; then
            echo "Expected Kaggle kernel mahmutvezir/dijitalikiz-frozen-pilot was not found."
            kaggle kernels list --mine --page-size 50 || true
            exit 1
          fi
          echo "Resolved existing Kaggle kernel: $KERNEL_REF"
          echo "KAGGLE_KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"
          kaggle kernels status "$KERNEL_REF" || true

      - name: Publish exact-source Kaggle Dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-source
          mkdir -p .kaggle-source
          git archive             --format=tar.gz             --output=/tmp/dijitalikiz-source.tar.gz             --exclude=RSC-Bench-pilot-v1.0-stage4-gated             --exclude=RSC-Bench-pilot-v1.0-stage4-gated.zip             HEAD
          base64 -w 0 /tmp/dijitalikiz-source.tar.gz > .kaggle-source/project.tar.gz.b64
          printf '\n' >> .kaggle-source/project.tar.gz.b64
          printf '%s\n' "$GITHUB_SHA" > .kaggle-source/source_commit.txt
          cat > .kaggle-source/dataset-metadata.json <<EOF
          {
            "title": "Dijitalikiz Frozen Source v2",
            "subtitle": "Exact source bundle for the frozen TÜBİTAK pilot",
            "description": "Versioned private source bundle for reproducible Kaggle pilot execution. Commit: $GITHUB_SHA",
            "id": "mahmutvezir/dijitalikiz-frozen-source-v2",
            "licenses": [{"name": "MIT"}]
          }
          EOF
          python -m json.tool .kaggle-source/dataset-metadata.json >/dev/null
          DATASET_ID="mahmutvezir/dijitalikiz-frozen-source-v2"
          exists=0
          for attempt in $(seq 1 12); do
            if kaggle datasets list --mine --page-size 100 2>/dev/null | awk -v id="$DATASET_ID" '$1==id {found=1} END{exit found ? 0 : 1}'; then
              exists=1
              echo "Kaggle source Dataset is visible to the authenticated account."
              break
            fi
            echo "Frozen source Dataset not visible yet (attempt $attempt/12)."
            sleep 10
          done

          if [ "$exists" -eq 1 ]; then
            echo "Publishing a new version of the existing frozen source Dataset."
            kaggle datasets version -p .kaggle-source -m "Frozen source $GITHUB_SHA" -q -t -r skip
          else
            echo "Frozen source Dataset is not present; creating it once."
            kaggle datasets create -p .kaggle-source -q -t -r skip
          fi

          visible=0
          for attempt in $(seq 1 60); do
            if kaggle datasets list --mine --page-size 100 2>/dev/null | awk -v id="$DATASET_ID" '$1==id {found=1} END{exit found ? 0 : 1}'; then
              visible=1
              echo "Frozen source Dataset is now visible."
              break
            fi
            echo "Waiting for Kaggle Dataset publication (attempt $attempt/60)."
            sleep 10
          done
          test "$visible" -eq 1 || {
            echo "Kaggle source Dataset did not become visible after publication."
            exit 1
          }

      - name: Prepare Kaggle launcher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-kernel
          mkdir -p .kaggle-kernel
          cp kaggle/kernel.py .kaggle-kernel/kernel.py
          python -m py_compile .kaggle-kernel/kernel.py
          test "$(grep -c 'SOURCE_DATASET = "mahmutvezir/dijitalikiz-frozen-source-v2"' .kaggle-kernel/kernel.py)" -eq 1
          test "$(grep -c 'source_commit_verified_from_kaggle_dataset' .kaggle-kernel/kernel.py)" -eq 1
          cat > .kaggle-kernel/kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_KERNEL_REF",
            "title": "dijitalikiz-frozen-pilot",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": ["mahmutvezir/dijitalikiz-frozen-source-v2"],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          python -m json.tool .kaggle-kernel/kernel-metadata.json >/dev/null
          sha256sum /tmp/dijitalikiz-source.tar.gz .kaggle-source/project.tar.gz.b64 .kaggle-source/source_commit.txt .kaggle-kernel/kernel.py

      - name: Push frozen pilot to Kaggle
        run: kaggle kernels push -p .kaggle-kernel

      - name: Wait for Kaggle completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 170); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_REF" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              exit 0
            fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
              exit 1
            fi
            sleep 60
          done
          kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
          exit 1

      - name: Download finalized pilot output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-output
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL_REF" -p kaggle-output --force
          find kaggle-output -maxdepth 4 -type f -print | sort
          for required in             pilot_records.jsonl             pilot_evaluation.json             case_level_analysis.json             pilot_qa_report.json             artifact_manifest.json
          do
            test -n "$(find kaggle-output -name "$required" -type f -print -quit)" || {
              echo "Missing finalized Kaggle artifact: $required"
              echo "Downloaded files:"
              find kaggle-output -maxdepth 5 -type f -print | sort
              exit 1
            }
          done
          MANIFEST_PATH="$(find kaggle-output -name artifact_manifest.json -type f -print -quit)"
          test -n "$MANIFEST_PATH" || {
            echo "artifact_manifest.json was not produced."
            exit 1
          }

      - name: Verify downloaded artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_pilot_artifact_manifest.py             --artifact-root kaggle-output             --manifest "$(find kaggle-output -name artifact_manifest.json -print -quit)"

      - name: Upload immutable pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dijitalikiz-pilot-${{ github.sha }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30
