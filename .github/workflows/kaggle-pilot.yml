name: Kaggle Frozen Pilot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/kaggle-pilot-trigger"

jobs:
  run-frozen-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Verify token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle --version

      - name: Resolve Kaggle identity
        run: |
          python -m pip install --upgrade kagglehub
          python - <<'PY'
          import kagglehub
          username = kagglehub.whoami(verbose=False)["username"]
          print("Kaggle account:", username)
          with open("/tmp/kaggle_username", "w", encoding="utf-8") as f:
              f.write(username)
          PY

      - name: Verify Kaggle API access
        run: |
          set -euo pipefail
          kaggle kernels list --mine --page-size 3
