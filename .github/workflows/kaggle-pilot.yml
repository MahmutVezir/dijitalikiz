name: Kaggle Pilot

on:
  workflow_dispatch:
    inputs:
      run_pilot:
        description: "Run the frozen 30-run Kaggle GPU pilot"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  push-to-kaggle:
    runs-on: ubuntu-latest
    if: inputs.run_pilot == true
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KERNEL_SLUG: dijitalikiz-pilot

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Kaggle secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN}" || { echo "Missing GitHub secret: KAGGLE_API_TOKEN"; exit 1; }
          test -n "${KAGGLE_USERNAME}" || { echo "Missing GitHub secret: KAGGLE_USERNAME"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Verify Kaggle authentication
        run: |
          kaggle --version
          kaggle kernels list --mine --page-size 5

      - name: Prepare exact-source Kaggle bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kaggle-kernel
          cp kaggle/kernel.py .kaggle-kernel/kernel.py
          git archive --format=tar.gz --output=.kaggle-kernel/project.tar.gz HEAD
          printf '%s\n' "${GITHUB_SHA}" > .kaggle-kernel/source_commit.txt
          cat > .kaggle-kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "dijitalikiz-pilot",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "keywords": ["llm", "bug-diagnosis", "ccdg", "tubitak"]
          }
          EOF
          tar -tzf .kaggle-kernel/project.tar.gz | head -20
          cat .kaggle-kernel/source_commit.txt
          cat .kaggle-kernel/kernel-metadata.json

      - name: Push and run on Kaggle GPU
        run: |
          kaggle kernels push -p .kaggle-kernel --timeout 10800 --accelerator NvidiaTeslaT4

      - name: Wait for Kaggle completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            status="$(kaggle kernels status "${KAGGLE_USERNAME}/${KERNEL_SLUG}" 2>&1 || true)"
            echo "${status}"
            if echo "${status}" | grep -Eiq 'complete|error|cancel'; then
              if echo "${status}" | grep -Eiq 'error|cancel'; then
                exit 1
              fi
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for Kaggle kernel."
          exit 1

      - name: Download immutable Kaggle outputs
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          kaggle kernels output "${KAGGLE_USERNAME}/${KERNEL_SLUG}" -p kaggle-output --force
          find kaggle-output -maxdepth 4 -type f -print | sort
          test -n "$(find kaggle-output -name pilot_records.jsonl -print -quit)"
          test -n "$(find kaggle-output -name pilot_evaluation.json -print -quit)"
          test -n "$(find kaggle-output -name case_level_analysis.json -print -quit)"
          test -n "$(find kaggle-output -name pilot_artifact_manifest.json -print -quit)"

      - name: Upload pilot artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: dijitalikiz-pilot-${{ github.sha }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30
