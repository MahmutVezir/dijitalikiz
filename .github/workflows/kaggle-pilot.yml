name: Kaggle Frozen Pilot

on:
  workflow_dispatch:
    inputs:
      execute_inference:
        description: "Run the frozen 40-inference pilot on Kaggle GPU"
        required: true
        default: false
        type: boolean
      execute_confirmatory:
        description: "Run the frozen 160-inference confirmatory benchmark on Kaggle GPU"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - ".github/kaggle-pilot-trigger"

permissions:
  contents: read
  actions: read

concurrency:
  # Isolate repaired downloads from a stale run using the former output layout.
  group: dijitalikiz-frozen-pilot-output-v2
  cancel-in-progress: false

jobs:
  validate-only:
    if: (github.event_name == 'workflow_dispatch' && inputs.execute_inference == false && inputs.execute_confirmatory == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[validate-only]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run repository tests and integrity checks without inference
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          pytest -q
          python scripts/audit_pilot_integrity.py
          python scripts/validate_all_cases.py
          python scripts/validate_all_candidates.py
          python scripts/validate_benchmark_manifest.py
          python scripts/audit_confirmatory_integrity.py

      - name: Independently audit the completed confirmatory artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="11640450681"
          EXPECTED_SHA256="e54ad960f141f3fadcfbdd88528f89d9fc0727c0c5e5062250d94da9cb0943bd"
          ARCHIVE="/tmp/dijitalikiz-confirmatory-artifact.zip"
          DEST="/tmp/dijitalikiz-confirmatory-artifact"
          mkdir -p "$DEST"

          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"

          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
            echo "Confirmatory archive SHA-256 mismatch: $ACTUAL_SHA256"
            exit 1
          }

          unzip -q "$ARCHIVE" -d "$DEST"
          python scripts/audit_confirmatory_artifact.py \
            --artifact-root "$DEST/confirmatory-output" \
            --output "$DEST/independent-audit.json"
          cat "$DEST/independent-audit.json"

      - name: Independently audit the completed pilot artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="11634641753"
          EXPECTED_SHA256="b12594415894d5cac18442d3bd6c505e843b1a14027272c1afa398a59101aca0"
          PILOT_SOURCE_COMMIT="d50adaf9b6d0b017a5d30c9ebd9dd404988dbfb5"
          ARCHIVE="/tmp/dijitalikiz-pilot-artifact.zip"
          DEST="/tmp/dijitalikiz-pilot-artifact"
          mkdir -p "$DEST"

          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"

          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
            echo "Pilot archive SHA-256 mismatch: $ACTUAL_SHA256"
            exit 1
          }

          unzip -q "$ARCHIVE" -d "$DEST"
          python - "$DEST/pilot-output" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / "artifact_manifest.json").read_text(encoding="utf-8"))
          entries = manifest.get("files", [])
          assert manifest.get("finalization_gate", {}).get("status") == "complete"
          assert manifest.get("file_count") == len(entries) == 55
          assert manifest.get("run_record_count") == 40

          expected_paths = set()
          for entry in entries:
              relative = entry["path"]
              assert relative not in expected_paths, f"Duplicate manifest path: {relative}"
              expected_paths.add(relative)
              path = root / relative
              assert path.is_file(), f"Missing artifact file: {relative}"
              raw = path.read_bytes()
              assert len(raw) == entry["bytes"], f"Size mismatch: {relative}"
              assert hashlib.sha256(raw).hexdigest() == entry["sha256"], f"Hash mismatch: {relative}"

          observed_paths = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file() and p.name != "artifact_manifest.json"
          }
          assert observed_paths == expected_paths, {
              "missing": sorted(expected_paths - observed_paths),
              "unexpected": sorted(observed_paths - expected_paths),
          }
          run_files = list((root / "runs").glob("*.json"))
          records = [
              json.loads(line)
              for line in (root / "pilot_records.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert len(run_files) == 40
          assert len(records) == 40
          print(json.dumps({
              "status": "pilot_artifact_manifest_pass",
              "archive_sha256": "b12594415894d5cac18442d3bd6c505e843b1a14027272c1afa398a59101aca0",
              "manifest_file_count": len(entries),
              "run_file_count": len(run_files),
              "jsonl_record_count": len(records),
          }, indent=2))
          PY

          git fetch --depth=1 origin "$PILOT_SOURCE_COMMIT"
          git worktree add --detach /tmp/dijitalikiz-pilot-source "$PILOT_SOURCE_COMMIT"
          cp -a "$DEST/pilot-output/." /tmp/dijitalikiz-pilot-source/data/pilot/
          cd /tmp/dijitalikiz-pilot-source
          PYTHONPATH="/tmp/dijitalikiz-pilot-source" python scripts/audit_pilot_integrity.py --require-complete

      - name: Build confirmatory source bundle and launcher without inference
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output=/tmp/dijitalikiz-confirmatory-source-check.tar.gz \
            HEAD \
            data/benchmark \
            data/pilot \
            data/assessments \
            dijitalikiz \
            scripts \
            schemas \
            docs \
            requirements-pilot.txt \
            pyproject.toml \
            README.md

          test -s /tmp/dijitalikiz-confirmatory-source-check.tar.gz
          python scripts/build_confirmatory_launcher.py \
            --bundle /tmp/dijitalikiz-confirmatory-source-check.tar.gz \
            --source-commit "$GITHUB_SHA" \
            --output-dir /tmp/dijitalikiz-confirmatory-launcher-check
          python -m py_compile /tmp/dijitalikiz-confirmatory-launcher-check/kernel.py
          sha256sum /tmp/dijitalikiz-confirmatory-launcher-check/kernel.py

  run-frozen-pilot:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[validate-only]') && !contains(github.event.head_commit.message, '[confirmatory]')) || (github.event_name == 'workflow_dispatch' && inputs.execute_inference == true && inputs.execute_confirmatory == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run repository integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          pytest -q
          python scripts/audit_pilot_integrity.py
          python scripts/validate_all_cases.py
          python scripts/validate_all_candidates.py

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || {
            echo "Missing GitHub Actions secret KAGGLE_API_TOKEN."
            exit 1
          }
          kaggle kernels list --mine --page-size 5
      - name: Allocate immutable Kaggle kernel ref
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_SLUG="dijitalikiz-frozen-pilot-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KERNEL_REF="mahmutvezir/$KERNEL_SLUG"

          if kaggle kernels list --mine --page-size 100 2>/dev/null | awk -v id="$KERNEL_REF" '$1==id {found=1} END{exit found ? 0 : 1}'; then
            echo "Immutable Kaggle kernel already exists for this commit: $KERNEL_REF"
            exit 1
          fi

          echo "KAGGLE_KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"
          echo "KAGGLE_KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"
          echo "Allocated immutable Kaggle kernel: $KERNEL_REF"

      - name: Build exact-source self-contained Kaggle launcher
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .kaggle-kernel
          mkdir -p .kaggle-kernel

          git archive             --format=tar.gz             --output=/tmp/dijitalikiz-source.tar.gz             HEAD             data/pilot             dijitalikiz             scripts             schemas             requirements-pilot.txt             pyproject.toml             README.md

          test -s /tmp/dijitalikiz-source.tar.gz
          tar -tzf /tmp/dijitalikiz-source.tar.gz >/dev/null

          if tar -tzf /tmp/dijitalikiz-source.tar.gz | grep -q '^RSC-Bench-pilot-v1.0-stage4-gated/'; then
            echo "Legacy RSC-Bench tree leaked into frozen source bundle."
            exit 1
          fi

          base64 -w 0 /tmp/dijitalikiz-source.tar.gz > /tmp/dijitalikiz-source.tar.gz.b64
          BUNDLE_SHA256="$(sha256sum /tmp/dijitalikiz-source.tar.gz | awk '{print $1}')"

          export BUNDLE_SHA256
          python - <<'PY'
          import os
          from pathlib import Path

          commit = os.environ["GITHUB_SHA"]
          bundle_b64 = Path("/tmp/dijitalikiz-source.tar.gz.b64").read_text(
              encoding="ascii"
          ).strip()
          bundle_sha256 = os.environ["BUNDLE_SHA256"]

          launcher = r'''from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          KERNEL_ROOT = Path("/kaggle/working")
          # Only finalized research artifacts may live under /kaggle/working;
          # Kaggle exports every file there, so keep source and runtime in /tmp.
          RUNTIME_ROOT = Path("/tmp/dijitalikiz-frozen-pilot-runtime")
          FROZEN_SOURCE_COMMIT = "__COMMIT__"
          EXPECTED_BUNDLE_SHA256 = "__BUNDLE_SHA256__"
          PROJECT_BUNDLE_B64 = "__BUNDLE_B64__"
          BUNDLE = RUNTIME_ROOT / "project.tar.gz"
          WORKDIR = RUNTIME_ROOT / "dijitalikiz"
          PYTHON_ENV = RUNTIME_ROOT / "dijitalikiz-py311"
          TARGET_PYTHON = PYTHON_ENV / "bin" / "python"

          def run(*args: str, cwd: Path | None = None, env: dict[str, str] | None = None) -> None:
              print("$", " ".join(args), flush=True)
              subprocess.run(args, cwd=str(cwd) if cwd else None, env=env, check=True)

          def output(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          def ensure_python311() -> Path:
              current = f"{sys.version_info.major}.{sys.version_info.minor}"
              if current == "3.11":
                  return Path(sys.executable)

              if TARGET_PYTHON.is_file():
                  detected = output(
                      str(TARGET_PYTHON),
                      "-c",
                      "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')",
                  )
                  if detected == "3.11":
                      return TARGET_PYTHON
                  shutil.rmtree(PYTHON_ENV, ignore_errors=True)

              for manager in (
                  "/opt/conda/bin/mamba",
                  "/opt/conda/bin/conda",
                  "mamba",
                  "conda",
              ):
                  executable = shutil.which(manager) if not Path(manager).is_absolute() else manager
                  if executable and Path(executable).is_file():
                      try:
                          run(
                              executable,
                              "create",
                              "-y",
                              "--prefix",
                              str(PYTHON_ENV),
                              "python=3.11",
                              "pip",
                          )
                          return TARGET_PYTHON
                      except (OSError, subprocess.CalledProcessError):
                          shutil.rmtree(PYTHON_ENV, ignore_errors=True)

              run(sys.executable, "-m", "pip", "install", "--quiet", "uv")
              uv = shutil.which("uv")
              if not uv:
                  candidate = Path(sys.executable).resolve().parent / "uv"
                  if candidate.is_file():
                      uv = str(candidate)
              if not uv:
                  user_bin = Path.home() / ".local" / "bin" / "uv"
                  if user_bin.is_file():
                      uv = str(user_bin)
              if not uv:
                  raise RuntimeError("Could not provision Python 3.11.")

              run(uv, "venv", "--python", "3.11", "--seed", str(PYTHON_ENV))
              if not TARGET_PYTHON.is_file():
                  raise RuntimeError(f"Python 3.11 interpreter is missing: {TARGET_PYTHON}")
              return TARGET_PYTHON

          def main() -> None:
              decoded = base64.b64decode(PROJECT_BUNDLE_B64, validate=True)
              actual_sha256 = hashlib.sha256(decoded).hexdigest()
              if actual_sha256 != EXPECTED_BUNDLE_SHA256:
                  raise RuntimeError(
                      "Embedded source bundle checksum mismatch: "
                      f"expected {EXPECTED_BUNDLE_SHA256}, got {actual_sha256}"
                  )

              if RUNTIME_ROOT.exists():
                  shutil.rmtree(RUNTIME_ROOT)
              RUNTIME_ROOT.mkdir(parents=True, exist_ok=True)
              BUNDLE.write_bytes(decoded)

              if WORKDIR.exists():
                  shutil.rmtree(WORKDIR)
              WORKDIR.mkdir(parents=True, exist_ok=True)

              with tarfile.open(BUNDLE, "r:gz") as archive:
                  archive.extractall(WORKDIR)

              pilot_dir = WORKDIR / "data" / "pilot"
              pilot_dir.mkdir(parents=True, exist_ok=True)
              (pilot_dir / "kaggle_source_commit.txt").write_text(
                  FROZEN_SOURCE_COMMIT + "\n",
                  encoding="utf-8",
              )

              target_python = ensure_python311()
              target_version = output(
                  str(target_python),
                  "-c",
                  "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')",
              )
              if target_version != "3.11":
                  raise RuntimeError(
                      f"Frozen pilot requires Python 3.11, got {target_version}"
                  )

              run(
                  str(target_python),
                  "-m",
                  "pip",
                  "install",
                  "--upgrade",
                  "pip",
                  cwd=WORKDIR,
              )
              run(
                  str(target_python),
                  "-m",
                  "pip",
                  "install",
                  "-r",
                  "requirements-pilot.txt",
                  cwd=WORKDIR,
              )
              # Fail before preflight/model loading if pinned dependencies conflict.
              run(str(target_python), "-m", "pip", "check", cwd=WORKDIR)

              env = dict(os.environ)
              env["PYTHONPATH"] = str(WORKDIR)

              run(
                  str(target_python),
                  "scripts/capture_environment.py",
                  cwd=WORKDIR,
                  env=env,
              )

              environment_path = pilot_dir / "environment.json"
              environment = json.loads(
                  environment_path.read_text(encoding="utf-8")
              )
              environment["source_commit"] = FROZEN_SOURCE_COMMIT
              environment["source_commit_verified_from_embedded_bundle"] = True
              environment["source_bundle_sha256"] = EXPECTED_BUNDLE_SHA256
              environment_path.write_text(
                  json.dumps(environment, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

              run(
                  str(target_python),
                  "scripts/pilot_preflight.py",
                  "--require-cuda",
                  cwd=WORKDIR,
                  env=env,
              )
              run(
                  str(target_python),
                  "scripts/model_load_preflight.py",
                  cwd=WORKDIR,
                  env=env,
              )
              run(
                  str(target_python),
                  "scripts/audit_pilot_integrity.py",
                  cwd=WORKDIR,
                  env=env,
              )
              run(
                  str(target_python),
                  "scripts/run_pilot.py",
                  cwd=WORKDIR,
                  env=env,
              )
              run(
                  str(target_python),
                  "scripts/finalize_pilot.py",
                  cwd=WORKDIR,
                  env=env,
              )

              output_dir = KERNEL_ROOT / "pilot-output"
              if output_dir.exists():
                  shutil.rmtree(output_dir)
              output_dir.mkdir(parents=True, exist_ok=True)

              for item in pilot_dir.iterdir():
                  destination = output_dir / item.name
                  if item.is_dir():
                      shutil.copytree(item, destination)
                  else:
                      shutil.copy2(item, destination)

              required = (
                  "pilot_records.jsonl",
                  "pilot_evaluation.json",
                  "case_level_analysis.json",
                  "pilot_qa_report.json",
                  "artifact_manifest.json",
              )
              missing = [
                  name for name in required
                  if not (output_dir / name).is_file()
              ]
              if missing:
                  raise RuntimeError(
                      "Pilot finalized but required artifacts are missing: "
                      + ", ".join(missing)
                  )

              print(
                  f"Kaggle frozen pilot completed for commit {FROZEN_SOURCE_COMMIT}.",
                  flush=True,
              )
              print(f"Pilot artifacts staged at {output_dir}.", flush=True)

          if __name__ == "__main__":
              main()
          '''

          launcher = (
              launcher
              .replace("__COMMIT__", commit)
              .replace("__BUNDLE_SHA256__", bundle_sha256)
              .replace("__BUNDLE_B64__", bundle_b64)
          )

          if "__COMMIT__" in launcher or "__BUNDLE_SHA256__" in launcher or "__BUNDLE_B64__" in launcher:
              raise SystemExit("Launcher placeholders remain after generation.")

          Path(".kaggle-kernel/kernel.py").write_text(launcher, encoding="utf-8")
          print(
              f"Generated self-contained launcher: {len(launcher):,} bytes",
              flush=True,
          )
          PY

          python -m py_compile .kaggle-kernel/kernel.py

          test "$(grep -c 'FROZEN_SOURCE_COMMIT = "' .kaggle-kernel/kernel.py)" -eq 1
          test "$(grep -c 'EXPECTED_BUNDLE_SHA256 = "' .kaggle-kernel/kernel.py)" -eq 1
          test "$(grep -c 'PROJECT_BUNDLE_B64 = "' .kaggle-kernel/kernel.py)" -eq 1
          test "$(grep -c "$GITHUB_SHA" .kaggle-kernel/kernel.py)" -ge 1
          test "$(grep -c '__COMMIT__' .kaggle-kernel/kernel.py)" -eq 0
          test "$(grep -c '__BUNDLE_SHA256__' .kaggle-kernel/kernel.py)" -eq 0
          test "$(grep -c '__BUNDLE_B64__' .kaggle-kernel/kernel.py)" -eq 0

          cat > .kaggle-kernel/kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_KERNEL_REF",
            "title": "$KAGGLE_KERNEL_SLUG",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          python -m json.tool .kaggle-kernel/kernel-metadata.json >/dev/null

          sha256sum .kaggle-kernel/kernel.py .kaggle-kernel/kernel-metadata.json
          echo "Embedded source commit: $GITHUB_SHA"

      - name: Push immutable Kaggle frozen pilot
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-kernel

      - name: Wait for Kaggle frozen pilot
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 220); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_REF" 2>&1 || true)"
            echo "$status"

            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              echo "Kaggle frozen pilot completed."
              exit 0
            fi

            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              echo "Kaggle frozen pilot failed."
              kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
              exit 1
            fi

            sleep 60
          done

          echo "Kaggle frozen pilot exceeded the polling deadline."
          kaggle kernels status "$KAGGLE_KERNEL_REF" || true
          kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
          exit 1

      - name: Download finalized pilot output
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kaggle-output
          mkdir -p kaggle-output

          kaggle kernels output "$KAGGLE_KERNEL_REF" -p kaggle-output --force
          find kaggle-output -maxdepth 5 -type f -print | sort

          for required in \
            pilot_manifest.json \
            PROMPT_TEMPLATE.txt \
            SYSTEM_PROMPT.txt \
            environment.json \
            model_load_preflight.json \
            pilot_records.jsonl \
            pilot_evaluation.json \
            case_level_analysis.json \
            pilot_qa_report.json \
            artifact_manifest.json
          do
            test -n "$(find kaggle-output -name "$required" -type f -print -quit)" || {
              echo "Missing finalized Kaggle artifact: $required"
              exit 1
            }
          done

      - name: Validate finalized pilot artifact
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_PATH="$(find kaggle-output -name artifact_manifest.json -type f -print -quit)"
          test -n "$MANIFEST_PATH" || {
            echo "artifact_manifest.json not found."
            exit 1
          }

          ROOT="$(dirname "$MANIFEST_PATH")"
          python scripts/validate_pilot_artifact_manifest.py             --artifact-root "$ROOT"             --manifest "$MANIFEST_PATH"

      - name: Upload immutable pilot artifact
        uses: actions/upload-artifact@v7
        with:
          name: dijitalikiz-pilot-${{ github.sha }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30

  reject-ambiguous-selection:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_inference == true && inputs.execute_confirmatory == true
    runs-on: ubuntu-24.04
    steps:
      - name: Reject ambiguous execution selection
        shell: bash
        run: |
          echo "Choose either pilot inference or confirmatory inference, not both."
          exit 1

  run-confirmatory:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[confirmatory]')) || (github.event_name == 'workflow_dispatch' && inputs.execute_confirmatory == true && inputs.execute_inference == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run repository, rubric, and frozen-manifest integrity gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          pytest -q
          python scripts/audit_pilot_integrity.py
          python scripts/validate_all_cases.py
          python scripts/validate_all_candidates.py
          python scripts/validate_benchmark_manifest.py
          python scripts/audit_confirmatory_integrity.py

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || {
            echo "Missing GitHub Actions secret KAGGLE_API_TOKEN."
            exit 1
          }
          kaggle kernels list --mine --page-size 5

      - name: Allocate immutable confirmatory Kaggle kernel ref
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_SLUG="dijitalikiz-confirmatory-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KERNEL_REF="mahmutvezir/$KERNEL_SLUG"

          if kaggle kernels list --mine --page-size 100 2>/dev/null | awk -v id="$KERNEL_REF" '$1==id {found=1} END{exit found ? 0 : 1}'; then
            echo "Immutable confirmatory Kaggle kernel already exists: $KERNEL_REF"
            exit 1
          fi

          echo "KAGGLE_KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"
          echo "KAGGLE_KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"
          echo "Allocated immutable confirmatory kernel: $KERNEL_REF"

      - name: Build exact-source confirmatory bundle and self-contained launcher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-confirmatory
          mkdir -p .kaggle-confirmatory

          git archive \
            --format=tar.gz \
            --output=/tmp/dijitalikiz-confirmatory-source.tar.gz \
            HEAD \
            data/benchmark \
            data/pilot \
            data/assessments \
            dijitalikiz \
            scripts \
            schemas \
            docs \
            requirements-pilot.txt \
            pyproject.toml \
            README.md

          test -s /tmp/dijitalikiz-confirmatory-source.tar.gz
          tar -tzf /tmp/dijitalikiz-confirmatory-source.tar.gz >/dev/null
          python scripts/build_confirmatory_launcher.py \
            --bundle /tmp/dijitalikiz-confirmatory-source.tar.gz \
            --source-commit "$GITHUB_SHA" \
            --output-dir .kaggle-confirmatory

          cat > .kaggle-confirmatory/kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_KERNEL_REF",
            "title": "$KAGGLE_KERNEL_SLUG",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          python -m json.tool .kaggle-confirmatory/kernel-metadata.json >/dev/null
          python -m py_compile .kaggle-confirmatory/kernel.py
          sha256sum .kaggle-confirmatory/kernel.py .kaggle-confirmatory/kernel-metadata.json
          echo "Embedded source commit: $GITHUB_SHA"

      - name: Push immutable confirmatory Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-confirmatory

      - name: Wait for confirmatory Kaggle benchmark
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 220); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_REF" 2>&1 || true)"
            echo "$status"

            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              echo "Confirmatory Kaggle benchmark completed."
              exit 0
            fi

            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              echo "Confirmatory Kaggle benchmark failed."
              kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
              exit 1
            fi
            sleep 60
          done

          echo "Confirmatory Kaggle benchmark exceeded the polling deadline."
          kaggle kernels status "$KAGGLE_KERNEL_REF" || true
          kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
          exit 1

      - name: Download and validate complete confirmatory artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-confirmatory-output
          mkdir -p kaggle-confirmatory-output
          kaggle kernels output "$KAGGLE_KERNEL_REF" -p kaggle-confirmatory-output --force
          find kaggle-confirmatory-output -maxdepth 6 -type f -print | sort

          MANIFEST_PATH="$(find kaggle-confirmatory-output -name artifact_manifest.json -type f -print -quit)"
          test -n "$MANIFEST_PATH" || {
            echo "Confirmatory artifact_manifest.json not found."
            exit 1
          }
          ARTIFACT_ROOT="$(dirname "$MANIFEST_PATH")"

          for required in \
            environment.json \
            benchmark_manifest.json \
            confirmatory_evaluation.json \
            case_level_analysis.json \
            primary_analysis.json \
            confirmatory_qa_report.json \
            confirmatory_records.jsonl
          do
            test -f "$ARTIFACT_ROOT/$required" || {
              echo "Missing confirmatory artifact: $required"
              exit 1
            }
          done

          python scripts/validate_confirmatory_artifact_manifest.py \
            --artifact-root "$ARTIFACT_ROOT" \
            --manifest "$ARTIFACT_ROOT/artifact_manifest.json"

      - name: Upload immutable confirmatory artifact
        uses: actions/upload-artifact@v7
        with:
          name: dijitalikiz-confirmatory-${{ github.sha }}
          path: kaggle-confirmatory-output/
          if-no-files-found: error
          retention-days: 30

