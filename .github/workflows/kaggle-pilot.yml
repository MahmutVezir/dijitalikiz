name: Kaggle Frozen Pilot

on:
  workflow_dispatch:
    inputs:
      execute_inference:
        description: "Actually execute the frozen 30-run pilot on Kaggle GPU"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-frozen-pilot:
    if: inputs.execute_inference == true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: dijitalikiz-pilot

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN}" || { echo "Missing GitHub secret: KAGGLE_API_TOKEN"; exit 1; }
          python -m pip install --upgrade pip kaggle
          kaggle --version
          kaggle kernels list --mine --page-size 3

      - name: Prepare exact-source Kaggle bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-kernel
          mkdir -p .kaggle-kernel
          cp kaggle/kernel.py .kaggle-kernel/kernel.py
          git archive --format=tar.gz --output=.kaggle-kernel/project.tar.gz HEAD
          printf '%s\n' "${GITHUB_SHA}" > .kaggle-kernel/source_commit.txt
          cat > .kaggle-kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "dijitalikiz-frozen-pilot",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "keywords": ["llm", "bug-diagnosis", "ccdg", "tubitak"]
          }
          EOF
          tar -tzf .kaggle-kernel/project.tar.gz | head -20
          sha256sum .kaggle-kernel/project.tar.gz
          cat .kaggle-kernel/source_commit.txt

      - name: Resolve Kaggle username
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade kagglehub
          python - <<'PY'
          import kagglehub
          username = kagglehub.whoami(verbose=False)["username"]
          print(username)
          with open("/tmp/kaggle_username", "w", encoding="utf-8") as handle:
              handle.write(username)
          PY
          {
            echo "KAGGLE_USERNAME=$(cat /tmp/kaggle_username)"
            echo "KERNEL_SLUG=${KERNEL_SLUG}"
          } >> "${GITHUB_ENV}"

      - name: Push frozen pilot kernel to Kaggle
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-kernel

      - name: Wait for Kaggle completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 170); do
            status="$(kaggle kernels status "${KAGGLE_USERNAME}/${KERNEL_SLUG}" 2>&1 || true)"
            echo "${status}"
            if echo "${status}" | grep -Eiq 'complete|error|cancel'; then
              if echo "${status}" | grep -Eiq 'error|cancel'; then
                exit 1
              fi
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for Kaggle kernel."
          exit 1

      - name: Download finalized pilot artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-output
          mkdir -p kaggle-output
          kaggle kernels output "${KAGGLE_USERNAME}/${KERNEL_SLUG}" -p kaggle-output --force
          find kaggle-output -maxdepth 5 -type f -print | sort
          test -n "$(find kaggle-output -name pilot_records.jsonl -print -quit)"
          test -n "$(find kaggle-output -name pilot_evaluation.json -print -quit)"
          test -n "$(find kaggle-output -name case_level_analysis.json -print -quit)"
          test -n "$(find kaggle-output -name pilot_qa_report.json -print -quit)"
          test -n "$(find kaggle-output -name pilot_artifact_manifest.json -print -quit)"

      - name: Upload immutable pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dijitalikiz-pilot-${{ github.sha }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30
