name: Kaggle Frozen Pilot

on:
  workflow_dispatch:
    inputs:
      execute_inference:
        description: "Run the frozen 40-inference pilot on Kaggle GPU"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - ".github/kaggle-pilot-trigger"

permissions:
  contents: read

concurrency:
  group: dijitalikiz-frozen-pilot
  cancel-in-progress: false

jobs:
  run-frozen-pilot:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execute_inference == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          pytest -q
          python scripts/audit_pilot_integrity.py
          python scripts/validate_all_cases.py
          python scripts/validate_all_candidates.py

      - name: Install Kaggle CLI and identity helper
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade kaggle kagglehub

      - name: Verify Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || {
            echo "Missing GitHub Actions secret KAGGLE_API_TOKEN."
            exit 1
          }
          KAGGLE_USER="$(python -c 'import kagglehub; print(kagglehub.whoami(verbose=False)["username"])')"
          test -n "$KAGGLE_USER" || {
            echo "Kaggle account lookup returned an empty username."
            exit 1
          }
          echo "KAGGLE_USERNAME=$KAGGLE_USER" >> "$GITHUB_ENV"
          echo "Authenticated Kaggle account: $KAGGLE_USER"
          kaggle --version

      - name: Resolve existing Kaggle pilot kernel
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_REF="$KAGGLE_USERNAME/dijitalikiz-frozen-pilot"
          if ! kaggle kernels list --mine --page-size 100 2>/dev/null | awk -v id="$KERNEL_REF" '$1==id {found=1} END{exit found ? 0 : 1}'; then
            echo "Expected Kaggle kernel $KERNEL_REF was not found."
            kaggle kernels list --mine --page-size 100 || true
            exit 1
          fi
          echo "Resolved Kaggle kernel: $KERNEL_REF"
          echo "KAGGLE_KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"

      - name: Build exact-source frozen dataset payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-source
          mkdir -p .kaggle-source

          git archive --format=tar.gz --output=/tmp/dijitalikiz-source.tar.gz HEAD \
            data/pilot \
            dijitalikiz \
            scripts \
            schemas \
            requirements-pilot.txt \
            pyproject.toml \
            README.md

          test -s /tmp/dijitalikiz-source.tar.gz
          tar -tzf /tmp/dijitalikiz-source.tar.gz >/dev/null
          if tar -tzf /tmp/dijitalikiz-source.tar.gz | grep -q '^RSC-Bench-pilot-v1.0-stage4-gated/'; then
            echo "Legacy RSC-Bench tree leaked into the frozen source bundle."
            exit 1
          fi

          base64 -w 0 /tmp/dijitalikiz-source.tar.gz > .kaggle-source/project.tar.gz.b64
          printf '\n' >> .kaggle-source/project.tar.gz.b64
          sha256sum /tmp/dijitalikiz-source.tar.gz | awk '{print $1}' > .kaggle-source/source_bundle_sha256.txt
          printf '%s\n' "$GITHUB_SHA" > .kaggle-source/source_commit.txt

          cat > .kaggle-source/dataset-metadata.json <<EOF
          {
            "title": "Dijitalikiz Frozen Source v2",
            "subtitle": "Exact source bundle for the frozen TÜBİTAK pilot",
            "description": "Versioned private source bundle for reproducible Kaggle pilot execution. Commit: $GITHUB_SHA",
            "id": "mahmutvezir/dijitalikiz-frozen-source-v2",
            "licenses": [{"name": "MIT"}]
          }
          EOF

          python -m json.tool .kaggle-source/dataset-metadata.json >/dev/null
          test -s .kaggle-source/project.tar.gz.b64
          test -s .kaggle-source/source_bundle_sha256.txt
          test -s .kaggle-source/source_commit.txt

      - name: Publish exact-source Kaggle Dataset
        shell: bash
        run: |
          set -euo pipefail
          DATASET_ID="mahmutvezir/dijitalikiz-frozen-source-v2"
          exists=0
          for attempt in $(seq 1 12); do
            if kaggle datasets list --mine --page-size 100 2>/dev/null | awk -v id="$DATASET_ID" '$1==id {found=1} END{exit found ? 0 : 1}'; then
              exists=1
              break
            fi
            echo "Frozen source Dataset not visible yet (attempt $attempt/12)."
            sleep 10
          done

          if [ "$exists" -eq 1 ]; then
            kaggle datasets version -p .kaggle-source -m "Frozen source $GITHUB_SHA" -q -t -r skip
          else
            kaggle datasets create -p .kaggle-source -q -t -r skip
          fi

          visible=0
          for attempt in $(seq 1 60); do
            if kaggle datasets list --mine --page-size 100 2>/dev/null | awk -v id="$DATASET_ID" '$1==id {found=1} END{exit found ? 0 : 1}'; then
              visible=1
              break
            fi
            echo "Waiting for Kaggle Dataset publication (attempt $attempt/60)."
            sleep 10
          done

          test "$visible" -eq 1 || {
            echo "Kaggle source Dataset did not become visible after publication."
            kaggle datasets list --mine --page-size 100 || true
            exit 1
          }
          echo "Published/verified Kaggle source Dataset: $DATASET_ID"

      - name: Prepare Kaggle kernel launcher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-kernel
          mkdir -p .kaggle-kernel
          cp kaggle/kernel.py .kaggle-kernel/kernel.py

          python -m py_compile .kaggle-kernel/kernel.py
          test "$(grep -c 'SOURCE_DATASET = "mahmutvezir/dijitalikiz-frozen-source-v2"' .kaggle-kernel/kernel.py)" -eq 1
          test "$(grep -c 'source_bundle_sha256.txt' .kaggle-kernel/kernel.py)" -eq 1
          if grep -q 'bundle_source' .kaggle-kernel/kernel.py; then
            echo "Undefined legacy bundle_source reference remains in Kaggle launcher."
            exit 1
          fi

          cat > .kaggle-kernel/kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_KERNEL_REF",
            "title": "dijitalikiz-frozen-pilot",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": ["mahmutvezir/dijitalikiz-frozen-source-v2"],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          python -m json.tool .kaggle-kernel/kernel-metadata.json >/dev/null
          sha256sum /tmp/dijitalikiz-source.tar.gz .kaggle-source/project.tar.gz.b64 \
            .kaggle-source/source_bundle_sha256.txt .kaggle-source/source_commit.txt \
            .kaggle-kernel/kernel.py

      - name: Push frozen pilot to Kaggle
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-kernel

      - name: Wait for Kaggle frozen pilot
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 220); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_REF" 2>&1 || true)"
            echo "$status"

            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              echo "Kaggle frozen pilot completed."
              exit 0
            fi

            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              echo "Kaggle frozen pilot failed."
              kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
              exit 1
            fi

            sleep 60
          done

          echo "Kaggle frozen pilot exceeded the polling deadline."
          kaggle kernels status "$KAGGLE_KERNEL_REF" || true
          kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
          exit 1

      - name: Download finalized pilot output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-output
          mkdir -p kaggle-output

          kaggle kernels output "$KAGGLE_KERNEL_REF" -p kaggle-output --force
          find kaggle-output -maxdepth 5 -type f -print | sort

          for required in \
            pilot_records.jsonl \
            pilot_evaluation.json \
            case_level_analysis.json \
            pilot_qa_report.json \
            artifact_manifest.json
          do
            test -n "$(find kaggle-output -name "$required" -type f -print -quit)" || {
              echo "Missing finalized Kaggle artifact: $required"
              exit 1
            }
          done

      - name: Validate finalized pilot artifact
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_PATH="$(find kaggle-output -name artifact_manifest.json -type f -print -quit)"
          test -n "$MANIFEST_PATH" || exit 1
          ROOT="$(dirname "$MANIFEST_PATH")"
          python scripts/validate_pilot_artifact_manifest.py \
            --artifact-root "$ROOT" \
            --manifest "$MANIFEST_PATH"

      - name: Upload immutable pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dijitalikiz-pilot-${{ github.sha }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30
