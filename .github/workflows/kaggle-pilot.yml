name: Kaggle Frozen Pilot

on:
  workflow_dispatch:
    inputs:
      execute_inference:
        description: "Run the frozen 30-inference pilot on Kaggle GPU"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - ".github/kaggle-pilot-trigger"

permissions:
  contents: read

concurrency:
  group: dijitalikiz-frozen-pilot
  cancel-in-progress: false

jobs:
  run-frozen-pilot:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execute_inference == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Kaggle CLI and identity helper
        run: python -m pip install --upgrade pip kaggle kagglehub

      - name: Verify token and resolve Kaggle account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing GitHub secret: KAGGLE_API_TOKEN"; exit 1; }
          KAGGLE_USER="$(python -c 'import kagglehub; print(kagglehub.whoami(verbose=False)["username"])')"
          test -n "$KAGGLE_USER" || { echo "Could not resolve Kaggle username from token"; exit 1; }
          echo "KAGGLE_USERNAME=$KAGGLE_USER" >> "$GITHUB_ENV"
          kaggle --version
          kaggle kernels list --mine --page-size 20

      - name: Resolve existing Kaggle pilot kernel slug
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_REF="$(kaggle kernels list --mine --page-size 50 2>/dev/null | awk '$1=="mahmutvezir/dijitalikiz-frozen-pilot" {print $1; exit}')"
          if [ -z "$KERNEL_REF" ]; then
            echo "Expected Kaggle kernel mahmutvezir/dijitalikiz-frozen-pilot was not found."
            kaggle kernels list --mine --page-size 50 || true
            exit 1
          fi
          echo "Resolved existing Kaggle kernel: $KERNEL_REF"
          echo "KAGGLE_KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"
          kaggle kernels status "$KERNEL_REF" || true

      - name: Prepare self-contained Kaggle launcher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-kernel
          mkdir -p .kaggle-kernel
          git archive --format=tar.gz --output=/tmp/dijitalikiz-source.tar.gz HEAD
          python - <<'PY'
          from pathlib import Path
          import base64

          template = Path("kaggle/kernel.py").read_text(encoding="utf-8")
          archive_b64 = base64.b64encode(
              Path("/tmp/dijitalikiz-source.tar.gz").read_bytes()
          ).decode("ascii")
          launcher = template.replace(
              "SOURCE_COMMIT_PLACEHOLDER", "${{ github.sha }}"
          ).replace(
              "PROJECT_B64_PLACEHOLDER", archive_b64
          )
          Path(".kaggle-kernel/kernel.py").write_text(launcher, encoding="utf-8")
          PY
          python -m py_compile .kaggle-kernel/kernel.py
          grep -q "$GITHUB_SHA" .kaggle-kernel/kernel.py
          test "$(grep -o 'PROJECT_B64_PLACEHOLDER' kaggle/kernel.py | wc -l)" -eq 1
          cat > .kaggle-kernel/kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_KERNEL_REF",
            "title": "dijitalikiz-frozen-pilot",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF
          python -m json.tool .kaggle-kernel/kernel-metadata.json >/dev/null
          sha256sum /tmp/dijitalikiz-source.tar.gz .kaggle-kernel/kernel.py

      - name: Push frozen pilot to Kaggle
        run: kaggle kernels push -p .kaggle-kernel

      - name: Wait for Kaggle completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 170); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_REF" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              exit 0
            fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
              exit 1
            fi
            sleep 60
          done
          kaggle kernels logs "$KAGGLE_KERNEL_REF" || true
          exit 1

      - name: Download finalized pilot output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-output
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL_REF" -p kaggle-output --force
          find kaggle-output -maxdepth 4 -type f -print | sort
          test -n "$(find kaggle-output -name pilot_records.jsonl -print -quit)"
          test -n "$(find kaggle-output -name pilot_evaluation.json -print -quit)"
          test -n "$(find kaggle-output -name case_level_analysis.json -print -quit)"
          test -n "$(find kaggle-output -name pilot_qa_report.json -print -quit)"
          test -n "$(find kaggle-output -name artifact_manifest.json -print -quit)"

      - name: Verify downloaded artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_pilot_artifact_manifest.py             --artifact-root kaggle-output             --manifest "$(find kaggle-output -name artifact_manifest.json -print -quit)"

      - name: Upload immutable pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dijitalikiz-pilot-${{ github.sha }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30
