name: Kaggle Frozen Pilot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/kaggle-pilot-trigger"

permissions:
  contents: write

jobs:
  run-frozen-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v4

      - name: Install Kaggle CLI and identity helper
        run: python -m pip install --upgrade pip kaggle kagglehub

      - name: Verify token and resolve Kaggle account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing GitHub secret: KAGGLE_API_TOKEN"; exit 1; }
          KAGGLE_USER="$(python -c 'import kagglehub; print(kagglehub.whoami(verbose=False)["username"])')"
          test -n "$KAGGLE_USER" || { echo "Could not resolve Kaggle username from token"; exit 1; }
          echo "KAGGLE_USERNAME=$KAGGLE_USER" >> "$GITHUB_ENV"
          kaggle --version
          kaggle kernels list --mine --page-size 3

      - name: Prepare exact-source Kaggle bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kaggle-kernel
          cp kaggle/kernel.py .kaggle-kernel/kernel.py
          git archive --format=tar.gz --output=.kaggle-kernel/project.tar.gz HEAD
          printf '%s
' "$GITHUB_SHA" > .kaggle-kernel/source_commit.txt
          cat > .kaggle-kernel/kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_USERNAME/dijitalikiz-pilot",
            "title": "dijitalikiz-pilot",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "keywords": ["llm", "bug-diagnosis", "ccdg", "tubitak"]
          }
          EOF
          python -m json.tool .kaggle-kernel/kernel-metadata.json >/dev/null
          tar -tzf .kaggle-kernel/project.tar.gz | head -20

      - name: Push frozen pilot to Kaggle GPU
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-kernel --timeout 10800 --accelerator NvidiaTeslaT4

      - name: Wait for Kaggle completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            status="$(kaggle kernels status "$KAGGLE_USERNAME/dijitalikiz-pilot" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then exit 0; fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              kaggle kernels logs "$KAGGLE_USERNAME/dijitalikiz-pilot" || true
              exit 1
            fi
            sleep 60
          done
          kaggle kernels logs "$KAGGLE_USERNAME/dijitalikiz-pilot" || true
          exit 1

      - name: Download and validate pilot outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-output
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_USERNAME/dijitalikiz-pilot" -p kaggle-output --force
          find kaggle-output -type f -print | sort
          test -n "$(find kaggle-output -name pilot_records.jsonl -print -quit)"
          test -n "$(find kaggle-output -name pilot_evaluation.json -print -quit)"
          test -n "$(find kaggle-output -name case_level_analysis.json -print -quit)"
          test -n "$(find kaggle-output -name pilot_artifact_manifest.json -print -quit)"

      - name: Persist pilot artifacts to repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/pilot/runs-from-kaggle
          find kaggle-output -type f -maxdepth 4 -print0 | while IFS= read -r -d '' file; do
            cp "$file" "data/pilot/runs-from-kaggle/$(basename "$file")"
          done
          cp kaggle-output/pilot_records.jsonl data/pilot/pilot_records.jsonl
          cp kaggle-output/pilot_evaluation.json data/pilot/pilot_evaluation.json
          cp kaggle-output/case_level_analysis.json data/pilot/case_level_analysis.json
          cp kaggle-output/pilot_artifact_manifest.json data/pilot/pilot_artifact_manifest.json
          if test -f kaggle-output/environment.json; then cp kaggle-output/environment.json data/pilot/environment.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pilot/pilot_records.jsonl data/pilot/pilot_evaluation.json data/pilot/case_level_analysis.json data/pilot/pilot_artifact_manifest.json data/pilot/environment.json data/pilot/runs-from-kaggle
          git commit -m "Record frozen Kaggle pilot results [pilot-artifacts]" || echo "No artifact changes to commit."
          git push origin HEAD:main
