name: SWE-rebench V2 GitHub Timestamp Reconciliation (No Inference)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/swe-rebench-v2-timestamp-api-audit.yml"
      - "scripts/audit_swe_rebench_filtered_verified.py"
      - "scripts/audit_swe_rebench_timestamps_against_github.py"
      - "tests/test_audit_swe_rebench_filtered_verified.py"
      - "tests/test_swe_rebench_timestamp_api_audit.py"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_TIMESTAMP_SEMANTICS_AUDIT_2026-11-15.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swe-rebench-v2-timestamp-api-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Compare historical candidate dates with GitHub issue API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATASET_URL: "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet"
      EXPECTED_SHA256: "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9"
      EXPECTED_BYTES: "226272977"
      EXPECTED_ROWS: "6272"
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check "pyarrow==19.0.1"

      - name: Run synthetic timestamp parser and reconciliation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_audit_swe_rebench_filtered_verified.py" -v
          python -m unittest discover -s tests -p "test_swe_rebench_timestamp_api_audit.py" -v

      - name: Download and verify exact Parquet snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swe-rebench-v2-timestamp"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$DATASET_URL" \
            --output "$RUNNER_TEMP/swe-rebench-v2-timestamp/train-00000-of-00001.parquet"
          actual_bytes="$(stat -c '%s' "$RUNNER_TEMP/swe-rebench-v2-timestamp/train-00000-of-00001.parquet")"
          actual_sha="$(sha256sum "$RUNNER_TEMP/swe-rebench-v2-timestamp/train-00000-of-00001.parquet" | awk '{print $1}')"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          test "$actual_sha" = "$EXPECTED_SHA256"
          echo "verified_bytes=$actual_bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "verified_sha256=$actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile all historical metadata candidates with GitHub issue API
        id: reconcile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/audit_swe_rebench_timestamps_against_github.py \
            --input "$RUNNER_TEMP/swe-rebench-v2-timestamp/train-00000-of-00001.parquet" \
            --output-csv "$RUNNER_TEMP/swe-rebench-v2-timestamp/api-verified-candidates.csv" \
            --output-json "$RUNNER_TEMP/swe-rebench-v2-timestamp/reconciliation-summary.json" \
            --max-workers 6 \
            | tee "$RUNNER_TEMP/swe-rebench-v2-timestamp/reconciliation-summary.stdout.json"
          cat "$RUNNER_TEMP/swe-rebench-v2-timestamp/reconciliation-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep cohort generation blocked unless every historical candidate matches exactly
        shell: bash
        run: |
          python - "$RUNNER_TEMP/swe-rebench-v2-timestamp/reconciliation-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          print("historical_candidate_rows=" + str(summary["historical_candidate_rows"]))
          print("exact_matches=" + str(summary["exact_api_timestamp_matches"]))
          print("one_second_differences=" + str(summary["one_second_differences_requiring_explicit_review"]))
          print("timestamp_mismatches=" + str(summary["timestamp_mismatches"]))
          print("cohort_rebuild_gate=" + summary["cohort_rebuild_gate"])
          if summary["cohort_rebuild_gate"] != "PASS_FOR_HISTORICAL_CANDIDATE_POOL_ONLY":
              raise SystemExit("Timestamp reconciliation remains blocked; inspect the retained row-level audit artifact.")
          PY

      - name: Upload full timestamp reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-rebench-v2-timestamp-api-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swe-rebench-v2-timestamp/api-verified-candidates.csv
            ${{ runner.temp }}/swe-rebench-v2-timestamp/reconciliation-summary.json
            ${{ runner.temp }}/swe-rebench-v2-timestamp/reconciliation-summary.stdout.json
          if-no-files-found: warn
          retention-days: 90
