name: Held-out Candidate Red-Green Screening

on:
  push:
    paths:
      - ".github/heldout-red-green-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Screen ${{ matrix.case_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: lang-1800-era-calendar
            pr_number: 1800
            repo: apache/commons-lang
            pre_fix: 6e8ced140e457a1622c8dd031cfa826d962a95ad
            fix: c7f1a6d27707e8cd8cbed94f83e0c58d2c480614
            tests: FastDateFormatTest#testEraRoundTripNonGregorianCalendar,FastDatePrinterTest#testEraMixedCalendarTypes
            test_files: src/test/java/org/apache/commons/lang3/time/FastDateFormatTest.java src/test/java/org/apache/commons/lang3/time/FastDatePrinterTest.java
          - case_id: lang-1807-wildcard-bounds
            pr_number: 1807
            repo: apache/commons-lang
            pre_fix: 29624cdb50ecd794207d561345b2fc9ca3a9d326
            fix: 43154e016ae213a0da5b727cd1aa18e6e0c56adb
            tests: TypeUtilsTest#testWildcardTypeImplicitUpperBound,TypeUtilsTest#testUnboundedWildcardType
            test_files: src/test/java/org/apache/commons/lang3/reflect/TypeUtilsTest.java
          - case_id: collections-728-nextkey
            pr_number: 728
            repo: apache/commons-collections
            pre_fix: 974e910d63a95cf1f80933d474bcf73eb2c8bba4
            fix: 04b30be69f4355f218d587703bc20b1a591c3e3c
            tests: DualTreeBidiMapTest#testNextKeyAbsentKey,FixedSizeSortedMapTest#testNextKey,UnmodifiableSortedMapTest#testNextKey
            test_files: src/test/java/org/apache/commons/collections4/bidimap/DualTreeBidiMapTest.java src/test/java/org/apache/commons/collections4/map/FixedSizeSortedMapTest.java src/test/java/org/apache/commons/collections4/map/UnmodifiableSortedMapTest.java

    env:
      PR_NUMBER: ${{ matrix.pr_number }}
      UPSTREAM_REPO: ${{ matrix.repo }}
      PRE_FIX_SHA: ${{ matrix.pre_fix }}
      FIX_SHA: ${{ matrix.fix }}
      TEST_TARGETS: ${{ matrix.tests }}
      TEST_FILES: ${{ matrix.test_files }}
      CASE_ID: ${{ matrix.case_id }}

    steps:
      - name: Checkout research repository for evidence collection
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone upstream and pin revisions
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          git clone --quiet --filter=blob:none "https://github.com/$UPSTREAM_REPO.git" "$SRC"
          git -C "$SRC" fetch --quiet --no-tags origin "$PRE_FIX_SHA"
          git -C "$SRC" fetch --quiet --no-tags origin "$FIX_SHA"
          git -C "$SRC" fetch --quiet --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"
          git -C "$SRC" checkout --detach "$PRE_FIX_SHA"
          mkdir -p "$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID"
          {
            echo "case_id=$CASE_ID"
            echo "repository=$UPSTREAM_REPO"
            echo "pre_fix_sha=$PRE_FIX_SHA"
            echo "fix_sha=$FIX_SHA"
            echo "test_targets=$TEST_TARGETS"
            echo "model_inference=not_run"
          } > "$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID/metadata.txt"
          git -C "$SRC" rev-parse HEAD > "$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID/checked_out_pre_fix_sha.txt"

      - name: Inject tests from the fixed revision into the pre-fix checkout
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          for test_file in $TEST_FILES; do
            mkdir -p "$SRC/$(dirname "$test_file")"
            git -C "$SRC" show "refs/remotes/origin/pr/$PR_NUMBER:$test_file" > "$SRC/$test_file"
          done

      - name: Require regression tests to fail on pre-fix revision
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          LOG="$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID/pre-fix-maven.log"
          set +e
          (cd "$SRC" && mvn -B -ntp clean -Dtest="$TEST_TARGETS" test) > "$LOG" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "BLOCKED: regression unexpectedly passed on the pre-fix revision."
            exit 1
          fi
          python - "$SRC" "$TEST_TARGETS" "$CASE_ID" "$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID" <<'PY'
          import json, sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root_dir = Path(sys.argv[1])
          targets = [x.strip() for x in sys.argv[2].split(",") if x.strip()]
          cases = []
          for report in root_dir.rglob("TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for node in root.iter("testcase"):
                  cases.append((node.get("classname", ""), node.get("name", ""), node))
          results = []
          for target in targets:
              class_name, method = target.split("#", 1)
              matches = [(cn, name, node) for cn, name, node in cases
                         if cn.endswith("." + class_name) and (name == method or name.startswith(method + "("))]
              if not matches:
                  raise SystemExit(f"BLOCKED: test did not execute on pre-fix revision: {target}")
              failed = [node for _, _, node in matches if node.find("failure") is not None or node.find("error") is not None]
              if not failed:
                  raise SystemExit(f"BLOCKED: test did not demonstrate a pre-fix failure: {target}")
              results.append({"test": target, "pre_fix": "failed_as_expected", "failed_invocations": len(failed)})
          payload = {"status": "red_confirmed", "case_id": sys.argv[3], "tests": results}
          (Path(sys.argv[4]) / "red-evidence.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Require the same tests to pass on the fixed revision
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          LOG="$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID/fixed-maven.log"
          git -C "$SRC" reset --hard "$FIX_SHA"
          (cd "$SRC" && mvn -B -ntp clean -Dtest="$TEST_TARGETS" test) > "$LOG" 2>&1 || {
            cat "$LOG"
            echo "FAILED: targeted regression tests did not pass on fixed revision."
            exit 1
          }
          python - "$SRC" "$TEST_TARGETS" "$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID" <<'PY'
          import json, sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root_dir = Path(sys.argv[1])
          out_dir = Path(sys.argv[3])
          targets = [x.strip() for x in sys.argv[2].split(",") if x.strip()]
          cases = []
          for report in root_dir.rglob("TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for node in root.iter("testcase"):
                  cases.append((node.get("classname", ""), node.get("name", ""), node))
          results = []
          for target in targets:
              class_name, method = target.split("#", 1)
              matches = [(cn, name, node) for cn, name, node in cases
                         if cn.endswith("." + class_name) and (name == method or name.startswith(method + "("))]
              if not matches:
                  raise SystemExit(f"BLOCKED: test did not execute on fixed revision: {target}")
              bad = [node for _, _, node in matches
                     if node.find("failure") is not None or node.find("error") is not None or node.find("skipped") is not None]
              if bad:
                  raise SystemExit(f"FAILED: test did not pass cleanly on fixed revision: {target}")
              results.append({"test": target, "fixed": "passed", "passed_invocations": len(matches)})
          payload = {"status": "red_green_pass", "case_id": out_dir.name, "tests": results}
          (out_dir / "result.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY
          {
            echo "status=red_green_pass"
            echo "pre_fix_sha=$PRE_FIX_SHA"
            echo "fixed_sha=$FIX_SHA"
            echo "test_targets=$TEST_TARGETS"
          } > "$GITHUB_WORKSPACE/heldout-red-green/$CASE_ID/result.txt"

      - name: Upload source-reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-red-green-${{ matrix.case_id }}
          path: heldout-red-green/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 90
