name: Kaggle Frozen Confirmatory

on:
  workflow_dispatch:
    inputs:
      execute_inference:
        description: "Run the frozen confirmatory 160-inference benchmark on Kaggle GPU"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: dijitalikiz-frozen-confirmatory
  cancel-in-progress: false

jobs:
  run-confirmatory:
    if: inputs.execute_inference == true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle kagglehub

      - name: Verify Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing KAGGLE_API_TOKEN"; exit 1; }
          KAGGLE_USER="$(python -c 'import kagglehub; print(kagglehub.whoami(verbose=False)["username"])')"
          test -n "$KAGGLE_USER"
          echo "KAGGLE_USERNAME=$KAGGLE_USER" >> "$GITHUB_ENV"
          echo "Kaggle account: $KAGGLE_USER"
          kaggle --version

      - name: Locate completed pilot from this exact commit
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run list --workflow kaggle-pilot.yml --branch main --limit 20 --json databaseId,headSha,conclusion,status,createdAt)"
          PILOT_ID="$(python - "$RUN_JSON" "$GITHUB_SHA" <<'PY'
          import json,sys
          runs=json.loads(sys.argv[1]); sha=sys.argv[2]
          matches=[r for r in runs if r.get("headSha")==sha and r.get("conclusion")=="success"]
          print(matches[0]["databaseId"] if matches else "")
          PY
          )
          test -n "$PILOT_ID" || { echo "No successful Kaggle Frozen Pilot exists for exact commit $GITHUB_SHA"; exit 1; }
          echo "PILOT_RUN_ID=$PILOT_ID" >> "$GITHUB_ENV"
          echo "Verified pilot run: $PILOT_ID"

      - name: Download and verify pilot artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pilot-artifact
          mkdir -p pilot-artifact
          gh run download "$PILOT_RUN_ID" --dir pilot-artifact
          find pilot-artifact -maxdepth 4 -type f -print | sort
          test -n "$(find pilot-artifact -name pilot_records.jsonl -print -quit)"
          test -n "$(find pilot-artifact -name pilot_evaluation.json -print -quit)"
          test -n "$(find pilot-artifact -name pilot_qa_report.json -print -quit)"
          test -n "$(find pilot-artifact -name artifact_manifest.json -print -quit)"

      - name: Freeze preselected benchmark after pilot integrity gate
        run: |
          python scripts/freeze_benchmark.py --pilot-artifact-root pilot-artifact
          python scripts/validate_benchmark_manifest.py

      - name: Prepare exact-source frozen confirmatory bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .confirmatory-bundle .kaggle-confirmatory
          mkdir -p .confirmatory-bundle
          git archive HEAD | tar -x -C .confirmatory-bundle
          cp data/benchmark/benchmark_manifest.json .confirmatory-bundle/data/benchmark/benchmark_manifest.json
          mkdir -p .kaggle-confirmatory
          tar -C .confirmatory-bundle -czf .kaggle-confirmatory/project.tar.gz .
          cp kaggle/confirmatory_kernel.py .kaggle-confirmatory/kernel.py
          printf "%s\n" "$GITHUB_SHA" > .kaggle-confirmatory/source_commit.txt
          cat > .kaggle-confirmatory/kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_USERNAME/dijitalikiz-confirmatory",
            "title": "dijitalikiz-frozen-confirmatory",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "keywords": ["llm", "bug-diagnosis", "ccdg", "tubitak", "confirmatory"]
          }
          EOF
          python -m json.tool .kaggle-confirmatory/kernel-metadata.json >/dev/null
          tar -tzf .kaggle-confirmatory/project.tar.gz >/dev/null

      - name: Push confirmatory benchmark to Kaggle
        run: kaggle kernels push -p .kaggle-confirmatory

      - name: Wait for Kaggle completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 340); do
            status="$(kaggle kernels status "$KAGGLE_USERNAME/dijitalikiz-confirmatory" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then exit 0; fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED)"; then
              kaggle kernels logs "$KAGGLE_USERNAME/dijitalikiz-confirmatory" || true
              exit 1
            fi
            sleep 60
          done
          kaggle kernels logs "$KAGGLE_USERNAME/dijitalikiz-confirmatory" || true
          exit 1

      - name: Download finalized confirmatory output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-output
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_USERNAME/dijitalikiz-confirmatory" -p kaggle-output --force
          find kaggle-output -maxdepth 3 -type f -print | sort
          for f in environment.json confirmatory_evaluation.json case_level_analysis.json primary_analysis.json confirmatory_qa_report.json confirmatory_records.jsonl artifact_manifest.json benchmark_manifest.json; do
            test -n "$(find kaggle-output -name "$f" -print -quit)"
          done

      - name: Verify confirmatory artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(dirname "$(find kaggle-output -name artifact_manifest.json -print -quit)")"
          python scripts/validate_confirmatory_artifact_manifest.py --artifact-root "$ROOT" --manifest "$ROOT/artifact_manifest.json"

      - name: Upload immutable confirmatory artifact
        uses: actions/upload-artifact@v4
        with:
          name: dijitalikiz-confirmatory-${{ github.sha }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 90
