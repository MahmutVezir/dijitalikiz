name: Runner Smoke Test (No Secrets)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/runner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Verify hosted runner assignment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner started
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_SMOKE_STARTED"
          echo "runner_os=$(uname -s)"
          echo "runner_arch=$(uname -m)"
          echo "RUNNER_SMOKE_FINISHED"
