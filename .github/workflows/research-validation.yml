name: Research Validation (No Inference)

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/research-validation.yml"
      - ".github/workflows/heldout-lead-red-green.yml"
      - "scripts/**"
      - "tests/**"
      - "data/historical/confirmatory_artifact_2026-10-09.zip"
      - "schemas/**"
      - "dijitalikiz/**"
      - "data/calibration/**"
      - "data/followup_v2/**"
      - "data/benchmark/**"
      - "data/sample_cases/**"
      - "data/historical/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements*.txt"
  pull_request:
    paths:
      - ".github/workflows/research-validation.yml"
      - ".github/workflows/heldout-lead-red-green.yml"
      - "scripts/**"
      - "tests/**"
      - "schemas/**"
      - "dijitalikiz/**"
      - "data/calibration/**"
      - "data/followup_v2/**"
      - "data/benchmark/**"
      - "data/sample_cases/**"
      - "data/historical/**"
      - "docs/**"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository:
    name: Repository/configuration validation (no inference)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install test dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[test]"
          python -m pip check

      - name: Run unit and workflow safety tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q scripts dijitalikiz

      - name: Validate historical and candidate configuration without inference
        id: data_checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_pilot_integrity.py
          python scripts/validate_all_cases.py
          python scripts/validate_all_candidates.py
          python scripts/validate_benchmark_manifest.py
          python scripts/audit_confirmatory_integrity.py

      - name: Confirm no model execution command is invoked by this workflow
        id: no_inference
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'scripts/(run_pilot|run_confirmatory|run_frozen_pilot|run_followup_v2)\.py' .github/workflows/research-validation.yml
          ! grep -Eq 'kaggle kernels (push|start)' .github/workflows/research-validation.yml
          ! grep -q 'KAGGLE_''API_TOKEN' .github/workflows/research-validation.yml

      - name: Report repository validation scope
        if: always()
        shell: bash
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DATA_CHECKS_OUTCOME: ${{ steps.data_checks.outcome }}
          NO_INFERENCE_OUTCOME: ${{ steps.no_inference.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DEPENDENCIES_OUTCOME" == "success" && "$TESTS_OUTCOME" == "success" && "$DATA_CHECKS_OUTCOME" == "success" && "$NO_INFERENCE_OUTCOME" == "success" ]]; then
            echo "repository_validation_status=PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "repository_validation_status=FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "This job checks repository code/configuration only; it does not prove historical archive integrity." >> "$GITHUB_STEP_SUMMARY"
          echo "Historical archive integrity is reported by the separate validate-historical-archive job." >> "$GITHUB_STEP_SUMMARY"

  reproduce-robocop-1371:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'robocop-1371-frozen-env')
    name: Upstream Robocop #1371 exact base-fail / fix-pass reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install the upstream-locked uv version
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.13"

      - name: Clone upstream repository and pin exact commits
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/MarketSquare/robotframework-robocop.git upstream
          git -C upstream checkout --detach 271e73253a70710cc80374128efa9eabb549b5f2
          git -C upstream rev-parse HEAD
          git -C upstream fetch --depth=1 origin ceb6824fb4d80442937497a740edf60a5b6382e0
          git -C upstream cat-file -e ceb6824fb4d80442937497a740edf60a5b6382e0^{commit}

      - name: Create identical regression test for both revisions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test_robocop_issue_1371.py <<'PY'
          import os
          from pathlib import Path

          import pytest
          from typer.testing import CliRunner

          from robocop.run import app

          @pytest.mark.parametrize(
              ("check", "will_format", "expected_exit_code"),
              [
                  (False, True, 0),
                  (False, False, 0),
                  (True, True, 1),
                  (True, False, 0),
              ],
          )
          def test_issue_1371_exit_code(check, will_format, expected_exit_code, monkeypatch):
              root = Path(os.environ["ROBOCOP_ROOT"])
              test_data = root / "tests" / "formatter" / "formatters" / "NormalizeSeparators"
              test_data = test_data / ("source" if will_format else "expected")
              command = ["format", "--select", "NormalizeSeparators", "--no-overwrite"]
              if check:
                  command.append("--check")
              monkeypatch.chdir(test_data)
              result = CliRunner().invoke(app, [*command, "test.robot"])
              assert result.exit_code == expected_exit_code
          PY

      - name: Prove the exact base commit fails the regression test
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git checkout --detach 271e73253a70710cc80374128efa9eabb549b5f2
          uv sync --frozen --all-extras --dev
          uv pip install robotframework==6.1.1
          uv pip check
          uv pip freeze --python .venv/bin/python > /tmp/robocop-runtime-freeze.txt
          uv run --no-sync python --version > /tmp/robocop-python-version.txt
          uv --version > /tmp/robocop-uv-version.txt
          set +e
          ROBOCOP_ROOT="$PWD" uv run --no-sync python -m pytest -vv /tmp/test_robocop_issue_1371.py > /tmp/base-test.log 2>&1
          test_status=$?
          set -e
          cat /tmp/base-test.log
          if [[ "$test_status" -ne 1 ]] || ! grep -Eq "1 failed, 3 passed" /tmp/base-test.log || ! grep -q "assert 0 == 1" /tmp/base-test.log; then
            echo "::error::Base commit did not fail in the expected issue-specific regression case."
            exit 1
          fi
          echo "BASE_EXPECTED_FAILURE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned base commit reproduces issue #1371: one --check/modified-files assertion fails; three controls pass." >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the exact fix commit passes in the same frozen environment
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git checkout --detach ceb6824fb4d80442937497a740edf60a5b6382e0
          uv pip check
          ROBOCOP_ROOT="$PWD" uv run --no-sync python -m pytest -vv /tmp/test_robocop_issue_1371.py > /tmp/fix-test.log 2>&1
          cat /tmp/fix-test.log
          grep -Eq "4 passed" /tmp/fix-test.log
          echo "FIX_EXPECTED_PASS=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned fix commit passes all four identical regression/control cases in the exact same environment." >> "$GITHUB_STEP_SUMMARY"

      - name: Record tested source, runtime, and log identities
        if: always()
        shell: bash
        run: |
          {
            echo "## Reproduction identity"
            echo "- Repository: MarketSquare/robotframework-robocop"
            echo "- Base: 271e73253a70710cc80374128efa9eabb549b5f2"
            echo "- Fix: ceb6824fb4d80442937497a740edf60a5b6382e0"
            echo "- Python: $(cat /tmp/robocop-python-version.txt 2>/dev/null || echo unavailable)"
            echo "- uv: $(cat /tmp/robocop-uv-version.txt 2>/dev/null || echo unavailable)"
            echo "- Runtime freeze SHA-256:"
            sha256sum /tmp/robocop-runtime-freeze.txt 2>/dev/null || true
            echo "- Base/fix log SHA-256:"
            sha256sum /tmp/base-test.log /tmp/fix-test.log 2>/dev/null || true
            echo "- Test: same four parameterized cases executed at both commits in one locked environment"
            echo "- Model inference/training: not invoked"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PYTHON_VERSION=$(cat /tmp/pdoc-python-version.txt 2>/dev/null || echo unavailable)"
          echo "UV_VERSION=$(cat /tmp/pdoc-uv-version.txt 2>/dev/null || echo unavailable)"
          echo "UV_LOCK_SHA256=$(awk '{print $1}' /tmp/pdoc-lock-sha256.txt 2>/dev/null || echo unavailable)"
          echo "RUNTIME_FREEZE_SHA256=$(sha256sum /tmp/pdoc-runtime-freeze.txt 2>/dev/null | awk '{print $1}' || echo unavailable)"
          echo "BASE_CLI_LOG_SHA256=$(sha256sum /tmp/pdoc-base-cli.log 2>/dev/null | awk '{print $1}' || echo unavailable)"
          echo "FIX_CLI_LOG_SHA256=$(sha256sum /tmp/pdoc-fix-cli.log 2>/dev/null | awk '{print $1}' || echo unavailable)"


  reproduce-pdoc-813-cli:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'pdoc-813-cli-repro')
    name: Upstream pdoc #812 exact CLI base-fail / fix-pass reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Set up Python 3.11.5 (upstream CI matrix)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.5"

      - name: Install the uv version pinned in the upstream lock
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: "0.6.7"

      - name: Clone pdoc and pin exact base and fix commits
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mitmproxy/pdoc.git upstream
          git -C upstream checkout --detach 57ee1d628027feffbd734180287e74294ddab7df
          test "$(git -C upstream rev-parse HEAD)" = "57ee1d628027feffbd734180287e74294ddab7df"
          git -C upstream fetch --depth=1 origin 75863d3abac0843a4ca0f3d562db2bc21d6ba6dc
          git -C upstream cat-file -e 75863d3abac0843a4ca0f3d562db2bc21d6ba6dc^{commit}
          test "$(git -C upstream show 57ee1d628027feffbd734180287e74294ddab7df:LICENSE | sha256sum | cut -d' ' -f1)" = "$(git -C upstream show 75863d3abac0843a4ca0f3d562db2bc21d6ba6dc:LICENSE | sha256sum | cut -d' ' -f1)"

      - name: Freeze the upstream runtime and create one issue-specific project
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          uv sync --python "$(command -v python)" --frozen --all-extras --dev
          uv pip check
          uv --version > /tmp/pdoc-uv-version.txt
          .venv/bin/python --version > /tmp/pdoc-python-version.txt
          test "$(.venv/bin/python -c 'import platform; print(platform.python_version())')" = "3.11.5"
          uv pip freeze --python .venv/bin/python > /tmp/pdoc-runtime-freeze.txt
          sha256sum uv.lock > /tmp/pdoc-lock-sha256.txt
          mkdir -p "$RUNNER_TEMP/pdoc_issue_812_project" "$RUNNER_TEMP/pdoc_issue_812_output"
          cat > "$RUNNER_TEMP/pdoc_issue_812_project/pyproject.toml" <<'TOML'
          [project]
          name = "pdoc-issue-812-project"
          version = "0.0.1"
          TOML
          cat > "$RUNNER_TEMP/pdoc_issue_812_project/__init__.py" <<'PY'
          """Minimal valid package root for issue #812."""
          from .helper import answer

          __all__ = ["answer"]
          PY
          cat > "$RUNNER_TEMP/pdoc_issue_812_project/helper.py" <<'PY'
          """Small module imported from the package root."""

          def answer() -> int:
              """Return a fixed value for documentation rendering."""
              return 42
          PY

      - name: Prove exact base commit fails the actual python -m pdoc . command
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git checkout --detach 57ee1d628027feffbd734180287e74294ddab7df
          rm -rf "$RUNNER_TEMP/pdoc_issue_812_output"
          mkdir -p "$RUNNER_TEMP/pdoc_issue_812_output"
          set +e
          (
            cd "$RUNNER_TEMP/pdoc_issue_812_project"
            "$GITHUB_WORKSPACE/upstream/.venv/bin/python" -m pdoc . --output-directory "$RUNNER_TEMP/pdoc_issue_812_output"
          ) > /tmp/pdoc-base-cli.log 2>&1
          test_status=$?
          set -e
          cat /tmp/pdoc-base-cli.log
          if [[ "$test_status" -eq 0 ]] || ! grep -Fq "No modules found matching spec: ." /tmp/pdoc-base-cli.log; then
            echo "::error::Exact base did not reproduce issue #812 through the actual CLI command."
            exit 1
          fi
          echo "BASE_EXPECTED_FAILURE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact base commit reproduces the issue-specific ValueError using python -m pdoc . from a project root containing __init__.py." >> "$GITHUB_STEP_SUMMARY"

      - name: Prove exact fix commit passes the identical CLI command in the same environment
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git checkout --detach 75863d3abac0843a4ca0f3d562db2bc21d6ba6dc
          uv pip check
          rm -rf "$RUNNER_TEMP/pdoc_issue_812_output"
          mkdir -p "$RUNNER_TEMP/pdoc_issue_812_output"
          (
            cd "$RUNNER_TEMP/pdoc_issue_812_project"
            "$GITHUB_WORKSPACE/upstream/.venv/bin/python" -m pdoc . --output-directory "$RUNNER_TEMP/pdoc_issue_812_output"
          ) > /tmp/pdoc-fix-cli.log 2>&1
          cat /tmp/pdoc-fix-cli.log
          if ! find "$RUNNER_TEMP/pdoc_issue_812_output" -type f -name '*.html' -print -quit | grep -q .; then
            echo "::error::Fix returned success but produced no HTML documentation."
            exit 1
          fi
          echo "FIX_EXPECTED_PASS=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact fix commit successfully rendered HTML from the same python -m pdoc . command and same fixture." >> "$GITHUB_STEP_SUMMARY"

      - name: Record source, runtime, fixture, and log identities
        if: always()
        shell: bash
        run: |
          {
            echo "## pdoc #812 CLI reproduction identity"
            echo "- Repository: mitmproxy/pdoc"
            echo "- Issue: #812"
            echo "- Upstream PR: #813"
            echo "- Base: 57ee1d628027feffbd734180287e74294ddab7df"
            echo "- Fix: 75863d3abac0843a4ca0f3d562db2bc21d6ba6dc"
            echo "- Python: $(cat /tmp/pdoc-python-version.txt 2>/dev/null || echo unavailable)"
            echo "- uv: $(cat /tmp/pdoc-uv-version.txt 2>/dev/null || echo unavailable)"
            echo "- uv.lock SHA-256:"
            cat /tmp/pdoc-lock-sha256.txt 2>/dev/null || true
            echo "- Runtime freeze SHA-256:"
            sha256sum /tmp/pdoc-runtime-freeze.txt 2>/dev/null || true
            echo "- Base/fix CLI log SHA-256:"
            sha256sum /tmp/pdoc-base-cli.log /tmp/pdoc-fix-cli.log 2>/dev/null || true
            echo "- Fixture: synthetic valid package root with __init__.py, pyproject.toml and helper.py"
            echo "- Identical CLI invocation: python -m pdoc . --output-directory <temp-dir>"
            echo "- Base failure must contain the issue-specific ValueError; fix must render at least one HTML file"
            echo "- Model inference/training: not invoked"
          } >> "$GITHUB_STEP_SUMMARY"
