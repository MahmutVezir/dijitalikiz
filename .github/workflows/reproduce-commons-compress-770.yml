name: Reproduce Commons Compress PAX header candidate

on:
  push:
    paths:
      - ".github/repro-candidate-trigger"
      - ".github/reproduction/**"
      - ".github/workflows/reproduce-commons-compress-770.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-pax-header-limit:
    name: Verify regression before and after fix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch exact public upstream revisions
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/apache/commons-compress.git /tmp/commons-compress
          git -C /tmp/commons-compress fetch --depth=1 origin 829b5dd6ffe976c0a03231e65790a65af9f3a6ee bab5629f6b3cea44cf0622cdd92c8cefcfbf360a
          git -C /tmp/commons-compress worktree add --detach /tmp/commons-compress-pre-fix 829b5dd6ffe976c0a03231e65790a65af9f3a6ee
          git -C /tmp/commons-compress worktree add --detach /tmp/commons-compress-fixed bab5629f6b3cea44cf0622cdd92c8cefcfbf360a
          printf 'PRE_FIX_REVISION=%s\n' "$(git -C /tmp/commons-compress-pre-fix rev-parse HEAD)"
          printf 'FIXED_REVISION=%s\n' "$(git -C /tmp/commons-compress-fixed rev-parse HEAD)"

      - name: Verify and prefetch the published Maven parent POM
        shell: bash
        run: |
          set -euo pipefail
          POM_DIR="$HOME/.m2/repository/org/apache/commons/commons-parent/102"
          mkdir -p "$POM_DIR"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors "https://repo.maven.apache.org/maven2/org/apache/commons/commons-parent/102/commons-parent-102.pom" --output "$POM_DIR/commons-parent-102.pom"
          test -s "$POM_DIR/commons-parent-102.pom"
          sha256sum "$POM_DIR/commons-parent-102.pom"
          rm -f "$POM_DIR"/*.lastUpdated

      - name: Confirm identical regression test fails before the fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commons-compress-pre-fix/src/test/java/org/apache/commons/compress/archivers/tar
          cp .github/reproduction/PaxHeaderOomReproductionTest.java /tmp/commons-compress-pre-fix/src/test/java/org/apache/commons/compress/archivers/tar/
          cd /tmp/commons-compress-pre-fix
          set +e
          mvn -U -B -ntp -Dstyle.color=never -Dtest=PaxHeaderOomReproductionTest test > /tmp/pax-header-pre-fix.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: the regression test unexpectedly passed on the pre-fix revision."
            cat /tmp/pax-header-pre-fix.log
            exit 1
          fi
          if ! grep -q "Should have thrown MemoryLimitException" /tmp/pax-header-pre-fix.log; then
            echo "ERROR: the pre-fix build failed for a reason other than the expected missing memory-limit behavior."
            tail -n 120 /tmp/pax-header-pre-fix.log
            exit 1
          fi
          echo "EXPECTED PRE-FIX FAILURE REPRODUCED: oversized PAX header was not rejected."
          grep -E "Tests run:|Should have thrown MemoryLimitException" /tmp/pax-header-pre-fix.log | tail -n 10

      - name: Confirm identical regression test passes after the fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commons-compress-fixed/src/test/java/org/apache/commons/compress/archivers/tar
          cp .github/reproduction/PaxHeaderOomReproductionTest.java /tmp/commons-compress-fixed/src/test/java/org/apache/commons/compress/archivers/tar/
          cd /tmp/commons-compress-fixed
          mvn -U -B -ntp -Dstyle.color=never -Dtest=PaxHeaderOomReproductionTest test
          echo "FIX VERIFIED: the same oversized-PAX-header regression test passes on the fixed revision."
