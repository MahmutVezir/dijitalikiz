          python -m venv .venv-dataset
          .venv-dataset/bin/python -m pip install --disable-pip-version-check --no-deps pyarrow==19.0.1
          .venv-dataset/bin/python - <<'PY'
          import importlib.metadata as md
          import json
          dist = md.metadata("pyarrow")
          classifiers = [x for x in dist.get_all("Classifier", []) if x.startswith("License ::")]
          license_text = dist.get("License") or dist.get("License-Expression")
          if "Apache" not in str(license_text) and not any("Apache Software License" in x for x in classifiers):
              raise SystemExit(f"pyarrow Apache license metadata not confirmed: {license_text!r} {classifiers!r}")
          inventory = {"pyarrow": {"version": md.version("pyarrow"), "license": license_text, "license_classifiers": classifiers}}
          with open("reproduction-evidence/dataset-extraction-license-inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2)
              f.write("\n")
