          if [ -f dependency-license-inventory.json ]; then cp dependency-license-inventory.json reproduction-evidence/; fi
          (cd reproduction-evidence && find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          {
            echo "### Moto #8269 ECR multi-tag reproducer"
            echo "- Buggy base: bf49e22f41be7444dc20e05dfa5dd13f25672eba"
            echo "- Fixed revision: d46db48b4911d84235ef783ddab41b73882530f7"
            echo "- No AWS account or external service used"
            echo "- No model loading, inference, or training"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw Moto reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moto-issue-8269-reproduction
          path: reproduction-evidence/
          if-no-files-found: warn
          retention-days: 90


