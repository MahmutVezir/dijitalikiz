          inventory = {}
          for name in names:
              dist = md.metadata(name)
              classifiers = [x for x in dist.get_all("Classifier", []) if x.startswith("License ::")]
              license_text = dist.get("License") or dist.get("License-Expression")
              if not license_text and not classifiers:
                  raise SystemExit(f"License metadata missing for {name}; stop before source tests")
              inventory[name] = {
                  "version": md.version(name),
                  "license": license_text,
                  "license_expression": dist.get("License-Expression"),
                  "license_classifiers": classifiers,
              }
          import json
          with open("dependency-license-inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps(inventory, indent=2, ensure_ascii=False))
          PY

      - name: Clone exact Moto source and prepare patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproduction-evidence
          git clone https://github.com/getmoto/moto.git upstream-moto
          git -C upstream-moto fetch --no-tags origin bf49e22f41be7444dc20e05dfa5dd13f25672eba d46db48b4911d84235ef783ddab41b73882530f7
          git -C upstream-moto cat-file -e 'bf49e22f41be7444dc20e05dfa5dd13f25672eba^{commit}'
          git -C upstream-moto cat-file -e 'd46db48b4911d84235ef783ddab41b73882530f7^{commit}'
          git -C upstream-moto checkout --detach bf49e22f41be7444dc20e05dfa5dd13f25672eba
          test "$(git -C upstream-moto rev-parse HEAD)" = "bf49e22f41be7444dc20e05dfa5dd13f25672eba"
          test "$(git -C upstream-moto rev-parse HEAD:LICENSE)" = "90a85e7149454f173dd595bdeb884340cc01e6f6"
          test "$(git -C upstream-moto rev-parse HEAD:setup.cfg)" = "cef6c2d5788a173013cc0a2307a4793c3900a200"
          git -C upstream-moto show HEAD:LICENSE > reproduction-evidence/upstream-LICENSE.txt
          git -C upstream-moto show HEAD:setup.cfg > reproduction-evidence/upstream-setup.cfg
          git -C upstream-moto diff bf49e22f41be7444dc20e05dfa5dd13f25672eba d46db48b4911d84235ef783ddab41b73882530f7 > reproduction-evidence/pr-8296-full.patch
          git -C upstream-moto diff bf49e22f41be7444dc20e05dfa5dd13f25672eba d46db48b4911d84235ef783ddab41b73882530f7 -- tests/test_ecr/test_ecr_boto3.py > reproduction-evidence/dataset-test.patch
          sha256sum reproduction-evidence/upstream-LICENSE.txt reproduction-evidence/pr-8296-full.patch reproduction-evidence/dataset-test.patch > reproduction-evidence/source-provenance-sha256.txt
          cp dependency-license-inventory.json reproduction-evidence/

      - name: Run independent issue reproducer on buggy base (failure required)
        shell: bash
