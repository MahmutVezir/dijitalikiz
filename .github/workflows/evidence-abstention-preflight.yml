          names = ["boto3", "botocore", "s3transfer", "jmespath", "urllib3", "requests", "certifi", "charset-normalizer", "idna", "python-dateutil", "six", "cryptography", "cffi", "pycparser", "xmltodict", "Werkzeug", "responses", "Jinja2", "MarkupSafe", "typing-extensions", "pytest", "iniconfig", "packaging", "pluggy", "Pygments"]
