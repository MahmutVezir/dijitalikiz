          PYTHONPATH="$GITHUB_WORKSPACE/upstream-moto" .venv-tests/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/reproduction/moto_issue_8269" -p "test_issue_8269.py" -v > reproduction-evidence/base-issue-test.log 2>&1
          status=$?
          set -e
          cat reproduction-evidence/base-issue-test.log
          if [ "$status" -eq 0 ]; then
            echo "Expected list_images to omit one of the two tags on the buggy base." >&2
            exit 1
          fi
          grep -E "AssertionError: 1 != 2|1 != 2" reproduction-evidence/base-issue-test.log

