          .venv-eodag/bin/python -m pip check
          .venv-eodag/bin/python -m pip freeze --all | sort > reproduction-evidence/dependency-lock-resolved.txt
          .venv-eodag/bin/python - <<'PY'
          import importlib.metadata as md
          import json
          import re
          inventory = {}
          missing = []
          for dist in md.distributions():
              name = dist.metadata.get("Name")
              if not name:
                  continue
              canonical = re.sub(r"[-_.]+", "-", name).lower()
              if canonical in inventory:
                  raise SystemExit(f"Duplicate installed distribution metadata name: {name}")
              classifiers = [
                  item for item in dist.metadata.get_all("Classifier", [])
                  if item.startswith("License ::")
              ]
              license_text = dist.metadata.get("License") or dist.metadata.get("License-Expression")
              if not license_text and not classifiers:
                  missing.append(name)
              inventory[canonical] = {
                  "name": name,
                  "version": dist.version,
                  "license": license_text,
                  "license_expression": dist.metadata.get("License-Expression"),
                  "license_classifiers": classifiers,
              }
          if missing:
              raise SystemExit(
                  "License metadata missing for installed distribution(s); "
                  "upstream dataset selectors were not executed: " + ", ".join(sorted(missing))
              )
          required = {
              "pydantic": "2.10.6",
              "pyyaml": "6.0.2",
              "ecmwf-api-client": "1.6.3",
              "usgs": "0.3.5",
              "owslib": "0.31.0",
              "fastapi": "0.115.8",
              "pytest": "8.3.4",
              "pytest-socket": "0.7.0",
          }
          if "eodag" not in inventory:
              raise SystemExit("Editable exact-base EODAG distribution metadata is missing")
          for name, expected in required.items():
              actual = inventory.get(name, {}).get("version")
              if actual is None:
                  raise SystemExit(f"Required package absent from license inventory: {name}")
              if actual != expected:
                  raise SystemExit(f"Unexpected {name} version: {actual}; expected {expected}")
          with open("reproduction-evidence/dependency-license-inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2, ensure_ascii=False, sort_keys=True)
              f.write("\n")
          with open("reproduction-evidence/dependency-environment-summary.json", "w", encoding="utf-8") as f:
              json.dump({
                  "python": "3.11.9",
                  "eodag_source_base": "b7cc06e19025e5bbf14e28a0975f1749e21e9be3",
                  "explicitly_pinned_packages": required,
                  "resolved_distribution_count": len(inventory),
                  "all_installed_distributions_have_license_metadata": True,
                  "pip_check": "passed",
                  "license_inventory_is_legal_clearance": False,
              }, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps({
              "resolved_distribution_count": len(inventory),
              "all_license_metadata_present": True,
              "required_package_versions": required,
          }, indent=2))
          PY
          sha256sum reproduction-evidence/dependency-lock-resolved.txt reproduction-evidence/dependency-license-inventory.json reproduction-evidence/dependency-environment-summary.json > reproduction-evidence/dependency-environment-sha256.txt

      - name: Apply exact test-only PR patch and verify no production code changed
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-eodag checkout --detach b7cc06e19025e5bbf14e28a0975f1749e21e9be3
          git -C upstream-eodag diff b7cc06e19025e5bbf14e28a0975f1749e21e9be3 312966a46513a082333d46cd7212bdce36aaf769 -- tests/units/test_core.py > reproduction-evidence/dataset-test.patch
          test -s reproduction-evidence/dataset-test.patch
          git -C upstream-eodag apply "$GITHUB_WORKSPACE/reproduction-evidence/dataset-test.patch"
          .venv-eodag/bin/python - <<'PY'
          import json
          import subprocess
          expected = {"tests/units/test_core.py"}
