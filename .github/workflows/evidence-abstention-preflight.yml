          .venv-tests/bin/python - <<'PY'
          import importlib.metadata as md
          dist = md.metadata("PyYAML")
          classifiers = [x for x in dist.get_all("Classifier", []) if x.startswith("License ::")]
          license_text = dist.get("License") or dist.get("License-Expression")
          if md.version("PyYAML") != "6.0.2":
              raise SystemExit("Unexpected PyYAML version")
          if "MIT" not in str(license_text) and not any("MIT License" in item for item in classifiers):
              raise SystemExit(f"PyYAML MIT license metadata not confirmed: {license_text!r} {classifiers!r}")
          print({"version": md.version("PyYAML"), "license": license_text, "classifiers": classifiers})
          PY

      - name: Clone and authenticate exact upstream source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproduction-evidence
          git clone https://github.com/CS-SI/eodag.git upstream-eodag
          git -C upstream-eodag fetch --no-tags origin b7cc06e19025e5bbf14e28a0975f1749e21e9be3 312966a46513a082333d46cd7212bdce36aaf769
          git -C upstream-eodag cat-file -e 'b7cc06e19025e5bbf14e28a0975f1749e21e9be3^{commit}'
          git -C upstream-eodag cat-file -e '312966a46513a082333d46cd7212bdce36aaf769^{commit}'
          git -C upstream-eodag checkout --detach b7cc06e19025e5bbf14e28a0975f1749e21e9be3
          test "$(git -C upstream-eodag rev-parse HEAD)" = "b7cc06e19025e5bbf14e28a0975f1749e21e9be3"
          test "$(git -C upstream-eodag rev-parse HEAD:LICENSE)" = "1a9893b43e8e6d46ff5cda60ab6562850b7f78ff"
          test "$(git -C upstream-eodag rev-parse HEAD:NOTICE)" = "9f763bc3c2f90854b8209ce60e23c8fc03c6ec7e"
          test "$(git -C upstream-eodag rev-parse HEAD:eodag/resources/user_conf_template.yml)" = "0d6c9e24a3294dd12c2b09e844ef3990b01a0a5b"
          git -C upstream-eodag show HEAD:LICENSE > reproduction-evidence/upstream-LICENSE.txt
          git -C upstream-eodag show HEAD:NOTICE > reproduction-evidence/upstream-NOTICE.txt
          git -C upstream-eodag show HEAD:eodag/resources/user_conf_template.yml > reproduction-evidence/base-user_conf_template.yml
          git -C upstream-eodag diff b7cc06e19025e5bbf14e28a0975f1749e21e9be3 312966a46513a082333d46cd7212bdce36aaf769 -- eodag/resources/user_conf_template.yml > reproduction-evidence/issue-1530-source.patch
          sha256sum reproduction-evidence/upstream-LICENSE.txt reproduction-evidence/upstream-NOTICE.txt reproduction-evidence/base-user_conf_template.yml reproduction-evidence/issue-1530-source.patch > reproduction-evidence/source-provenance-sha256.txt

      - name: Run identical issue reproducer on buggy base (failure required)
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-eodag checkout --detach b7cc06e19025e5bbf14e28a0975f1749e21e9be3
          set +e
          EODAG_SOURCE_ROOT="$GITHUB_WORKSPACE/upstream-eodag" .venv-tests/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/reproduction/eodag_issue_1530" -p "test_issue_1530.py" -v > reproduction-evidence/base-issue-test.log 2>&1
          status=$?
          set -e
          cat reproduction-evidence/base-issue-test.log
          if [ "$status" -eq 0 ]; then
            echo "Expected duplicate geodes key to fail the issue-specific reproducer on the buggy base." >&2
            exit 1
          fi
          grep -F "AssertionError: 'geodes_s3' not found" reproduction-evidence/base-issue-test.log

