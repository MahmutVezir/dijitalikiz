          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/upstream-eodag" .venv-eodag/bin/python research_candidates/evidence_abstention/implementation/run_swe_rebench_fail_to_pass.py \
            --source-dir "$GITHUB_WORKSPACE/upstream-eodag" \
            --selectors-file "$GITHUB_WORKSPACE/reproduction-evidence/dataset-fail-to-pass-selectors.txt" \
            --config-file "$GITHUB_WORKSPACE/upstream-eodag/pytest.ini" \
