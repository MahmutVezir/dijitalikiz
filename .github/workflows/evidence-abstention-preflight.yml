          echo "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9  reproduction-evidence/train-00000-of-00001.parquet" | sha256sum --check
          .venv-dataset/bin/python - <<'PY'
          import hashlib
          import json
          import pyarrow.parquet as pq
          path = "reproduction-evidence/train-00000-of-00001.parquet"
          columns = ["instance_id", "repo", "base_commit", "created_at", "language", "license", "FAIL_TO_PASS", "problem_statement"]
          row = pq.read_table(path, columns=columns, filters=[("instance_id", "=", "getmoto__moto-8296")]).to_pylist()[0]
          assert row["repo"] == "getmoto/moto", row
          assert row["base_commit"] == "bf49e22f41be7444dc20e05dfa5dd13f25672eba", row
          assert str(row["created_at"]).replace("T", " ")[:19] == "2024-11-07 20:51:42", row
          assert row["language"] == "python", row
