name: Evidence Abstention Preflight (No Inference)
# Candidate jobs retain raw buggy-base and fixed-revision evidence even when a selector audit fails.

on:
  push:
    branches:
      - "research/**"
    paths:
      - ".github/workflows/evidence-abstention-preflight.yml"
      - "research_candidates/evidence_abstention/implementation/**"
      - "research_candidates/evidence_abstention/numpyro_1916/**"
      - "research_candidates/evidence_abstention/dymos_1166/**"
      - "research_candidates/evidence_abstention/eodag_1530/**"
      - "tests/test_dymos_1166_proposed_packet_set.py"
      - "tests/test_eodag_1530_stage3_packet_set.py"
      - "tests/test_numpyro_1916_proposed_packet_set.py"
      - "tests/test_numpyro_1916_license_and_independence_records.py"
      - "tests/test_build_numpyro_1916_blinded_review_packets.py"
      - "research_candidates/evidence_abstention/reproduction/**/test_*.py"
      - "research_candidates/evidence_abstention/reproduction/**/requirements*.lock"
      - "research_candidates/evidence_abstention/reproduction/**/dataset_test_requirements.lock"
      - "research_candidates/evidence_abstention/reproduction/**/reproduction_environment_lock.json"
      - "research_candidates/evidence_abstention/reproduction/dishka_issue_435/SWE_REBENCH_V2_DISHKA_435_CASE_ACCEPTANCE_PROPOSED_V0_2.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_REGISTRY_V0_2.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_ACCEPTANCE_SCHEMA_V0_1.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_MANIFEST_V0_2_2026-11-16.json"
      - "research_candidates/evidence_abstention/STUDY_DESIGN_DECISION_V0_2_EXPLORATORY_2026-11-16.md"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_PROTOCOL_V0_2_EXPLORATORY_DRAFT_2026-11-16.md"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_ANALYSIS_PLAN_V0_2_EXPLORATORY_DRAFT_2026-11-16.md"
      - "research_candidates/evidence_abstention/HUMAN_EVALUATOR_AMENDMENT_V0_1_2026-11-18.md"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_DUAL_HUMAN_OUTPUT_SCORING_RUBRIC_V0_1_DRAFT_2026-11-18.md"
      - "tests/test_swe_rebench_v2_exploratory_design.py"
      - "scripts/evidence_abstention_preflight.py"
      - "scripts/swe_rebench_v2_exploratory_preflight.py"
      - "tests/test_evidence_abstention_preflight.py"
      - "tests/test_evidence_packet_audit.py"
      - "tests/test_swe_rebench_v2_exploratory_case_acceptance.py"
      - "tests/test_swe_rebench_v2_exploratory_preflight.py"
  pull_request:
    paths:
      - ".github/workflows/evidence-abstention-preflight.yml"
      - "research_candidates/evidence_abstention/implementation/**"
      - "research_candidates/evidence_abstention/numpyro_1916/**"
      - "research_candidates/evidence_abstention/dymos_1166/**"
      - "research_candidates/evidence_abstention/eodag_1530/**"
      - "tests/test_dymos_1166_proposed_packet_set.py"
      - "tests/test_eodag_1530_stage3_packet_set.py"
      - "tests/test_numpyro_1916_proposed_packet_set.py"
      - "tests/test_numpyro_1916_license_and_independence_records.py"
      - "tests/test_build_numpyro_1916_blinded_review_packets.py"
      - "research_candidates/evidence_abstention/reproduction/**/test_*.py"
      - "research_candidates/evidence_abstention/reproduction/**/requirements*.lock"
      - "research_candidates/evidence_abstention/reproduction/**/dataset_test_requirements.lock"
      - "research_candidates/evidence_abstention/reproduction/**/reproduction_environment_lock.json"
      - "research_candidates/evidence_abstention/reproduction/dishka_issue_435/SWE_REBENCH_V2_DISHKA_435_CASE_ACCEPTANCE_PROPOSED_V0_2.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_REGISTRY_V0_2.json"
      - "research_candidates/evidence_abstention/SWE_REBENCH_V2_EXPLORATORY_CASE_ACCEPTANCE_SCHEMA_V0_1.json"
      - "scripts/evidence_abstention_preflight.py"
      - "scripts/swe_rebench_v2_exploratory_preflight.py"
      - "tests/test_evidence_abstention_preflight.py"
      - "tests/test_evidence_packet_audit.py"
      - "tests/test_swe_rebench_v2_exploratory_case_acceptance.py"
      - "tests/test_swe_rebench_v2_exploratory_preflight.py"
  workflow_dispatch:
    inputs:
      run_non_dishka_candidates:
        description: "Run the 12 other candidate reproductions; leave false for Dishka-only validation."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  no-inference-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned v0.2 exploratory validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps -r research_candidates/evidence_abstention/implementation/v0_2_exploratory_preflight_requirements.lock

      - name: Unit-test evidence packet and citation integrity auditor
        if: always()
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_evidence_packet_audit.py' -v > packet-audit-tests.log 2>&1
          test_status=$?
          cat packet-audit-tests.log
          echo "Packet audit-test exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Unit-test operational and nested evidence packet contracts
        if: always()
        shell: bash
        run: |
          set +e
          PYTHONPATH=research_candidates/evidence_abstention/implementation python -m unittest test_operational_packet_validator test_evidence_level_packet_set test_swe_rebench_v2_candidate_triage_ledger -v > operational-packet-tests.log 2>&1
          test_status=$?
          cat operational-packet-tests.log
          echo "Operational packet tests exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Unit-test NumPyro #1916 packet, license, independence and blind-bundle contracts
        if: always()
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_numpyro_1916_proposed_packet_set.py tests/test_numpyro_1916_license_and_independence_records.py tests/test_build_numpyro_1916_blinded_review_packets.py > numpyro-1916-review-tests.log 2>&1
          test_status=$?
          cat numpyro-1916-review-tests.log
          echo "NumPyro #1916 review-contract test exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Unit-test Dymos #1166 packet, provenance, issue family and license scope
        if: always()
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_dymos_1166_proposed_packet_set.py > dymos-1166-review-tests.log 2>&1
          test_status=$?
          cat dymos-1166-review-tests.log
          echo "Dymos #1166 review-contract test exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Unit-test EODAG #1530 nested packet, provenance, independence and license-scope contracts
        if: always()
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_eodag_1530_stage3_packet_set.py > eodag-1530-review-tests.log 2>&1
          test_status=$?
          cat eodag-1530-review-tests.log
          echo "EODAG #1530 review-contract test exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Unit-test fail-to-pass selector runner contract
        if: always()
        shell: bash
        run: |
          set +e
          PYTHONPATH=research_candidates/evidence_abstention/implementation python -m unittest test_run_swe_rebench_fail_to_pass -v > selector-runner-tests.log 2>&1
          test_status=$?
          cat selector-runner-tests.log
          echo "Fail-to-pass selector-runner contract test exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Unit-test v0.2 exploratory acceptance and readiness contracts
        if: always()
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_swe_rebench_v2_exploratory_case_acceptance.py tests/test_swe_rebench_v2_exploratory_preflight.py > v0.2-exploratory-tests.log 2>&1
          test_status=$?
          cat v0.2-exploratory-tests.log
          echo "v0.2 exploratory contract test exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Unit-test v0.2 study design and dual-human scoring amendment
        if: always()
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_swe_rebench_v2_exploratory_design.py > v0.2-design-tests.log 2>&1
          test_status=$?
          cat v0.2-design-tests.log
          echo "v0.2 study-design and dual-human scoring tests exit code: ${test_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Report SWE-rebench V2 readiness blockers without model execution
        if: always()
        shell: bash
        run: |
          set +e
          PYTHONPATH=research_candidates/evidence_abstention/implementation:scripts python scripts/swe_rebench_v2_exploratory_preflight.py > swe-rebench-v2-readiness-report.json 2>&1
          report_status=$?
          cat swe-rebench-v2-readiness-report.json
          echo "SWE-rebench V2 v0.2 exploratory readiness report command exit code: ${report_status}" >> "$GITHUB_STEP_SUMMARY"
          exit "$report_status"

      - name: Upload no-inference preflight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-abstention-preflight-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            selector-runner-tests.log
            packet-audit-tests.log
            operational-packet-tests.log
            numpyro-1916-review-tests.log
            dymos-1166-review-tests.log
            eodag-1530-review-tests.log
            v0.2-exploratory-tests.log
            v0.2-design-tests.log
            swe-rebench-v2-readiness-report.json
          if-no-files-found: warn
          retention-days: 14

  dishka-issue-435-reproduction:
    needs: no-inference-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up exact Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Record runtime and clone exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproduction-evidence
          python -VV > reproduction-evidence/runtime.txt 2>&1
          python -c "import platform; print(platform.platform())" >> reproduction-evidence/runtime.txt
          cat /etc/os-release >> reproduction-evidence/runtime.txt
          git clone https://github.com/reagento/dishka.git upstream-dishka
          git -C upstream-dishka diff 8718d5af93f9e48bc2506c64827663fdccc5ad89 b1eae11734e64551d7b101195f27cb6870e1c364 -- tests/unit/container/override/test_alias.py tests/unit/container/override/test_context_var.py tests/unit/container/override/test_provide.py tests/unit/container/test_context_vars.py > reproduction-evidence/dataset-test.patch
          sha256sum research_candidates/evidence_abstention/reproduction/dishka_issue_435/test_issue_435.py > reproduction-evidence/test-sha256.txt
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet" \
            --output reproduction-evidence/train-00000-of-00001.parquet
          echo "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9  reproduction-evidence/train-00000-of-00001.parquet" | sha256sum --check
          python -m venv .venv-dataset
          .venv-dataset/bin/python -m pip install --disable-pip-version-check "pyarrow==19.0.1"
          .venv-dataset/bin/python - <<'PY'
          import hashlib, json
          import pyarrow.parquet as pq

          path = "reproduction-evidence/train-00000-of-00001.parquet"
          columns = ["instance_id", "repo", "base_commit", "created_at", "language", "license", "FAIL_TO_PASS", "problem_statement"]
          table = pq.read_table(path, columns=columns, filters=[("instance_id", "=", "reagento__dishka-436")])
          rows = table.to_pylist()
          assert len(rows) == 1, len(rows)
          row = rows[0]
          assert row["repo"] == "reagento/dishka", row
          assert row["base_commit"] == "8718d5af93f9e48bc2506c64827663fdccc5ad89", row
          assert row["created_at"] == "2025-04-15 22:52:26", row
          assert row["language"] == "python", row
          assert row["license"] == "Apache-2.0", row
          assert len(row["FAIL_TO_PASS"]) == 8, row["FAIL_TO_PASS"]
          canonical = json.dumps(row, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          digest = hashlib.sha256(canonical).hexdigest()
          with open("reproduction-evidence/dataset-row-canonical.json", "wb") as f:
              f.write(canonical)
          with open("reproduction-evidence/dataset-row-sha256.txt", "w", encoding="utf-8") as f:
              f.write(digest + "  dataset-row-canonical.json\n")
          print("dataset_row_sha256=" + digest)
          with open("reproduction-evidence/dataset-fail-to-pass-selectors.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(row["FAIL_TO_PASS"]) + "\n")
          print("fail_to_pass=" + json.dumps(row["FAIL_TO_PASS"], ensure_ascii=False))
          PY
          sha256sum research_candidates/evidence_abstention/reproduction/dishka_issue_435/issue_435_source_snapshot.json research_candidates/evidence_abstention/reproduction/dishka_issue_435/pull_436_source_snapshot.json > reproduction-evidence/issue-pr-snapshot-sha256.txt
          sha256sum research_candidates/evidence_abstention/reproduction/dishka_issue_435/NESTED_EVIDENCE_PACKETS_DRAFT_2026-11-16.md research_candidates/evidence_abstention/REAGENTO_DISHKA_435_GOLD_AND_EVIDENCE_TIERS_DRAFT_2026-11-16.md > reproduction-evidence/packet-draft-sha256.txt
          python -m venv .venv-tests
          .venv-tests/bin/python -m pip install --disable-pip-version-check --no-deps -r research_candidates/evidence_abstention/reproduction/dishka_issue_435/dataset_test_requirements.lock
          .venv-tests/bin/python - <<'PY'
          import importlib.metadata as md, json
          packages = {}
          for name in ("pytest", "iniconfig", "packaging", "pluggy"):
              dist = md.metadata(name)
              packages[name] = {
                  "version": md.version(name),
                  "license": dist.get("License"),
                  "license_expression": dist.get("License-Expression"),
                  "classifiers": [x for x in dist.get_all("Classifier", []) if x.startswith("License ::")]
              }
          with open("reproduction-evidence/test-environment-package-metadata.json", "w", encoding="utf-8") as f:
              json.dump(packages, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          sha256sum research_candidates/evidence_abstention/REAGENTO_DISHKA_436_CHANGED_FILE_LICENSE_MANIFEST_V0_1.json research_candidates/evidence_abstention/reproduction/dishka_issue_435/reproduction_environment_lock.json research_candidates/evidence_abstention/reproduction/dishka_issue_435/dataset_test_requirements.lock > reproduction-evidence/license-and-environment-lock-sha256.txt
          echo "c548969ec886af21b56c93daae34db1a86b3a10c8dd1473d3d5c886549a9e86d  research_candidates/evidence_abstention/reproduction/dishka_issue_435/dataset_parquet_row_canonical.json" | sha256sum --check
          sha256sum research_candidates/evidence_abstention/reproduction/dishka_issue_435/cohort_selection_row_snapshot.json research_candidates/evidence_abstention/reproduction/dishka_issue_435/dataset_parquet_row_canonical.json research_candidates/evidence_abstention/timestamp_reconciliation_part_01_2026-11-15.csv research_candidates/evidence_abstention/REAGENTO_DISHKA_436_RESOURCE_TYPE_RECONCILIATION_2026-11-16.md > reproduction-evidence/dataset-provenance-sha256.txt

      - name: Run identical issue reproducer on buggy base (failure required)
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-dishka checkout --detach 8718d5af93f9e48bc2506c64827663fdccc5ad89
          git -C upstream-dishka apply "$GITHUB_WORKSPACE/reproduction-evidence/dataset-test.patch"
          mapfile -t selectors < "$GITHUB_WORKSPACE/reproduction-evidence/dataset-fail-to-pass-selectors.txt"
          set +e
          (cd upstream-dishka && PYTHONPATH="$GITHUB_WORKSPACE/upstream-dishka/src" "$GITHUB_WORKSPACE/.venv-tests/bin/python" -m pytest -c /dev/null -p no:cacheprovider -q --color=no "${selectors[@]}") > "$GITHUB_WORKSPACE/reproduction-evidence/base-dataset-test.log" 2>&1
          dataset_status=$?
          set -e
          cat reproduction-evidence/base-dataset-test.log
          if [ "$dataset_status" -eq 0 ]; then
            echo "Expected all 8 dataset FAIL_TO_PASS tests to fail on the buggy base." >&2
            exit 1
          fi
          grep -E "8 failed.*in" reproduction-evidence/base-dataset-test.log
          if grep -q "ERROR collecting" reproduction-evidence/base-dataset-test.log; then
            echo "Dataset tests had collection errors rather than defect-specific failures." >&2
            exit 1
          fi
          git -C upstream-dishka rev-parse HEAD > reproduction-evidence/base-commit.txt
          git -C upstream-dishka show HEAD:src/dishka/registry_builder.py > reproduction-evidence/base-registry_builder.py
          git -C upstream-dishka show HEAD:src/dishka/container.py > reproduction-evidence/base-container.py
          git -C upstream-dishka show HEAD:src/dishka/registry.py > reproduction-evidence/base-registry.py
          sha256sum reproduction-evidence/base-registry_builder.py reproduction-evidence/base-container.py reproduction-evidence/base-registry.py > reproduction-evidence/base-source-sha256.txt
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/upstream-dishka/src" python -m unittest discover \
            -s "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/reproduction/dishka_issue_435" \
            -p "test_issue_435.py" -k test_issue_435_override_lower_scope -v \
            > reproduction-evidence/base-test.log 2>&1
          status=$?
          set -e
          cat reproduction-evidence/base-test.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the issue reproducer to fail on the pinned buggy base, but it passed." >&2
            exit 1
          fi
          grep -F "AssertionError: 1 != 42" reproduction-evidence/base-test.log

      - name: Run the same issue reproducer on fixed revision (pass required)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-dishka checkout --detach --force b1eae11734e64551d7b101195f27cb6870e1c364
          git -C upstream-dishka rev-parse HEAD > reproduction-evidence/fixed-commit.txt
          git -C upstream-dishka show HEAD:src/dishka/registry_builder.py > reproduction-evidence/fixed-registry_builder.py
          git -C upstream-dishka show HEAD:src/dishka/container.py > reproduction-evidence/fixed-container.py
          git -C upstream-dishka show HEAD:src/dishka/registry.py > reproduction-evidence/fixed-registry.py
          git -C upstream-dishka diff 8718d5af93f9e48bc2506c64827663fdccc5ad89 b1eae11734e64551d7b101195f27cb6870e1c364 -- src/dishka/registry_builder.py > reproduction-evidence/registry_builder.diff
          git -C upstream-dishka diff 8718d5af93f9e48bc2506c64827663fdccc5ad89 b1eae11734e64551d7b101195f27cb6870e1c364 > reproduction-evidence/full-pr.diff
          sha256sum reproduction-evidence/fixed-registry_builder.py reproduction-evidence/fixed-container.py reproduction-evidence/fixed-registry.py reproduction-evidence/registry_builder.diff reproduction-evidence/full-pr.diff > reproduction-evidence/fixed-source-sha256.txt
          for source_file in tests/unit/container/override/test_alias.py tests/unit/container/override/test_context_var.py tests/unit/container/override/test_provide.py tests/unit/container/test_context_vars.py; do
            git -C upstream-dishka show HEAD:$source_file > reproduction-evidence/$(basename "$source_file")
          done
          PYTHONPATH="$GITHUB_WORKSPACE/upstream-dishka/src" python -m unittest discover \
            -s "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/reproduction/dishka_issue_435" \
            -p "test_issue_435.py" -k test_issue_435_override_lower_scope -v \
            > reproduction-evidence/fixed-test.log 2>&1
          cat reproduction-evidence/fixed-test.log
          grep -F "Ran 1 test" reproduction-evidence/fixed-test.log
          grep -F "OK" reproduction-evidence/fixed-test.log
          mapfile -t selectors < "$GITHUB_WORKSPACE/reproduction-evidence/dataset-fail-to-pass-selectors.txt"
          (cd upstream-dishka && PYTHONPATH="$GITHUB_WORKSPACE/upstream-dishka/src" "$GITHUB_WORKSPACE/.venv-tests/bin/python" -m pytest -c /dev/null -p no:cacheprovider -q --color=no "${selectors[@]}") > "$GITHUB_WORKSPACE/reproduction-evidence/fixed-dataset-test.log" 2>&1
          cat reproduction-evidence/fixed-dataset-test.log
          grep -E "8 passed in" reproduction-evidence/fixed-dataset-test.log

      - name: Hash and summarize reproduction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd reproduction-evidence && find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          {
            echo "### Dishka #435 exact fail-to-pass reproduction"
            echo "- Buggy base: 8718d5af93f9e48bc2506c64827663fdccc5ad89"
            echo "- Fixed revision: b1eae11734e64551d7b101195f27cb6870e1c364"
            echo "- Same selector: test_issue_435_override_lower_scope"
            echo "- Python: 3.11.9; no pip dependencies installed; stdlib unittest only"
            echo "- Issue reproducer: base fails with AssertionError 1 != 42; fixed revision passes"
            echo "- Dataset FAIL_TO_PASS: all 8 selectors fail on base after test-patch application and pass on fixed revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dishka-issue-435-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: reproduction-evidence/
          if-no-files-found: warn
          retention-days: 90



  dishka-435-raw-provenance-audit:
    needs: no-inference-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Capture raw upstream GitHub and pinned dataset-card payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dishka-raw-provenance
          curl --fail --silent --show-error --location --retry 3 \
            --dump-header dishka-raw-provenance/issue-435-response-headers.txt \
            --output dishka-raw-provenance/issue-435-response.json \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/reagento/dishka/issues/435"
          curl --fail --silent --show-error --location --retry 3 \
