          ).splitlines())
          if changed != expected:
              raise SystemExit(f"Test-only patch changed unexpected paths: {sorted(changed)}")
          with open("reproduction-evidence/dataset-test-patch-scope.json", "w", encoding="utf-8") as f:
              json.dump({
                  "changed_paths_after_test_patch": sorted(changed),
                  "expected_test_only_paths": sorted(expected),
                  "production_code_changed": False,
              }, f, indent=2)
              f.write("\n")
          PY
          sha256sum reproduction-evidence/dataset-test.patch reproduction-evidence/dataset-test-patch-scope.json >> reproduction-evidence/dependency-environment-sha256.txt

      - name: Run exact EODAG dataset selectors on test-only patched buggy base (failure required)
        shell: bash
        run: |
