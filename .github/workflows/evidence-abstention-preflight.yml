  qwen-pinned-license-evidence-no-load:
    needs: no-inference-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Download only the pinned model license and small metadata files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qwen-license-evidence
          REVISION="aa8e72537993ba99e69dfaafa59ed015b17504d1"
          BASE="https://huggingface.co/Qwen/Qwen2.5-3B-Instruct/resolve/${REVISION}"
          curl --fail --silent --show-error --location --retry 3 \
            --dump-header qwen-license-evidence/license-response-headers.txt \
            --output qwen-license-evidence/LICENSE "${BASE}/LICENSE"
          curl --fail --silent --show-error --location --retry 3 \
            --dump-header qwen-license-evidence/config-response-headers.txt \
            --output qwen-license-evidence/config.json "${BASE}/config.json"
          curl --fail --silent --show-error --location --retry 3 \
            --dump-header qwen-license-evidence/tokenizer-config-response-headers.txt \
            --output qwen-license-evidence/tokenizer_config.json "${BASE}/tokenizer_config.json"
          curl --fail --silent --show-error --location --retry 3 \
            --dump-header qwen-license-evidence/revision-response-headers.txt \
            --output qwen-license-evidence/revision-metadata.json \
            "https://huggingface.co/api/models/Qwen/Qwen2.5-3B-Instruct/revision/${REVISION}"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("qwen-license-evidence")
          revision = "aa8e72537993ba99e69dfaafa59ed015b17504d1"
          metadata = json.loads((root / "revision-metadata.json").read_text(encoding="utf-8"))
          config = json.loads((root / "config.json").read_text(encoding="utf-8"))
          license_text = (root / "LICENSE").read_text(encoding="utf-8")

          assert metadata["sha"] == revision
          assert "QWEN RESEARCH LICENSE AGREEMENT" in license_text.upper()
          assert config.get("model_type") == "qwen2"
          assert config.get("num_hidden_layers") == 36
          license_sha = hashlib.sha256((root / "LICENSE").read_bytes()).hexdigest()
          summary = {
              "model_id": "Qwen/Qwen2.5-3B-Instruct",
              "immutable_revision": revision,
              "verified_revision_sha": metadata["sha"],
              "model_type": config["model_type"],
              "num_hidden_layers": config["num_hidden_layers"],
              "license_title_detected": "QWEN RESEARCH LICENSE AGREEMENT",
              "license_file_sha256": license_sha,
              "license_use_review_status": "evidence_collected_human_noncommercial_scope_review_still_required",
              "model_weights_downloaded": False,
              "model_loaded": False,
              "tokenizer_loaded": False,
              "inference_performed": False,
              "fine_tuning_performed": False
          }
          (root / "license-evidence-summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY
          (cd qwen-license-evidence && sha256sum ./* > SHA256SUMS.txt)

      - name: Upload pinned model license evidence without weights or inference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-pinned-license-evidence-no-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: qwen-license-evidence/
          if-no-files-found: error
          retention-days: 90


  nox-issue-919-reproduction:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_non_dishka_candidates }}
    needs: no-inference-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up exact Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Create deterministic broken pyenv uv shim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-shim"
          cat > "$RUNNER_TEMP/uv-shim/uv" <<'SH'
          #!/bin/sh
          echo "pyenv: uv: command not found" >&2
          exit 127
          SH
          chmod +x "$RUNNER_TEMP/uv-shim/uv"
          echo "$RUNNER_TEMP/uv-shim" >> "$GITHUB_PATH"

      - name: Install pinned runtime and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -VV
          python -m venv .venv-tests
          .venv-tests/bin/python -m pip install --disable-pip-version-check --no-deps -r research_candidates/evidence_abstention/reproduction/nox_issue_919/dataset_test_requirements.lock

      - name: Record dependency license metadata before source execution
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/sirosen/dependency-groups.git dependency-groups-license-source
          git -C dependency-groups-license-source checkout --detach 1c99d4a6e50504354ef501e5f8543a22830c788d
          test "$(git -C dependency-groups-license-source rev-parse HEAD)" = "1c99d4a6e50504354ef501e5f8543a22830c788d"
          test "$(git -C dependency-groups-license-source rev-parse HEAD:LICENSE.txt)" = "b9723b85ed7adb32f8c2b4ee880c06ec3061da50"
          test "$(git -C dependency-groups-license-source rev-parse HEAD:pyproject.toml)" = "db86f496d8dc41647df91b76d0b1319b9aa94974"
          grep -F 'license = { text = "MIT" }' dependency-groups-license-source/pyproject.toml
          git clone https://github.com/python-attrs/attrs.git attrs-license-source
          git -C attrs-license-source checkout --detach 598494a618410490cfbe0c896b7a544f6d23e0d9
          test "$(git -C attrs-license-source rev-parse HEAD)" = "598494a618410490cfbe0c896b7a544f6d23e0d9"
          test "$(git -C attrs-license-source rev-parse HEAD:LICENSE)" = "2bd6453d255e19b973f19b128596a8b6dd65b2c3"
          test "$(git -C attrs-license-source rev-parse HEAD:pyproject.toml)" = "0b598099fdd945dcb75f3145909a9b4a85a93972"
          grep -F 'license = "MIT"' attrs-license-source/pyproject.toml
          grep -F 'license-files = ["LICENSE"]' attrs-license-source/pyproject.toml
          .venv-tests/bin/python - <<'PY'
          import importlib.metadata as md
          import json
          from pathlib import Path
          names = ["argcomplete", "attrs", "colorlog", "dependency-groups", "packaging", "virtualenv", "pytest", "iniconfig", "pluggy", "pygments", "distlib", "filelock", "platformdirs"]
          inventory = {}
          for name in names:
              dist = md.metadata(name)
              classifiers = [x for x in dist.get_all("Classifier", []) if x.startswith("License ::")]
              license_text = dist.get("License") or dist.get("License-Expression")
              evidence = None
              if not license_text and not classifiers:
                  if name == "dependency-groups" and md.version(name) == "1.3.0" and Path("dependency-groups-license-source/LICENSE.txt").is_file():
                      license_text = "MIT"
                      evidence = {
                          "source_repository": "https://github.com/sirosen/dependency-groups",
                          "source_commit": "1c99d4a6e50504354ef501e5f8543a22830c788d",
                          "license_file": "LICENSE.txt",
                          "license_file_git_blob_sha": "b9723b85ed7adb32f8c2b4ee880c06ec3061da50",
                          "pyproject_git_blob_sha": "db86f496d8dc41647df91b76d0b1319b9aa94974",
                      }
                  elif name == "attrs" and md.version(name) == "24.3.0" and Path("attrs-license-source/LICENSE").is_file():
                      license_text = "MIT"
                      evidence = {
                          "source_repository": "https://github.com/python-attrs/attrs",
                          "source_tag": "24.3.0",
                          "source_commit": "598494a618410490cfbe0c896b7a544f6d23e0d9",
                          "license_file": "LICENSE",
                          "license_file_git_blob_sha": "2bd6453d255e19b973f19b128596a8b6dd65b2c3",
                          "pyproject_git_blob_sha": "0b598099fdd945dcb75f3145909a9b4a85a93972",
                      }
                  else:
                      raise SystemExit(f"License metadata missing for {name}; stop before source tests")
              inventory[name] = {"version": md.version(name), "license": license_text, "license_expression": dist.get("License-Expression"), "license_classifiers": classifiers, "manual_source_license_evidence": evidence}
          with open("dependency-license-inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps(inventory, indent=2, ensure_ascii=False))
          PY

      - name: Extract and authenticate exact SWE-rebench row
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproduction-evidence
          python -m venv .venv-dataset
          .venv-dataset/bin/python -m pip install --disable-pip-version-check --no-deps pyarrow==19.0.1
          .venv-dataset/bin/python - <<'PY'
          import importlib.metadata as md
          dist = md.metadata("pyarrow")
          classifiers = [x for x in dist.get_all("Classifier", []) if x.startswith("License ::")]
          license_text = dist.get("License") or dist.get("License-Expression")
          if not license_text and not classifiers:
              raise SystemExit("pyarrow license metadata missing; stop")
          print({"pyarrow": md.version("pyarrow"), "license": license_text, "classifiers": classifiers})
          PY
          curl --fail --location --retry 3 --retry-delay 2 "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet" --output reproduction-evidence/train-00000-of-00001.parquet
          echo "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9  reproduction-evidence/train-00000-of-00001.parquet" | sha256sum --check
          .venv-dataset/bin/python - <<'PY'
          import hashlib
          import json
          import pyarrow.parquet as pq
          path = "reproduction-evidence/train-00000-of-00001.parquet"
          columns = ["instance_id", "repo", "base_commit", "created_at", "language", "license", "FAIL_TO_PASS", "problem_statement"]
          table = pq.read_table(path, columns=columns, filters=[("instance_id", "=", "wntrblm__nox-922")])
          rows = table.to_pylist()
          assert len(rows) == 1, len(rows)
          row = rows[0]
          assert row["repo"] == "wntrblm/nox", row
          assert row["base_commit"] == "97e0fad6a4036d610591a52e9ad0cfbe74a31af3", row
          assert str(row["created_at"]).replace("T", " ")[:19] == "2025-01-31 20:53:30", row
          assert row["language"] == "python", row
          assert row["license"] == "Apache-2.0", row
          assert row["FAIL_TO_PASS"], "Dataset row has no FAIL_TO_PASS selectors"
          canonical = json.dumps(row, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          with open("reproduction-evidence/dataset-row-canonical.json", "wb") as f:
              f.write(canonical)
          digest = hashlib.sha256(canonical).hexdigest()
          with open("reproduction-evidence/dataset-row-sha256.txt", "w", encoding="utf-8") as f:
              f.write(digest + "  dataset-row-canonical.json\n")
          with open("reproduction-evidence/dataset-fail-to-pass-selectors.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(row["FAIL_TO_PASS"]) + "\n")
          print("dataset_row_sha256=" + digest)
          print("fail_to_pass=" + json.dumps(row["FAIL_TO_PASS"], ensure_ascii=False))
          PY
          rm reproduction-evidence/train-00000-of-00001.parquet

      - name: Clone exact upstream source and prepare pinned patch
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/wntrblm/nox.git upstream-nox
          git -C upstream-nox fetch --no-tags origin 97e0fad6a4036d610591a52e9ad0cfbe74a31af3 5c4000550325fd1ad036716d9e600ef7411bed3d
          git -C upstream-nox cat-file -e '97e0fad6a4036d610591a52e9ad0cfbe74a31af3^{commit}'
          git -C upstream-nox cat-file -e '5c4000550325fd1ad036716d9e600ef7411bed3d^{commit}'
          git -C upstream-nox diff 97e0fad6a4036d610591a52e9ad0cfbe74a31af3 5c4000550325fd1ad036716d9e600ef7411bed3d > reproduction-evidence/pr-922-full.patch
          git -C upstream-nox diff 97e0fad6a4036d610591a52e9ad0cfbe74a31af3 5c4000550325fd1ad036716d9e600ef7411bed3d -- tests/test_virtualenv.py > reproduction-evidence/dataset-test.patch
          sha256sum research_candidates/evidence_abstention/reproduction/nox_issue_919/test_issue_919.py research_candidates/evidence_abstention/reproduction/nox_issue_919/dataset_test_requirements.lock > reproduction-evidence/reproducer-and-lock-sha256.txt
          sha256sum reproduction-evidence/pr-922-full.patch reproduction-evidence/dataset-test.patch reproduction-evidence/dataset-row-canonical.json > reproduction-evidence/source-and-dataset-sha256.txt

      - name: Run independent issue reproducer on buggy base (failure required)
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-nox checkout --detach 97e0fad6a4036d610591a52e9ad0cfbe74a31af3
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/upstream-nox" .venv-tests/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/reproduction/nox_issue_919" -p "test_issue_919.py" -v > reproduction-evidence/base-issue-test.log 2>&1
          status=$?
          set -e
          cat reproduction-evidence/base-issue-test.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the broken pyenv uv shim reproducer to fail on the buggy base." >&2
            exit 1
          fi
          grep -F "AssertionError: True is not false" reproduction-evidence/base-issue-test.log

      - name: Run dataset selectors on buggy base with test-only diff
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-nox checkout --detach 97e0fad6a4036d610591a52e9ad0cfbe74a31af3
          git -C upstream-nox apply "$GITHUB_WORKSPACE/reproduction-evidence/dataset-test.patch"
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/upstream-nox" .venv-tests/bin/python "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/implementation/run_swe_rebench_fail_to_pass.py" \
            --source-dir "$GITHUB_WORKSPACE/upstream-nox" \
            --selectors-file "$GITHUB_WORKSPACE/reproduction-evidence/dataset-fail-to-pass-selectors.txt" \
            --expect base-fail \
            --log-file "$GITHUB_WORKSPACE/reproduction-evidence/base-dataset-tests.json" \
            > "$GITHUB_WORKSPACE/reproduction-evidence/base-dataset-test.log" 2>&1
          status=$?
          set -e
          cat reproduction-evidence/base-dataset-test.log
          if [ "$status" -ne 0 ]; then
            echo "Dataset selectors did not all execute and fail on the pinned buggy source." >&2
            exit "$status"
          fi
      - name: Run the same dataset selectors on the exact fixed revision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-nox checkout --detach --force 5c4000550325fd1ad036716d9e600ef7411bed3d
          PYTHONPATH="$GITHUB_WORKSPACE/upstream-nox" .venv-tests/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/reproduction/nox_issue_919" -p "test_issue_919.py" -v > reproduction-evidence/fixed-issue-test.log 2>&1
          cat reproduction-evidence/fixed-issue-test.log
          grep -F "Ran 1 test" reproduction-evidence/fixed-issue-test.log
          grep -E "^OK$" reproduction-evidence/fixed-issue-test.log
          PYTHONPATH="$GITHUB_WORKSPACE/upstream-nox" .venv-tests/bin/python "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/implementation/run_swe_rebench_fail_to_pass.py" \
            --source-dir "$GITHUB_WORKSPACE/upstream-nox" \
            --selectors-file "$GITHUB_WORKSPACE/reproduction-evidence/dataset-fail-to-pass-selectors.txt" \
            --expect fixed-pass \
            --log-file "$GITHUB_WORKSPACE/reproduction-evidence/fixed-dataset-tests.json" \
            > "$GITHUB_WORKSPACE/reproduction-evidence/fixed-dataset-test.log" 2>&1
          cat reproduction-evidence/fixed-dataset-test.log
      - name: Prepare raw reproduction artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproduction-evidence
          if [ -f dependency-license-inventory.json ]; then cp dependency-license-inventory.json reproduction-evidence/; fi
          cp research_candidates/evidence_abstention/DEPENDENCY_GROUPS_1_3_0_LICENSE_REVIEW_2026-11-16.md reproduction-evidence/
          cp dependency-groups-license-source/LICENSE.txt reproduction-evidence/dependency-groups-LICENSE.txt
          cp dependency-groups-license-source/pyproject.toml reproduction-evidence/dependency-groups-pyproject.toml
          cp research_candidates/evidence_abstention/ATTRS_24_3_0_LICENSE_REVIEW_2026-11-16.md reproduction-evidence/
          cp attrs-license-source/LICENSE reproduction-evidence/attrs-LICENSE
          cp attrs-license-source/pyproject.toml reproduction-evidence/attrs-pyproject.toml
          git -C dependency-groups-license-source rev-parse HEAD > reproduction-evidence/dependency-groups-source-commit.txt
          git -C attrs-license-source rev-parse HEAD > reproduction-evidence/attrs-source-commit.txt
          (cd reproduction-evidence && find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          {
            echo "### Nox #919 exact fail-to-pass reproduction"
            echo "- Buggy base: 97e0fad6a4036d610591a52e9ad0cfbe74a31af3"
            echo "- Fixed revision: 5c4000550325fd1ad036716d9e600ef7411bed3d"
            echo "- Independent reproducer: PATH-visible uv shim exits 127; base must report HAS_UV=True and fixed revision HAS_UV=False"
            echo "- Dataset FAIL_TO_PASS selectors are extracted from the exact pinned Parquet row"
            echo "- No model loading, inference, or training"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-issue-919-reproduction
          path: reproduction-evidence/
          if-no-files-found: warn
          retention-days: 90


  numpyro-issue-1916-reproduction:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_non_dishka_candidates }}
    needs: no-inference-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      XLA_FLAGS: "--xla_force_host_platform_device_count=2 --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
    steps:
