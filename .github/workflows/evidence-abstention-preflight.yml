          inventory = {"pyarrow": {"version": md.version("pyarrow"), "license": license_text, "license_classifiers": classifiers}}
          import json
          with open("reproduction-evidence/dataset-extraction-license-inventory.json", "w", encoding="utf-8") as f:
              json.dump(inventory, f, indent=2)
              f.write("\\n")
          print(inventory)
          PY
          curl --fail --location --retry 3 --retry-delay 2 "https://huggingface.co/datasets/PrimeIntellect/SWE-rebench-V2-Filtered-Verified/resolve/fb9aa226b2ce37c708ea7732e7b980abacdadb67/data/train-00000-of-00001.parquet" --output reproduction-evidence/train-00000-of-00001.parquet
          echo "7416e352008b35480c82610cf4f5edf160dd269ed6bf382a22bd4c17daed24b9  reproduction-evidence/train-00000-of-00001.parquet" | sha256sum --check
          .venv-dataset/bin/python - <<'PY'
          import hashlib
          import json
          import pyarrow.parquet as pq
          path = "reproduction-evidence/train-00000-of-00001.parquet"
          columns = ["instance_id", "repo", "base_commit", "created_at", "language", "license", "FAIL_TO_PASS", "problem_statement"]
          table = pq.read_table(path, columns=columns, filters=[("instance_id", "=", "CS-SI__eodag-1536")])
          rows = table.to_pylist()
          assert len(rows) == 1, len(rows)
          row = rows[0]
          assert row["repo"] == "CS-SI/eodag", row
          assert row["base_commit"] == "b7cc06e19025e5bbf14e28a0975f1749e21e9be3", row
          assert row["language"] == "python", row
          assert row["license"] == "Apache-2.0", row
          assert str(row["created_at"]).replace("T", " ")[:19] == "2025-02-21 10:04:30", row
          canonical = json.dumps(row, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          with open("reproduction-evidence/dataset-row-canonical.json", "wb") as f:
              f.write(canonical)
          digest = hashlib.sha256(canonical).hexdigest()
          with open("reproduction-evidence/dataset-row-sha256.txt", "w", encoding="utf-8") as f:
              f.write(digest + "  dataset-row-canonical.json\n")
          with open("reproduction-evidence/dataset-fail-to-pass-selectors.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(row["FAIL_TO_PASS"]) + "\n")
          print("dataset_row_sha256=" + digest)
          print("dataset_created_at=" + str(row["created_at"]))
          print("fail_to_pass=" + json.dumps(row["FAIL_TO_PASS"], ensure_ascii=False))
          PY
          rm reproduction-evidence/train-00000-of-00001.parquet

      - name: Prepare and upload raw EODAG reproduction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproduction-evidence
          (cd reproduction-evidence && find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          {
            echo "### EODAG #1530 minimal YAML duplicate-key reproducer"
            echo "- Buggy base: b7cc06e19025e5bbf14e28a0975f1749e21e9be3"
            echo "- Fixed revision: 312966a46513a082333d46cd7212bdce36aaf769"
            echo "- Minimal runtime: Python 3.11.9 + PyYAML 6.0.2"
            echo "- Dataset FAIL_TO_PASS selectors were captured but not executed in this minimal environment"
            echo "- No model loading, inference, or training"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw EODAG reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
