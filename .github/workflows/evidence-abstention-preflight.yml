          EODAG_SOURCE_ROOT="$GITHUB_WORKSPACE/upstream-eodag" .venv-tests/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/research_candidates/evidence_abstention/reproduction/eodag_issue_1530" -p "test_issue_1530.py" -v > reproduction-evidence/fixed-issue-test.log 2>&1
