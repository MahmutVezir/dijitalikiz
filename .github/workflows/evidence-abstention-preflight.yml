      - name: Upload raw EODAG reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eodag-issue-1530-reproduction
          path: reproduction-evidence/
          if-no-files-found: warn
          retention-days: 90


  moto-issue-8269-reproduction:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_non_dishka_candidates }}
