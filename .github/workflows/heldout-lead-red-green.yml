name: Held-out Lead Red-Green Screening

on:
  pull_request:
    paths:
      - ".github/heldout-lead-red-green-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heldout-lead-screening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Screen candidate (no model inference)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case_id: netty-17623-negative-search-domain-cache
            repo: netty/netty
            module: resolver-dns
            pre_fix: de7fa8997db278b83f56b22f89b691be58ae88ba
            fix: 1addbf90c4fd35713c61e5c54ad4d21c14d7df1d
            tests: DnsNameResolverTest#testNegativelyCachedSearchDomainDoesNotShadowPositiveOne,DnsNameResolverTest#testNegativelyCachedSearchDomainDoesNotShadowUncachedOne,DnsNameResolverTest#testNegativelyCachedBareHostnameStillShortCircuits
            # The bare-hostname case is a baseline control; it should pass before and after the fix.
            red_tests: DnsNameResolverTest#testNegativelyCachedSearchDomainDoesNotShadowPositiveOne,DnsNameResolverTest#testNegativelyCachedSearchDomainDoesNotShadowUncachedOne
            pre_fix_pass_tests: DnsNameResolverTest#testNegativelyCachedBareHostnameStillShortCircuits
            test_files: resolver-dns/src/test/java/io/netty/resolver/dns/DnsNameResolverTest.java

          - case_id: netty-17764-tls13-signature-algorithm-key-selection
            repo: netty/netty
            module: handler
            java_version: "21"
            pre_fix: 3eaff63caf06a582cc3df72422aa1124734b46c6
            fix: 84c167ea85e0d7f5b40caec6cab859018f9490bd
            tests: PkiTestingTlsTest#connectWithEd25519,PkiTestingTlsTest#connectWithEd25519AndRsa,PkiTestingTlsTest#connectWithEd25519FailsWithoutCommonSignatureAlgorithm
            test_files: handler/src/test/java/io/netty/handler/ssl/PkiTestingTlsTest.java

          - case_id: collections-724-indexed-collection-iterator-index-drift
            repo: apache/commons-collections
            pre_fix: 3ff49116a265817f7546f72052e3d0478c159e62
            fix: 651a6218910a906dc50415c145d63ba06c07a659
            tests: IndexedCollectionTest#testIteratorRemoveUpdatesIndex
            test_files: src/test/java/org/apache/commons/collections4/collection/IndexedCollectionTest.java

          - case_id: collections-720-synchronized-collection-foreach-lock
            repo: apache/commons-collections
            pre_fix: d58a5e3a1258877bd94ba79db9f8a5f90892624b
            fix: 6ee9dd78c79f367dd8e3e1655e4664bcec960ad6
            tests: SynchronizedCollectionTest#testForEachHoldsLock
            test_files: src/test/java/org/apache/commons/collections4/collection/SynchronizedCollectionTest.java

          - case_id: lang-1795-fastdateformat-mutable-timezone-cache-leak
            repo: apache/commons-lang
            pre_fix: d235f1e997523d7a3d9d1c63e9a1853c2ab728fd
            fix: 117a9ea791b87af1b90413fa8290891ca3106cfd
            tests: FastDateFormatTest#testTimeZoneArgumentIsCopied,FastDateFormatTest#testTimeZoneGetterReturnsCopy,FastDateParserTest#testTimeZoneIsCopied
            test_files: src/test/java/org/apache/commons/lang3/time/FastDateFormatTest.java src/test/java/org/apache/commons/lang3/time/FastDateParserTest.java

          - case_id: compress-797-lz77-back-reference-window-bound
            repo: apache/commons-compress
            pre_fix: 4a17b64939b782a5e95c5aecfd583b631cb58522
            fix: cebee156fe66578b5142b4176e6c408a76d65c0c
            tests: AbstractLZ77CompressorInputStreamTest#testBackReferenceOffsetLargerThanWindowIsRejected
            test_files: src/test/java/org/apache/commons/compress/compressors/lz77support/AbstractLZ77CompressorInputStreamTest.java


    env:
      UPSTREAM_REPO: ${{ matrix.repo }}
      PRE_FIX_SHA: ${{ matrix.pre_fix }}
      FIX_SHA: ${{ matrix.fix }}
      TEST_TARGETS: ${{ matrix.tests }}
      RED_TEST_TARGETS: ${{ matrix.red_tests || matrix.tests }}
      PRE_FIX_PASS_TARGETS: ${{ matrix.pre_fix_pass_tests || '' }}
      TEST_FILES: ${{ matrix.test_files }}
      CASE_ID: ${{ matrix.case_id }}
      MAVEN_MODULE: ${{ matrix.module || '' }}
      BUILD_TOOL: ${{ matrix.build_tool || 'maven' }}
      GRADLE_TEST_FILTERS: ${{ matrix.gradle_test_filters || '' }}
      TEST_PATCH_ADJUSTMENT: ${{ matrix.test_patch_adjustment || '' }}

    steps:
      - name: Checkout research repository for screening evidence
        uses: actions/checkout@v5

      - name: Set up Java for pinned candidate
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version || '17' }}

      - name: Clone upstream and pin exact revisions
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          git clone --quiet --filter=blob:none "https://github.com/$UPSTREAM_REPO.git" "$SRC"
          git -C "$SRC" fetch --quiet --no-tags origin "$PRE_FIX_SHA"
          git -C "$SRC" fetch --quiet --no-tags origin "$FIX_SHA"
          git -C "$SRC" checkout --detach "$PRE_FIX_SHA"
          OUT="$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID"
          mkdir -p "$OUT"
          {
            echo "case_id=$CASE_ID"
            echo "repository=$UPSTREAM_REPO"
            echo "pre_fix_sha=$PRE_FIX_SHA"
            echo "fix_sha=$FIX_SHA"
            echo "test_targets=$TEST_TARGETS"
            echo "build_tool=$BUILD_TOOL"
            echo "purpose=screening_only_no_model_inference"
          } > "$OUT/metadata.txt"

      - name: Install pinned Commons Parent 104 for Compress 1.29 snapshot
        if: matrix.case_id == 'compress-805-pack200-error-propagation'
        shell: bash
        run: |
          set -euo pipefail
          PARENT_DIR="$RUNNER_TEMP/commons-parent"
          PARENT_SHA="9066f72892fba9af187520ba37889ae068a333ba"
          OUT="$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID"
          git clone --quiet --filter=blob:none https://github.com/apache/commons-parent.git "$PARENT_DIR"
          git -C "$PARENT_DIR" fetch --quiet --no-tags origin "$PARENT_SHA"
          git -C "$PARENT_DIR" checkout --detach "$PARENT_SHA"
          test "$(git -C "$PARENT_DIR" rev-parse HEAD)" = "$PARENT_SHA"
          grep -q '<groupId>org.apache.commons</groupId>' "$PARENT_DIR/pom.xml"
          grep -q '<artifactId>commons-parent</artifactId>' "$PARENT_DIR/pom.xml"
          grep -q '<version>104</version>' "$PARENT_DIR/pom.xml"
          sha256sum "$PARENT_DIR/pom.xml" > "$OUT/commons-parent-104-pom.sha256"
          (cd "$PARENT_DIR" && mvn -B -ntp -N install) > "$OUT/commons-parent-104-install.log" 2>&1 || {
            cat "$OUT/commons-parent-104-install.log"
            echo "BLOCKED: could not install pinned Apache Commons Parent 104 POM."
            exit 1
          }
          {
            echo "commons_parent_sha=$PARENT_SHA"
            echo "commons_parent_revision=commons-parent-104-RC1"
            echo "commons_parent_coordinate=org.apache.commons:commons-parent:104:pom"
            echo "commons_parent_pom_sha256=$(cut -d ' ' -f 1 "$OUT/commons-parent-104-pom.sha256")"
            echo "purpose=resolve_immutable_upstream_parent_only"
          } > "$OUT/commons-parent-104-metadata.txt"

      - name: Apply only the pinned test-file diff to the pre-fix revision
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          OUT="$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID"
          mkdir -p "$OUT"
          for test_file in $TEST_FILES; do
            mkdir -p "$SRC/$(dirname "$test_file")"
          done
          PATCH="$OUT/regression-tests.patch"
          git -C "$SRC" diff --binary "$PRE_FIX_SHA" "$FIX_SHA" -- $TEST_FILES > "$PATCH"
          if [ ! -s "$PATCH" ]; then
            echo "BLOCKED: no test-file diff exists between pinned revisions."
            exit 2
          fi
          git -C "$SRC" apply --check "$PATCH"
          git -C "$SRC" apply "$PATCH"
          case "$TEST_PATCH_ADJUSTMENT" in
            "")
              ;;
            spring-create-request-resource)
              if [ "$CASE_ID" != "spring-37285-part-spill-disk-limit" ] || [ "$TEST_FILES" != "spring-web/src/test/java/org/springframework/http/codec/multipart/DefaultPartHttpMessageReaderTests.java" ]; then
                echo "BLOCKED: test patch adjustment is not scoped to its declared case."
                exit 2
              fi
              python - "$SRC/$TEST_FILES" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          needle = 'createRequest("files.multipart",'
          replacement = 'createRequest(new ClassPathResource("files.multipart", getClass()),'
          if text.count(needle) != 1:
              raise SystemExit("BLOCKED: expected exactly one broken Resource-helper argument in the pinned test fixture.")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
              ;;
            *)
              echo "BLOCKED: unsupported test patch adjustment: $TEST_PATCH_ADJUSTMENT"
              exit 2
              ;;
          esac
          sha256sum "$PATCH" | awk '{print $1}' > "$OUT/regression-tests.patch.sha256"
          (cd "$SRC" && sha256sum $TEST_FILES) > "$OUT/pre-fix-test-file-hashes.txt"
          {
            echo "test_patch_sha256=$(cat "$OUT/regression-tests.patch.sha256")"
            echo "test_patch_source=$PRE_FIX_SHA..$FIX_SHA"
            echo "test_patch_policy=diff_only_no_full_test_file_replacement"
            if [ -n "$TEST_PATCH_ADJUSTMENT" ]; then
              echo "test_patch_adjustment=$TEST_PATCH_ADJUSTMENT"
              echo "test_patch_adjustment_reason=upstream_test_fixture_called_createRequest_with_String_but_local_helper_requires_Resource"
            fi
          } >> "$OUT/metadata.txt"

      - name: Require regression tests to fail on the pinned pre-fix revision
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          LOG="$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID/pre-fix-build.log"
          set +e
          if [ "$BUILD_TOOL" = "gradle" ]; then
            if [ -z "$GRADLE_TEST_FILTERS" ]; then
              echo "BLOCKED: Gradle candidate is missing explicit test filters."
              exit 2
            fi
            (cd "$SRC" && ./gradlew --no-daemon ":$MAVEN_MODULE:test" --tests "$GRADLE_TEST_FILTERS") > "$LOG" 2>&1
          elif [ -n "$MAVEN_MODULE" ]; then
            (cd "$SRC" && mvn -B -ntp -pl "$MAVEN_MODULE" -am clean -Dtest="$TEST_TARGETS" -Dsurefire.failIfNoSpecifiedTests=false test) > "$LOG" 2>&1
          else
            (cd "$SRC" && mvn -B -ntp clean -Dtest="$TEST_TARGETS" test) > "$LOG" 2>&1
          fi
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: regression unexpectedly passed on pre-fix revision."
            cat "$LOG"
            exit 1
          fi
          export EVIDENCE_DIR="$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID"
          python - "$SRC" "$TEST_TARGETS" "$RED_TEST_TARGETS" "$PRE_FIX_PASS_TARGETS" <<'PY'
          import json, os, sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          report_dir = Path(sys.argv[1])
          all_targets = [item.strip() for item in sys.argv[2].split(",") if item.strip()]
          red_targets = [item.strip() for item in sys.argv[3].split(",") if item.strip()]
          pass_targets = [item.strip() for item in sys.argv[4].split(",") if item.strip()]
          cases = []
          for file in report_dir.rglob("TEST-*.xml") if report_dir.exists() else []:
              try:
                  root = ET.parse(file).getroot()
              except ET.ParseError:
                  continue
              for node in root.iter("testcase"):
                  cases.append((node.get("classname", ""), node.get("name", ""), node))

          def matches_for(target):
              class_name, method = target.split("#", 1)
              return [(cn, name, node) for cn, name, node in cases
                      if cn.endswith("." + class_name) and (name == method or name.startswith(method + "("))]

          # Every named target must execute. Only defect-specific tests must fail pre-fix.
          for target in all_targets:
              matches = matches_for(target)
              if not matches:
                  raise SystemExit(f"BLOCKED: named test did not execute on pre-fix revision: {target}")
              if any(node.find("skipped") is not None for _, _, node in matches):
                  raise SystemExit(f"BLOCKED: named test was skipped on pre-fix revision: {target}")

          result = []
          for target in red_targets:
              matches = matches_for(target)
              failed = [node for _, _, node in matches
                        if node.find("failure") is not None or node.find("error") is not None]
              if not failed:
                  raise SystemExit(f"BLOCKED: defect-specific test did not demonstrate a pre-fix regression failure: {target}")
              result.append({"test": target, "pre_fix_result": "failed_as_expected", "failure_count": len(failed)})

          for target in pass_targets:
              matches = matches_for(target)
              bad = [node for _, _, node in matches
                     if node.find("failure") is not None or node.find("error") is not None or node.find("skipped") is not None]
              if not matches or bad:
                  raise SystemExit(f"BLOCKED: baseline control did not pass on pre-fix revision: {target}")
              result.append({"test": target, "pre_fix_result": "passed_as_expected_control", "pass_count": len(matches)})

          payload = {"status": "red_confirmed", "tests": result}
          out = Path(os.environ["EVIDENCE_DIR"]) / "red-result.json"
          out.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Require the same tests to pass on the pinned fixed revision
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/upstream"
          LOG="$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID/fixed-build.log"
          git -C "$SRC" reset --hard "$FIX_SHA"
          case "$TEST_PATCH_ADJUSTMENT" in
            "")
              ;;
            spring-create-request-resource)
              if [ "$CASE_ID" != "spring-37285-part-spill-disk-limit" ] || [ "$TEST_FILES" != "spring-web/src/test/java/org/springframework/http/codec/multipart/DefaultPartHttpMessageReaderTests.java" ]; then
                echo "BLOCKED: test patch adjustment is not scoped to its declared case."
                exit 2
              fi
              python - "$SRC/$TEST_FILES" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          needle = 'createRequest("files.multipart",'
          replacement = 'createRequest(new ClassPathResource("files.multipart", getClass()),'
          if text.count(needle) != 1:
              raise SystemExit("BLOCKED: expected exactly one broken Resource-helper argument in the pinned test fixture.")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
              ;;
            *)
              echo "BLOCKED: unsupported test patch adjustment: $TEST_PATCH_ADJUSTMENT"
              exit 2
              ;;
          esac
          (cd "$SRC" && sha256sum $TEST_FILES) > "$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID/fixed-test-file-hashes.txt"
          if ! diff -u "$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID/pre-fix-test-file-hashes.txt" "$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID/fixed-test-file-hashes.txt"; then
            echo "BLOCKED: regression test fixture differs between pinned revisions after applying the declared adjustment."
            exit 2
          fi
          if [ "$BUILD_TOOL" = "gradle" ]; then
            if [ -z "$GRADLE_TEST_FILTERS" ]; then
              echo "BLOCKED: Gradle candidate is missing explicit test filters."
              exit 2
            fi
            (cd "$SRC" && ./gradlew --no-daemon ":$MAVEN_MODULE:test" --tests "$GRADLE_TEST_FILTERS") > "$LOG" 2>&1 || {
              cat "$LOG"
              echo "ERROR: regression tests did not pass on fixed revision."
              exit 1
            }
          elif [ -n "$MAVEN_MODULE" ]; then
            (cd "$SRC" && mvn -B -ntp -pl "$MAVEN_MODULE" -am clean -Dtest="$TEST_TARGETS" -Dsurefire.failIfNoSpecifiedTests=false test) > "$LOG" 2>&1 || {
              cat "$LOG"
              echo "ERROR: regression tests did not pass on fixed revision."
              exit 1
            }
          else
            (cd "$SRC" && mvn -B -ntp clean -Dtest="$TEST_TARGETS" test) > "$LOG" 2>&1 || {
              cat "$LOG"
              echo "ERROR: regression tests did not pass on fixed revision."
              exit 1
            }
          fi
          export EVIDENCE_DIR="$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID"
          python - "$SRC" "$TEST_TARGETS" <<'PY'
          import json, os, sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          report_dir = Path(sys.argv[1])
          targets = [item.strip() for item in sys.argv[2].split(",") if item.strip()]
          cases = []
          for file in report_dir.rglob("TEST-*.xml") if report_dir.exists() else []:
              try:
                  root = ET.parse(file).getroot()
              except ET.ParseError:
                  continue
              for node in root.iter("testcase"):
                  cases.append((node.get("classname", ""), node.get("name", ""), node))
          result = []
          for target in targets:
              class_name, method = target.split("#", 1)
              matches = [(cn, name, node) for cn, name, node in cases
                         if cn.endswith("." + class_name) and (name == method or name.startswith(method + "("))]
              if not matches:
                  raise SystemExit(f"BLOCKED: targeted regression test did not execute on fixed revision: {target}")
              bad = [node for _, _, node in matches
                     if node.find("failure") is not None or node.find("error") is not None or node.find("skipped") is not None]
              if bad:
                  raise SystemExit(f"FAILED: test did not pass cleanly on fixed revision: {target}")
              result.append({"test": target, "fixed_result": "passed"})
          payload = {"status": "green_confirmed", "tests": result}
          out = Path(os.environ["EVIDENCE_DIR"]) / "green-result.json"
          out.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY
          {
            echo "status=red_green_pass"
            echo "pre_fix_sha=$PRE_FIX_SHA"
            echo "fixed_sha=$FIX_SHA"
            echo "test_targets=$TEST_TARGETS"
          } > "$GITHUB_WORKSPACE/heldout-lead-screening/$CASE_ID/result.txt"

      - name: Upload source-screening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-lead-screening-${{ matrix.case_id }}
          path: heldout-lead-screening/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 90
